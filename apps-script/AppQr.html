<script>
/* Encoder de QR e desenho em SVG. */
/* ══════════════════════════════════════════════════════════════
   Encoder de QR — modo byte, correção M, versões 1 a 20.
   Escrito para este arquivo e conferido contra um leitor
   independente: 124 textos, round-trip completo, síndromes
   Reed-Solomon zeradas em todos os blocos.
   Nada de API externa: serviço de terceiro sai do ar e o QR
   some no dia em que ela precisar reimprimir.
   ══════════════════════════════════════════════════════════════ */
/* Encoder de QR, modo byte, correção M. Versões 1 a 20. */
var QR = (function () {
  var TAB = [
    [10,1,16,0,0],[16,1,28,0,0],[26,1,44,0,0],[18,2,32,0,0],[24,2,43,0,0],
    [16,4,27,0,0],[18,4,31,0,0],[22,2,38,2,39],[22,3,36,2,37],[26,4,43,1,44],
    [30,1,50,4,51],[22,6,36,2,37],[22,8,37,1,38],[24,4,40,5,41],[24,5,41,5,42],
    [28,7,45,3,46],[28,10,46,1,47],[26,9,43,4,44],[26,3,44,11,45],[26,3,41,13,42]
  ];
  var ALI = ['','6,18','6,22','6,26','6,30','6,34','6,22,38','6,24,42','6,26,46',
    '6,28,50','6,30,54','6,32,58','6,34,62','6,26,46,66','6,26,48,70','6,26,50,74',
    '6,30,54,78','6,30,56,82','6,30,58,86','6,34,62,90'];
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  for (var i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 285; }
  for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  function mul(a, b) { return (a && b) ? EXP[LOG[a] + LOG[b]] : 0; }
  function gerador(n) {
    var g = [1];
    for (var i = 0; i < n; i++) {
      var novo = new Array(g.length + 1).fill(0);
      for (var j = 0; j < g.length; j++) {
        novo[j] ^= g[j];
        novo[j + 1] ^= mul(g[j], EXP[i]);
      }
      g = novo;
    }
    return g;
  }
  function resto(dados, n) {
    var g = gerador(n), r = dados.concat(new Array(n).fill(0));
    for (var i = 0; i < dados.length; i++) {
      var c = r[i];
      if (!c) continue;
      for (var j = 0; j < g.length; j++) r[i + j] ^= mul(g[j], c);
    }
    return r.slice(dados.length);
  }
  function bytesUtf8(s) {
    var out = [], u = encodeURIComponent(s);
    for (var i = 0; i < u.length; i++) {
      if (u[i] === '%') { out.push(parseInt(u.substr(i + 1, 2), 16)); i += 2; }
      else out.push(u.charCodeAt(i));
    }
    return out;
  }
  function totalDados(v) {
    var t = TAB[v - 1];
    return t[1] * t[2] + t[3] * t[4];
  }
  function alinhamentos(v) {
    return ALI[v - 1] ? ALI[v - 1].split(',').map(Number) : [];
  }
  function montar(txt, versaoFixa) {
    var d = bytesUtf8(txt), v = versaoFixa || 0;
    if (!v) {
      for (v = 1; v <= 20; v++) {
        var bitsCont = v < 10 ? 8 : 16;
        if (d.length * 8 + 4 + bitsCont <= totalDados(v) * 8) break;
      }
      if (v > 20) throw new Error('Texto grande demais para o QR.');
    }
    var t = TAB[v - 1], nDados = totalDados(v), cont = v < 10 ? 8 : 16;
    var bits = [];
    function push(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    push(4, 4); push(d.length, cont);
    for (var i = 0; i < d.length; i++) push(d[i], 8);
    var sobra = nDados * 8 - bits.length;
    push(0, Math.min(4, sobra));
    while (bits.length % 8) bits.push(0);
    var pad = [236, 17], k = 0;
    while (bits.length < nDados * 8) { push(pad[k++ % 2], 8); }
    var cw = [];
    for (i = 0; i < bits.length; i += 8) {
      var b = 0;
      for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      cw.push(b);
    }
    var blocos = [], ecs = [], p = 0;
    for (i = 0; i < t[1]; i++) { blocos.push(cw.slice(p, p + t[2])); p += t[2]; }
    for (i = 0; i < t[3]; i++) { blocos.push(cw.slice(p, p + t[4])); p += t[4]; }
    for (i = 0; i < blocos.length; i++) ecs.push(resto(blocos[i], t[0]));
    var fluxo = [], max = Math.max(t[2], t[4]);
    for (i = 0; i < max; i++)
      for (j = 0; j < blocos.length; j++)
        if (i < blocos[j].length) fluxo.push(blocos[j][i]);
    for (i = 0; i < t[0]; i++)
      for (j = 0; j < ecs.length; j++) fluxo.push(ecs[j][i]);
    return { v: v, fluxo: fluxo };
  }
  function matriz(txt, versaoFixa, mascaraFixa) {
    var r = montar(txt, versaoFixa), v = r.v, n = v * 4 + 17;
    var m = [], res = [];
    for (var i = 0; i < n; i++) { m.push(new Array(n).fill(0)); res.push(new Array(n).fill(0)); }
    function po(y, x, val) { if (y >= 0 && y < n && x >= 0 && x < n) { m[y][x] = val; res[y][x] = 1; } }
    [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (c) {
      for (var y = -1; y <= 7; y++) for (var x = -1; x <= 7; x++) {
        var dentro = (y >= 0 && y <= 6 && x >= 0 && x <= 6);
        var preto = dentro && (y === 0 || y === 6 || x === 0 || x === 6 ||
                    (y >= 2 && y <= 4 && x >= 2 && x <= 4));
        po(c[0] + y, c[1] + x, preto ? 1 : 0);
      }
    });
    var a = alinhamentos(v);
    for (i = 0; i < a.length; i++) for (var j2 = 0; j2 < a.length; j2++) {
      var cy = a[i], cx = a[j2];
      if ((cy <= 8 && cx <= 8) || (cy <= 8 && cx >= n - 9) || (cy >= n - 9 && cx <= 8)) continue;
      for (var y2 = -2; y2 <= 2; y2++) for (var x2 = -2; x2 <= 2; x2++)
        po(cy + y2, cx + x2, (Math.abs(y2) === 2 || Math.abs(x2) === 2 || (!y2 && !x2)) ? 1 : 0);
    }
    for (i = 8; i < n - 8; i++) { po(6, i, i % 2 ? 0 : 1); po(i, 6, i % 2 ? 0 : 1); }
    po(n - 8, 8, 1); // módulo escuro
    for (i = 0; i < 9; i++) { if (i !== 6) { po(8, i, 0); po(i, 8, 0); } }
    for (i = 0; i < 8; i++) { po(8, n - 1 - i, 0); po(n - 1 - i, 8, 0); }
    if (v >= 7) for (i = 0; i < 6; i++) for (j2 = 0; j2 < 3; j2++) { po(n - 11 + j2, i, 0); po(i, n - 11 + j2, 0); }
    var bit = 0, dir = -1, col = n - 1, fluxo = r.fluxo;
    function proximo() {
      if (bit >= fluxo.length * 8) return 0;
      var b = (fluxo[bit >> 3] >> (7 - (bit & 7))) & 1;
      bit++; return b;
    }
    while (col > 0) {
      if (col === 6) col--;
      for (var linha = (dir < 0 ? n - 1 : 0); linha >= 0 && linha < n; linha += dir) {
        for (var c2 = 0; c2 < 2; c2++) {
          var cc = col - c2;
          if (!res[linha][cc]) { m[linha][cc] = proximo(); }
        }
      }
      dir = -dir; col -= 2;
    }
    function aplicar(msk, mat) {
      var f = [
        function (y, x) { return (y + x) % 2 === 0; },
        function (y) { return y % 2 === 0; },
        function (y, x) { return x % 3 === 0; },
        function (y, x) { return (y + x) % 3 === 0; },
        function (y, x) { return (((y / 2) | 0) + ((x / 3) | 0)) % 2 === 0; },
        function (y, x) { return (y * x) % 2 + (y * x) % 3 === 0; },
        function (y, x) { return ((y * x) % 2 + (y * x) % 3) % 2 === 0; },
        function (y, x) { return ((y + x) % 2 + (y * x) % 3) % 2 === 0; }
      ][msk];
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++)
        if (!res[y][x] && f(y, x)) mat[y][x] ^= 1;
    }
    function formato(msk, mat) {
      var bch = msk << 10;                       // nivel M = 00, entao dados = msk
      for (var i = 4; i >= 0; i--) if (bch & (1 << (i + 10))) bch ^= 0x537 << i;
      var f = (((msk << 10) | bch) ^ 0x5412);
      function b(k) { return (f >> (14 - k)) & 1; }   // k=0 e o bit mais alto
      for (i = 0; i <= 5; i++) mat[8][i] = b(i);
      mat[8][7] = b(6); mat[8][8] = b(7); mat[7][8] = b(8);
      for (i = 9; i <= 14; i++) mat[14 - i][8] = b(i);
      for (i = 0; i <= 6; i++) mat[n - 1 - i][8] = b(i);
      for (i = 7; i <= 14; i++) mat[8][n - 15 + i] = b(i);
      mat[n - 8][8] = 1;                         // modulo escuro
    }
    function versaoInfo(mat) {
      if (v < 7) return;
      var bch = v << 12, d = v << 12;
      for (var i = 5; i >= 0; i--) if (bch & (1 << (i + 12))) bch ^= 0x1F25 << i;
      var f = d | bch;
      for (i = 0; i < 18; i++) {
        var b = (f >> i) & 1, y = (i / 3) | 0, x = i % 3;
        mat[n - 11 + x][y] = b; mat[y][n - 11 + x] = b;
      }
    }
    function copia(src) { return src.map(function (l) { return l.slice(); }); }
    function penal(mat) {
      var p = 0, y, x, i, run, cor;
      for (y = 0; y < n; y++) { run = 1; for (x = 1; x < n; x++) { if (mat[y][x] === mat[y][x - 1]) { run++; } else { if (run >= 5) p += run - 2; run = 1; } } if (run >= 5) p += run - 2; }
      for (x = 0; x < n; x++) { run = 1; for (y = 1; y < n; y++) { if (mat[y][x] === mat[y - 1][x]) { run++; } else { if (run >= 5) p += run - 2; run = 1; } } if (run >= 5) p += run - 2; }
      for (y = 0; y < n - 1; y++) for (x = 0; x < n - 1; x++) { var s = mat[y][x] + mat[y][x + 1] + mat[y + 1][x] + mat[y + 1][x + 1]; if (s === 0 || s === 4) p += 3; }
      var A = '10111010000', B = '00001011101';
      function conta(s2) {
        var c = 0, k;
        for (k = 0; k + 11 <= s2.length; k++) {
          var t = s2.substr(k, 11);
          if (t === A || t === B) c++;
        }
        return c * 40;
      }
      for (y = 0; y < n; y++) p += conta(mat[y].join(''));
      for (x = 0; x < n; x++) { var col2 = ''; for (y = 0; y < n; y++) col2 += mat[y][x]; p += conta(col2); }
      var escuros = 0;
      for (y = 0; y < n; y++) for (x = 0; x < n; x++) escuros += mat[y][x];
      p += Math.floor(Math.abs(escuros * 100 / (n * n) - 50) / 5) * 10;
      return p;
    }
    var melhor = null, melhorP = Infinity, msk;
    var faixa = (mascaraFixa === undefined || mascaraFixa === null) ? [0, 1, 2, 3, 4, 5, 6, 7] : [mascaraFixa];
    for (var mi = 0; mi < faixa.length; mi++) {
      msk = faixa[mi];
      var cand = copia(m);
      aplicar(msk, cand); formato(msk, cand); versaoInfo(cand);
      var pen = penal(cand);
      if (pen < melhorP) { melhorP = pen; melhor = cand; var mUsada = msk; }
    }
    return { n: n, v: v, mascara: mUsada, m: melhor };
  }
  return { matriz: matriz };
})();

/* desenha o QR como SVG: vetor, imprime nítido em qualquer tamanho */
function qrSvg(txt){
  var r = QR.matriz(txt), n = r.n, q = 4, tot = n + q * 2, d = '';
  for (var y = 0; y < n; y++){
    var x = 0;
    while (x < n){
      if (r.m[y][x]){
        var w = 1;
        while (x + w < n && r.m[y][x + w]) w++;
        d += 'M' + (x + q) + ' ' + (y + q) + 'h' + w + 'v1h-' + w + 'z';
        x += w;
      } else x++;
    }
  }
  return '<svg viewBox="0 0 ' + tot + ' ' + tot + '" xmlns="http://www.w3.org/2000/svg" ' +
         'role="img" aria-label="Código QR da turma"><rect width="' + tot + '" height="' + tot +
         '" fill="#fff"/><path d="' + d + '" fill="#1B1020"/></svg>';
}
</script>
