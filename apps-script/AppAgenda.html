<style>
/* ─────────── agenda ─────────── */
.atalhos{display:flex;gap:8px;margin-bottom:16px}
.atalhos button{
  flex:1;min-height:48px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--roxo);
  background:var(--papel);border:1px solid var(--borda);
  transition:background 160ms var(--curva);
}
.atalhos button:active{background:var(--fundo)}

.eventos{list-style:none;margin:0;padding:0}
.eventos li{margin-bottom:12px}
.ev{
  width:100%;display:flex;align-items:stretch;gap:0;text-align:left;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);overflow:hidden;
  transition:background 160ms var(--curva);
}
.ev:active{background:var(--fundo)}
.ev-dia{
  flex:0 0 64px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 4px;background:var(--roxo-fraco);color:var(--roxo);
}
.ev-dia b{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ev-dia small{font-size:12px;font-weight:600;margin-top:4px;text-transform:lowercase}
.ev-txt{flex:1;min-width:0;padding:12px 16px}
.ev-txt b{display:block;font-size:16px;font-weight:700;line-height:1.3;margin-top:6px;overflow-wrap:anywhere}
.ev-txt small{display:block;font-size:13px;color:var(--apagado);margin-top:2px;line-height:1.4}
.tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--c);
  padding:3px 10px 3px 8px;border-radius:999px;
  background:color-mix(in srgb, var(--c) 12%, #fff);
}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.ev.passado{opacity:.55}
.ev.passado .ev-dia{background:var(--fundo);color:var(--apagado)}
.ev.cancelado .ev-txt b{text-decoration:line-through;color:var(--apagado)}

.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipos button{
  min-height:52px;padding:10px 12px;border-radius:var(--r-m);
  display:flex;align-items:center;gap:8px;text-align:left;
  font-size:15px;font-weight:600;line-height:1.25;
  background:var(--papel);border:1px solid var(--borda);
  transition:background 160ms var(--curva),border-color 160ms var(--curva);
}
.tipos button::before{content:"";width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:var(--c)}
.tipos button[aria-pressed="true"]{border:2px solid var(--c);background:color-mix(in srgb, var(--c) 10%, #fff);padding:9px 11px}

.marca-dia{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:600;
  margin:-4px 0 16px;cursor:pointer}
.marca-dia input{width:22px;height:22px;accent-color:var(--roxo);margin:0}

.meses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.meses button{
  min-height:92px;padding:12px 8px;border-radius:var(--r-m);text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--papel);border:1px solid var(--borda);box-shadow:var(--sombra);
  transition:background 160ms var(--curva);
}
.meses button:active{background:var(--fundo)}
.meses button.atual{border:2px solid var(--roxo)}
.meses span{font-size:13px;font-weight:600;color:var(--apagado)}
.meses b{font-size:26px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.meses b.zero{color:var(--borda)}
.meses i{display:flex;gap:3px;min-height:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.meses i u{width:8px;height:8px;border-radius:50%;background:var(--c)}

.checks .li{cursor:pointer}
.checks .caixa{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--borda);
  display:grid;place-items:center;color:#fff;
}
.checks .li[aria-checked="true"] .caixa{background:var(--roxo);border-color:var(--roxo)}
.checks .li[aria-disabled="true"]{cursor:default}
.checks .li[aria-disabled="true"] .nome{color:var(--apagado)}
.detalhes{list-style:none;margin:0 8px 8px;padding:0}
.detalhes li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px;line-height:1.45}
.detalhes li svg{flex-shrink:0;margin-top:2px;color:var(--apagado)}
</style>
<script>
/* Agenda anual. Não substitui o calendário de papel da coordenação:
   alimenta ele. O fim da linha é o PDF para imprimir. */

var MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var DIA_CURTO = ['dom','seg','ter','qua','qui','sex','sáb'];

function corTipo(t){
  var c = S.agCores || {};
  return c[t] || c.Outro || '#6B5E78';
}
function tagTipo(t){
  return '<span class="tag" style="--c:' + esc(corTipo(t)) + '">' + esc(t) + '</span>';
}
function somarMes(mes, n){
  var a = +mes.slice(0,4), m = +mes.slice(5,7) - 1 + n;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + '-' + String(m + 1).padStart(2,'0');
}
function diaSemanaIso(iso){
  var p = iso.split('-');
  return DIA_CURTO[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function textoTurmas(ts){
  return !ts || !ts.length ? 'Todas as turmas' : ts.join(', ');
}
/* Garante tipos, cores e turmas antes de montar formulário. */
function comListas(fn){
  if (S.agListas){ fn(); return; }
  var h = hojeISO();
  ler('listarAgenda', [+h.slice(0,4), +h.slice(5,7)], function(r){ S.agListas = r; S.agCores = r.cores; fn(); },
      function(e){ toast(textoErro(e), 'erro'); }, {fresco:300000});
}

/* ══════════════ AGENDA: mês ══════════════ */
TELAS.agenda = function(p){
  if (!p.mes) p.mes = hojeISO().slice(0,7);
  var mes = p.mes;
  return {
    titulo:'Agenda',
    html:'<div class="passo">' +
        '<button type="button" data-acao="agMes" data-n="-1" aria-label="Mês anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + esc(mesExtenso(mes)) + '</b>' +
        '<button type="button" data-acao="agMes" data-n="1" aria-label="Próximo mês">' + ico('dir', 22) + '</button></div>' +
      '<div class="atalhos">' +
        '<button type="button" data-acao="agAno">' + ico('tabela', 18) + ' Ver o ano</button>' +
        '<button type="button" data-acao="agImprimir">' + ico('impressora', 18) + ' Imprimir</button></div>' +
      '<div id="agLista">' + esqueleto(3) + '</div>',
    barra:'<button type="button" class="salvar" data-acao="agNovo">' + ico('mais') + 'Novo evento</button>',
    depois:function(){ carregarAgMes(mes); }
  };
};

function carregarAgMes(mes){
  ler('listarAgenda', [+mes.slice(0,4), +mes.slice(5,7)], function(r){
    var a = atual();
    if (!a || a.t !== 'agenda' || a.p.mes !== mes || !el('agLista')) return;
    S.agListas = r; S.agCores = r.cores; S.agEventos = r.eventos;
    /* Quem olha um mês costuma passar para o lado: os vizinhos já vêm. */
    [-1, 1].forEach(function(n){
      var v = somarMes(mes, n);
      preler('listarAgenda', [+v.slice(0,4), +v.slice(5,7)]);
    });
    if (!r.eventos.length){
      el('agLista').innerHTML = estado('calendario', 'Nada marcado em ' + MESES[+mes.slice(5,7) - 1],
        'Toque em "Novo evento" aqui embaixo para colocar a primeira data do mês.');
      return;
    }
    var h = '<ul class="eventos">';
    r.eventos.forEach(function(ev, i){
      var passou = ev.dataFim ? ev.dataFim < r.hoje : ev.data < r.hoje;
      var comecaAntes = ev.data.slice(0,7) < mes;
      var linha = [];
      if (ev.dataFim) linha.push('de ' + dataCurta(ev.data) + ' a ' + dataCurta(ev.dataFim));
      linha.push(textoTurmas(ev.turmas));
      if (ev.local) linha.push(ev.local);
      if (ev.status !== 'Planejado') linha.push(ev.status);
      h += '<li><button type="button" class="ev' + (passou ? ' passado' : '') +
           (ev.status === 'Cancelado' ? ' cancelado' : '') + '" data-acao="agVer" data-i="' + i + '">' +
           '<span class="ev-dia"><b>' + (comecaAntes ? '…' : +ev.data.slice(8)) + '</b>' +
           '<small>' + (comecaAntes ? 'desde ' + dataCurta(ev.data) : diaSemanaIso(ev.data)) + '</small></span>' +
           '<span class="ev-txt">' + tagTipo(ev.tipo) + '<b>' + esc(ev.titulo) + '</b>' +
           '<small>' + esc(linha.join(' · ')) + '</small></span></button></li>';
    });
    el('agLista').innerHTML = h + '</ul>';
  }, function(e){
    if (el('agLista')) el('agLista').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
  });
}

ACOES.agMes = function(b){
  vibrar();
  trocar('agenda', {mes:somarMes(atual().p.mes, +b.getAttribute('data-n'))});
};
ACOES.agAno = function(){ ir('agAno', {ano:+atual().p.mes.slice(0,4)}); };
ACOES.agImprimir = function(){
  var a = atual();
  var ano = a.p.ano || +(a.p.mes || hojeISO()).slice(0,4);
  comPin('agImprimir', {ano:ano});
};
ACOES.agNovo = function(){
  var mes = atual().p.mes || hojeISO().slice(0,7);
  /* No mês de hoje, a data já vem hoje. Em outro mês, o dia 1 dele:
     quem navegou até abril quer marcar algo em abril. */
  comPin('agNovo', {data: mes === hojeISO().slice(0,7) ? hojeISO() : mes + '-01'});
};

/* ─── ver um evento ─── */
ACOES.agVer = function(b){
  var ev = (S.agEventos || [])[+b.getAttribute('data-i')];
  if (!ev) return;
  var quando = ev.dataFim
    ? 'De ' + dataExtenso(ev.data) + ' a ' + dataExtenso(ev.dataFim)
    : dataExtenso(ev.data);
  var h = '<div style="padding:0 8px 8px">' + tagTipo(ev.tipo) + '</div><ul class="detalhes">' +
    '<li>' + ico('calendario', 18) + '<span>' + esc(quando.charAt(0).toUpperCase() + quando.slice(1)) + '</span></li>' +
    '<li>' + ico('grupo', 18) + '<span>' + esc(textoTurmas(ev.turmas)) + '</span></li>' +
    (ev.local ? '<li>' + ico('local', 18) + '<span>' + esc(ev.local) + '</span></li>' : '') +
    '<li>' + ico('cheque', 18) + '<span>' + esc(ev.status) + '</span></li>' +
    (ev.obs ? '<li>' + ico('documento', 18) + '<span>' + esc(ev.obs) + '</span></li>' : '') +
    '</ul><ul>' +
    '<li><button type="button" class="opc" data-ev="editar">' + ico('renomear') + '<span>Editar</span></button></li>' +
    '<li><button type="button" class="opc" data-ev="status">' + ico('cheque') +
      '<span>Mudar situação<small>planejado, confirmado, realizado, cancelado</small></span></button></li>' +
    '<li><button type="button" class="opc perigo" data-ev="excluir">' + ico('lixo') +
      '<span>Apagar<small>só para engano de digitação</small></span></button></li></ul>';
  abrirFolha(ev.titulo, h);
  el('folhaCorpo').onclick = function(e){
    var o = e.target.closest('[data-ev]');
    if (!o) return;
    var qual = o.getAttribute('data-ev');
    fecharFolha();
    setTimeout(function(){
      if (!S.pin){ pedirPin(); return; }
      if (qual === 'editar') ir('agNovo', {id:ev.id});
      else if (qual === 'status') mudarStatus(ev);
      else confirmar('Apagar evento', ev.titulo + ' some da agenda. Se ele só não vai mais acontecer, prefira "Cancelado": fica registrado no ano.',
        'Apagar', function(){
          api('excluirEvento', [S.pin, ev.id], function(){
            vibrar(); toast('Evento apagado'); carregarAgMes(atual().p.mes);
          }, function(e2){ toast(textoErro(e2), 'erro'); });
        });
    }, 60);
  };
};

function mudarStatus(ev){
  folhaOpcoes('Situação de ' + ev.titulo, S.agListas.status.map(function(st){
    return { txt:st, marcado:(st === ev.status), fn:function(){
      if (st === ev.status) return;
      api('editarEvento', [S.pin, ev.id, {status:st}], function(){
        vibrar(); toast(ev.titulo + ': ' + st.toLowerCase());
        if (atual().t === 'agenda') carregarAgMes(atual().p.mes);
      }, function(e){ toast(textoErro(e), 'erro'); });
    }};
  }));
}

/* ══════════════ AGENDA: novo / editar ══════════════ */
TELAS.agNovo = function(p){
  return {
    titulo: p.id ? 'Editar evento' : 'Novo evento',
    html: esqueleto(4),
    barra:'<button type="button" class="salvar" id="btAgSalvar" data-acao="agSalvar" disabled>Salvar evento</button>',
    depois:function(){ comListas(function(){ montarFormEvento(p); }); }
  };
};

function montarFormEvento(p){
  var a = atual();
  if (!a || a.t !== 'agNovo' || a.p !== p) return;
  var L = S.agListas;
  var ev = p.id ? (S.agEventos || []).filter(function(x){ return x.id === p.id; })[0] : null;
  if (p.id && !ev){
    el('palco').querySelector('.corpo').innerHTML = estado('alerta', 'Evento não encontrado', 'Volte e abra de novo.');
    return;
  }
  var f = ev ? JSON.parse(JSON.stringify(ev))
             : {titulo:'', data:p.data || hojeISO(), dataFim:'', tipo:'', turmas:[], local:'', status:'Planejado', obs:''};
  S.agForm = f;

  var h = '<div class="campo"><label for="agTitulo">Nome do evento</label>' +
    '<input id="agTitulo" type="text" autocomplete="off" autocapitalize="sentences" maxlength="120" ' +
    'placeholder="Dia da Dança" value="' + esc(f.titulo) + '"></div>';
  h += '<div class="campo"><label for="agData">Data</label>' +
    '<input id="agData" type="date" value="' + esc(f.data) + '"></div>';
  h += '<label class="marca-dia"><input type="checkbox" id="agVarios"' + (f.dataFim ? ' checked' : '') +
    '> Dura mais de um dia</label>';
  h += '<div class="campo" id="agFimBox"' + (f.dataFim ? '' : ' hidden') + '><label for="agFim">Termina em</label>' +
    '<input id="agFim" type="date" value="' + esc(f.dataFim) + '"></div>';

  h += '<div class="campo"><label>Tipo</label><div class="tipos" id="agTipos">';
  L.tipos.forEach(function(t){
    h += '<button type="button" data-tipo="' + esc(t) + '" style="--c:' + esc(corTipo(t)) + '" aria-pressed="' +
         (f.tipo === t) + '">' + esc(t) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="campo"><label>Turmas</label><div class="chips" id="agTurmas">' +
    '<button type="button" class="chip' + (f.turmas.length ? '' : ' on') + '" data-turma="">Todas</button>';
  L.turmas.forEach(function(t){
    h += '<button type="button" class="chip' + (f.turmas.indexOf(t) !== -1 ? ' on' : '') +
         '" data-turma="' + esc(t) + '">' + esc(t) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="campo"><label for="agLocal">Local <i>(opcional)</i></label>' +
    '<input id="agLocal" type="text" autocomplete="off" maxlength="120" placeholder="Teatro do bairro" value="' + esc(f.local) + '"></div>';
  h += '<div class="campo"><label for="agObs">Observação <i>(opcional)</i></label>' +
    '<input id="agObs" type="text" autocomplete="off" maxlength="500" value="' + esc(f.obs) + '"></div>';

  h += '<div class="campo"><label>Situação</label><div class="chips" id="agStatus">';
  L.status.forEach(function(st){
    h += '<button type="button" class="chip' + (f.status === st ? ' on' : '') + '" data-st="' + esc(st) + '">' +
         esc(st) + '</button>';
  });
  h += '</div></div>';

  el('palco').querySelector('.corpo').innerHTML = h;
  el('btAgSalvar').disabled = false;

  el('agVarios').onchange = function(){
    el('agFimBox').hidden = !this.checked;
    if (this.checked && !el('agFim').value) el('agFim').value = el('agData').value;
  };
  el('palco').querySelector('.corpo').onclick = function(e){
    var t = e.target.closest('[data-tipo]');
    if (t){
      var ts = el('agTipos').children;
      for (var i = 0; i < ts.length; i++) ts[i].setAttribute('aria-pressed', ts[i] === t ? 'true' : 'false');
      vibrar(); return;
    }
    var tu = e.target.closest('[data-turma]');
    if (tu){
      var todas = el('agTurmas').querySelector('[data-turma=""]');
      if (tu === todas){
        el('agTurmas').querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === todas); });
      } else {
        tu.classList.toggle('on');
        var alguma = el('agTurmas').querySelectorAll('.chip.on:not([data-turma=""])').length > 0;
        todas.classList.toggle('on', !alguma);
      }
      vibrar(); return;
    }
    var st = e.target.closest('[data-st]');
    if (st){
      el('agStatus').querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === st); });
      vibrar();
    }
  };
  if (!p.id) setTimeout(function(){ var i = el('agTitulo'); if (i) i.focus(); }, 200);
}

ACOES.agSalvar = function(){
  var p = atual().p;
  if (!el('agTitulo')) return;
  var tipo = el('agTipos').querySelector('[aria-pressed="true"]');
  var st = el('agStatus').querySelector('.chip.on');
  var dados = {
    titulo: el('agTitulo').value.trim(),
    data: el('agData').value,
    dataFim: el('agVarios').checked ? el('agFim').value : '',
    tipo: tipo ? tipo.getAttribute('data-tipo') : '',
    turmas: [].map.call(el('agTurmas').querySelectorAll('.chip.on:not([data-turma=""])'),
                        function(c){ return c.getAttribute('data-turma'); }),
    local: el('agLocal').value.trim(),
    obs: el('agObs').value.trim(),
    status: st ? st.getAttribute('data-st') : 'Planejado'
  };
  if (dados.titulo.length < 2){ toast('Escreva o nome do evento.', 'erro'); el('agTitulo').focus(); return; }
  if (!dados.data){ toast('Escolha a data.', 'erro'); return; }
  if (!dados.tipo){ toast('Escolha o tipo do evento.', 'erro'); return; }
  if (dados.dataFim && dados.dataFim < dados.data){ toast('A data do fim vem antes do começo.', 'erro'); return; }

  var bt = el('btAgSalvar');
  bt.disabled = true; bt.textContent = 'Salvando…';
  api(p.id ? 'editarEvento' : 'criarEvento', p.id ? [S.pin, p.id, dados] : [S.pin, dados], function(r){
    vibrar();
    toast(p.id ? 'Evento salvo' : dados.titulo + ' está na agenda');
    /* Volta para a agenda no mês do evento, para ela ver onde caiu. */
    var mes = r.data.slice(0,7);
    S.pilha.pop();
    var baixo = atual();
    if (baixo && baixo.t === 'agenda'){ baixo.p.mes = mes; desenhar(); }
    else if (baixo && baixo.t === 'agAno'){ desenhar(); }
    else { S.pilha.push({t:'agenda', p:{mes:mes}}); desenhar(); }
  }, function(e){
    var b2 = el('btAgSalvar');
    if (b2){ b2.disabled = false; b2.textContent = 'Salvar evento'; }
    toast(textoErro(e), 'erro');
  });
};

/* ══════════════ AGENDA: o ano ══════════════ */
/* A tela de janeiro, quando ela planeja o ano inteiro. */
TELAS.agAno = function(p){
  if (!p.ano) p.ano = +hojeISO().slice(0,4);
  var ano = p.ano;
  return {
    titulo:'Agenda de ' + ano,
    html:'<div class="passo">' +
        '<button type="button" data-acao="agAnoPasso" data-n="-1" aria-label="Ano anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + ano + '</b>' +
        '<button type="button" data-acao="agAnoPasso" data-n="1" aria-label="Próximo ano">' + ico('dir', 22) + '</button></div>' +
      '<div id="agMeses">' + esqueleto(3) + '</div>' +
      '<ul class="cartoes">' +
      '<li><button type="button" class="item" data-acao="agDatas">' + ico('bolo', 22) +
        '<span class="txt">Datas comemorativas<small>colocar as datas fixas do ano</small></span>' +
        '<span class="seta">' + ico('dir') + '</span></button></li>' +
      '<li><button type="button" class="item" data-acao="agImprimir">' + ico('impressora', 22) +
        '<span class="txt">Calendário para imprimir<small>PDF em A4 deitado, com espaço para escrever</small></span>' +
        '<span class="seta">' + ico('dir') + '</span></button></li></ul>',
    depois:function(){
      ler('listarAgendaAno', [ano], function(r){
        var a = atual();
        if (!a || a.t !== 'agAno' || a.p.ano !== ano || !el('agMeses')) return;
        S.agCores = r.cores;
        var hj = r.hoje.slice(0,7);
        var h = '<div class="meses">';
        r.meses.forEach(function(m){
          var chaveMes = ano + '-' + String(m.mes).padStart(2,'0');
          var pontos = '';
          r.tipos.forEach(function(t){
            for (var i = 0; i < Math.min(m.tipos[t] || 0, 4); i++) pontos += '<u style="--c:' + esc(r.cores[t]) + '"></u>';
          });
          h += '<button type="button" data-acao="agAbrirMes" data-m="' + chaveMes + '"' +
               (chaveMes === hj ? ' class="atual"' : '') +
               ' aria-label="' + esc(MESES[m.mes - 1] + ', ' + plural(m.total, 'evento', 'eventos')) + '">' +
               '<span>' + MES_CURTO[m.mes - 1] + '</span>' +
               '<b' + (m.total ? '' : ' class="zero"') + '>' + m.total + '</b>' +
               '<i>' + pontos + '</i></button>';
        });
        el('agMeses').innerHTML = h + '</div>';
      }, function(e){
        if (el('agMeses')) el('agMeses').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
      });
    }
  };
};
ACOES.agAnoPasso = function(b){ vibrar(); trocar('agAno', {ano:atual().p.ano + +b.getAttribute('data-n')}); };
ACOES.agAbrirMes = function(b){
  var mes = b.getAttribute('data-m');
  /* Se veio da agenda do mês, volta para ela no mês tocado. */
  var baixo = S.pilha[S.pilha.length - 2];
  if (baixo && baixo.t === 'agenda'){ S.pilha.pop(); baixo.p.mes = mes; desenhar(); }
  else ir('agenda', {mes:mes});
};
ACOES.agDatas = function(){ comPin('agDatas', {ano:atual().p.ano}); };

/* ══════════════ AGENDA: datas comemorativas ══════════════ */
TELAS.agDatas = function(p){
  return {
    titulo:'Datas de ' + p.ano,
    html:esqueleto(3),
    barra:'<button type="button" class="salvar" id="btDatas" data-acao="agPrecarregar" disabled>Colocar na agenda</button>',
    depois:function(){
      ler('datasFixas', [p.ano], function(r){
        var a = atual();
        if (!a || a.t !== 'agDatas' || a.p.ano !== p.ano) return;
        var h = '<p style="color:var(--apagado);font-size:14px;margin:0 0 16px 4px">' +
          'Datas que se repetem todo ano. Desmarque o que não quiser e toque em "Colocar na agenda".</p>' +
          '<ul class="lista checks">';
        var livres = 0;
        r.datas.forEach(function(d){
          if (!d.jaTem) livres++;
          h += '<li class="li" role="checkbox" tabindex="0" data-acao="agMarcaData" data-dia="' + esc(d.dia) + '"' +
               ' aria-checked="' + (!d.jaTem) + '"' + (d.jaTem ? ' aria-disabled="true"' : '') + '>' +
               '<span class="caixa">' + ico('cheque', 16) + '</span>' +
               '<span class="nome">' + esc(d.titulo) + '<small>' + esc(dataExtenso(d.data)) +
               (d.jaTem ? ' · já está na agenda' : '') + '</small></span></li>';
        });
        h += '</ul><p class="dica" style="margin:4px 4px 0">Faltou alguma? Cadastre pelo "Novo evento" na agenda do mês.</p>';
        el('palco').querySelector('.corpo').innerHTML = h;
        var bt = el('btDatas');
        if (bt) bt.disabled = !livres;
      }, function(e){
        el('palco').querySelector('.corpo').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
      }, {fresco:300000});
    }
  };
};
ACOES.agMarcaData = function(b){
  if (b.getAttribute('aria-disabled') === 'true') return;
  b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  vibrar();
};
ACOES.agPrecarregar = function(){
  var ano = atual().p.ano;
  var dias = [].map.call(document.querySelectorAll('.checks [aria-checked="true"]:not([aria-disabled="true"])'),
                         function(n){ return n.getAttribute('data-dia'); });
  if (!dias.length){ toast('Marque pelo menos uma data.', 'erro'); return; }
  var bt = el('btDatas'); bt.disabled = true; bt.textContent = 'Colocando…';
  api('precarregarDatas', [S.pin, ano, dias], function(r){
    vibrar();
    toast(r.criados ? plural(r.criados, 'data entrou', 'datas entraram') + ' na agenda de ' + ano
                    : 'Essas datas já estavam na agenda');
    voltar();
  }, function(e){
    bt.disabled = false; bt.textContent = 'Colocar na agenda';
    toast(textoErro(e), 'erro');
  });
};

/* ══════════════ AGENDA: calendário para imprimir ══════════════ */
/* Fecha o ciclo: ela imprime e escreve em cima, como sempre fez. */
TELAS.agImprimir = function(p){
  return {
    titulo:'Calendário para imprimir',
    html:'<div class="passo">' +
        '<button type="button" data-acao="agImpPasso" data-n="-1" aria-label="Ano anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + p.ano + '</b>' +
        '<button type="button" data-acao="agImpPasso" data-n="1" aria-label="Próximo ano">' + ico('dir', 22) + '</button></div>' +
      '<div class="cartao-info">' + ico('impressora', 26) +
        '<b>Calendário ' + p.ano + '</b>' +
        '<span>Folha A4 deitada, uma página por trimestre, com os eventos marcados em cada dia ' +
        'e espaço em branco para escrever à mão. Mês com muito evento ganha página própria.</span>' +
        '<span id="agImpConta" style="margin-top:8px;font-weight:600;color:var(--roxo)"></span></div>' +
      '<button type="button" class="botao-cheio" id="btPdf" data-acao="agGerarPdf">' +
        ico('documento', 18) + ' Gerar o PDF</button>' +
      '<p class="dica" id="agPdfEspera" role="status" aria-live="polite" style="text-align:center;min-height:3em"></p>',
    depois:function(){
      ler('listarAgendaAno', [p.ano], function(r){
        var n = el('agImpConta');
        if (n && atual().p.ano === p.ano)
          n.textContent = r.total ? plural(r.total, 'evento marcado', 'eventos marcados') + ' no ano'
                                  : 'Nenhum evento ainda: sai o calendário em branco.';
      }, function(){});
    }
  };
};
ACOES.agImpPasso = function(b){ vibrar(); trocar('agImprimir', {ano:atual().p.ano + +b.getAttribute('data-n')}); };
/* "Gerando…" parado por 40 segundos é igual a travado. O contador anda
   a cada segundo e o texto muda conforme a espera cresce. Não finge
   progresso: o servidor não conta em que página está, só o relógio. */
var agPdfRelogio = 0;
function esperaPdf(inicio){
  var n = el('agPdfEspera');
  if (!n){ clearInterval(agPdfRelogio); return; }
  var s = Math.round((Date.now() - inicio) / 1000);
  n.textContent = (s < 20 ? 'Montando as páginas do calendário no Google'
    : s < 60 ? 'Ainda montando. O Google leva seu tempo com PDF; pode deixar a tela aberta'
    : 'Está demorando mais que o normal, mas continua trabalhando') + ' · ' + s + ' s';
}
ACOES.agGerarPdf = function(){
  var ano = atual().p.ano;
  var bt = el('btPdf');
  bt.disabled = true; bt.textContent = 'Gerando o calendário…';
  var inicio = Date.now();
  clearInterval(agPdfRelogio);
  esperaPdf(inicio);
  agPdfRelogio = setInterval(function(){ esperaPdf(inicio); }, 1000);
  function parar(){ clearInterval(agPdfRelogio); if (el('agPdfEspera')) el('agPdfEspera').textContent = ''; }
  api('gerarCalendarioPdf', [S.pin, ano], function(r){
    parar();
    var b2 = el('btPdf');
    if (b2){ b2.disabled = false; b2.innerHTML = ico('documento', 18) + ' Gerar de novo'; }
    vibrar();
    var texto = 'Calendário ' + ano + ' do Instituto Veridiana: ' + r.url;
    var seg = r.tempo ? r.tempo.total : Math.round((Date.now() - inicio) / 1000);
    var h = '<p class="sub">' + esc(r.nome) + ' · ' + plural(r.paginas, 'página', 'páginas') +
      ' · pronto em ' + String(seg).replace('.', ',') + ' s</p>' +
      '<div style="padding:0 8px">' +
      '<a class="botao-cheio" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + ico('abrir', 18) + ' Abrir o PDF</a>';
    if (r.publico){
      h += '<a class="botao-zap" style="margin-top:8px" href="https://wa.me/?text=' + encodeURIComponent(texto) +
           '" target="_blank" rel="noopener">' + ico('conversa', 18) + ' Mandar no WhatsApp</a>';
    }
    h += '<button type="button" class="botao-cheio" style="margin-top:8px;background:var(--fundo);color:var(--roxo)" ' +
         'data-acao="copiarLink" data-u="' + esc(r.url) + '">' + ico('copiar', 18) + ' Copiar link</button>';
    if (!r.publico){
      h += '<p class="dica" style="margin:16px 4px 0">O Drive do instituto não deixou abrir o link para qualquer pessoa. ' +
           'Quem receber precisa ter acesso à pasta "Agenda — Instituto Veridiana".</p>';
    }
    abrirFolha('Calendário pronto', h + '</div>');
  }, function(e){
    parar();
    var b2 = el('btPdf');
    if (b2){ b2.disabled = false; b2.innerHTML = ico('documento', 18) + ' Gerar o PDF'; }
    toast(textoErro(e), 'erro');
  }, 150000);
};
</script>
