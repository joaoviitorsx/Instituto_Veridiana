<script>
/* Partida: lê a turma da URL, confere a sessão e abre a primeira tela. Roda por último. */
/* ══════════════ partida ══════════════ */
function iniciar(){
  /* getLocation pode levar até 4 s (ou nunca responder). Até aqui o
     #palco ficava vazio: barra roxa e branco embaixo. */
  el('palco').innerHTML = '<div class="corpo">' + esqueleto(5) + '</div>';

  /* Sem ?turma= a pessoa abriu o app pelo atalho, não pelo QR da
     parede: é aí, e só aí, que aparece a tela inicial. Antes de
     qualquer uma das duas, a sessão: sem ela, login. */
  function semParametro(){ S.viaQr = false; retomarSessao({t:'inicio', p:{}}); }
  /* O servidor já pôs a turma na página (doGet). Sem espera nenhuma. */
  if (typeof S.turmaInicial === 'string'){
    if (S.turmaInicial){ S.viaQr = true; retomarSessao({t:'chamada', p:{turma:S.turmaInicial}}); }
    else semParametro();
    return;
  }
  try {
    if (google.script.url && google.script.url.getLocation){
      var respondeu = false;
      var prazo = setTimeout(function(){ if (!respondeu){ respondeu = true; semParametro(); } }, 4000);
      google.script.url.getLocation(function(loc){
        if (respondeu) return;
        respondeu = true; clearTimeout(prazo);
        var q = (loc && loc.parameter) || {};
        /* Quem está com o celular na mão sai do login, não da URL: o
           antigo ?prof= é ignorado. */
        var t = q.turma ? String(q.turma) : '';
        if (t){ S.viaQr = true; retomarSessao({t:'chamada', p:{turma:t}}); }
        else semParametro();
      });
    } else semParametro();
  } catch(e){ semParametro(); }
}

window.addEventListener('resize', medirBarra);
iniciar();
</script>
