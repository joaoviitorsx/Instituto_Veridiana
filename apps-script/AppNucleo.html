/* ─── utilidades ─── */
function el(id){ return document.getElementById(id); }

/* A coluna Comprovante é texto livre na planilha. Quem tem acesso de
   edição pode escrever javascript:... ali, e o link viraria execução de
   código ao ser tocado. Só http(s) passa. */
function urlSegura(u){
  return /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
}
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function iniciais(n){
  var p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0].charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}
var DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
             'agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return DIAS[d.getDay()] + ', ' + (+p[2]) + ' de ' + MESES[+p[1]-1];
}
function mesExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length < 2) return '';
  var m = MESES[+p[1] - 1] || '';
  return m.charAt(0).toUpperCase() + m.slice(1) + ' de ' + p[0];
}
function dataCurta(iso){
  var p = String(iso || '').split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : '';
}
/* Monta o link do WhatsApp. Número guardado só com dígitos; se vier sem
   o 55 do Brasil, entra na hora. */
function linkZap(tel, texto){
  var n = String(tel || '').replace(/[^0-9]/g, '');
  if (!n) return '';
  if (n.length <= 11) n = '55' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
}
function vibrar(){ try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){} }
function sorteioToken(){
  return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 10);
}
function semAcento(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}
function plural(n, um, muitos){ return n + ' ' + (n === 1 ? um : muitos); }
function primeiroNome(n){ return String(n || '').trim().split(/\s+/)[0] || ''; }
function hojeISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
         '-' + String(d.getDate()).padStart(2,'0');
}
function reais(v){
  var n = Number(v || 0);
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function copiar(txt){
  function ok(){ vibrar(); toast('Link copiado'); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, function(){ copiaAntiga(txt, ok); });
  } else copiaAntiga(txt, ok);
}
function copiaAntiga(txt, ok){
  var a = document.createElement('textarea');
  a.value = txt; a.setAttribute('readonly','');
  a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(a); a.focus(); a.select();
  var deu = false;
  try { deu = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(a);
  if (deu) ok(); else toast('Não deu para copiar sozinho. Segure o dedo no link.', 'erro');
}

/* ─── ponte com o Apps Script, com prazo ─── */
/* Sem prazo, um 4G que cai deixa o botao em "Salvando..." para sempre.
   Gerar PDF passa o prazo maior: o Drive leva seus segundos. */
function api(fn, args, ok, erro, prazo){
  /* Sem a ponte do Apps Script isto lançava ReferenceError dentro do
     depois() e a tela ficava no esqueleto para sempre, sem mensagem. */
  if (typeof google === 'undefined' || !google.script || !google.script.run){
    if (erro) erro({ message: 'A conexão com a planilha não abriu. Recarregue a página.' });
    return;
  }
  /* Toda função do servidor recebe a sessão na frente. Só o login não:
     é de lá que ela sai. */
  var chamada = ABERTAS[fn] ? (args || []) : [S.sessao].concat(args || []);
  var erroFinal = function(e){
    if (/^\s*(Error:\s*)?SESSAO:/.test(String(e && e.message || ''))){ sessaoCaiu(); return; }
    if (erro) erro(e);
  };
  var fim = false;
  var t = setTimeout(function(){
    if (fim) return; fim = true;
    if (erro) erro({ message:'A internet demorou demais para responder.' });
  }, prazo || 25000);
  function pronto(f){ return function(v){ if (fim) return; fim = true; clearTimeout(t); f(v); }; }
  /* Escrita que deu certo derruba a memória de leitura. */
  var okFinal = LEITURAS[fn] || ABERTAS[fn] ? ok : function(v){ MEM = {}; MEM_GEN++; ok(v); };
  var r = google.script.run
    .withSuccessHandler(pronto(okFinal))
    .withFailureHandler(pronto(erroFinal));
  r[fn].apply(r, chamada);
}
var ABERTAS = { entrar:1 };

/* ─── leitura com memória ───
   Cada ida ao Apps Script custa de meio a dois segundos, e isso não
   se otimiza do lado de cá. O que dá para fazer é não esperar por ela:
   tela já vista aparece na hora com o dado que tinha, e o dado novo
   chega por trás e repinta só se mudou. Qualquer escrita apaga a
   memória inteira: depois de salvar, nada velho aparece. */
var LEITURAS = {
  listarTurmas:1, carregarTurma:1, resumoInicial:1, modulo:1,
  listarAgenda:1, listarAgendaAno:1, datasFixas:1,
  listarMateriais:1, listarCategorias:1, listarLocais:1,
  entrarNaGestao:1, listarTurmasCompleto:1, listarAlunos:1, listarProfessores:1,
  mesesCaixa:1, listarCaixa:1, resumoCaixa:1, mesesComChamada:1, resumoHistorico:1,
  alunosParaCertificado:1, alunosEmRisco:1, contarRisco:1, aniversariantesSemana:1,
  relatorioPeriodo:1, obterUrlApp:1, obterLinkPlanilha:1, listarEquipe:1, quemSou:1
};
var MEM = {}, PEND = {}, MEM_GEN = 0;

function buscar(fn, args, k, ok, erro){
  if (PEND[k]){ PEND[k].push([ok, erro]); return; }
  PEND[k] = [[ok, erro]];
  var gen = MEM_GEN;
  api(fn, args, function(v){
    var j = JSON.stringify(v);
    /* Resposta que saiu antes de uma escrita não entra na memória. */
    if (gen === MEM_GEN) MEM[k] = {j:j, t:Date.now()};
    var l = PEND[k] || []; delete PEND[k];
    l.forEach(function(x){ x[0](j); });
  }, function(e){
    var l = PEND[k] || []; delete PEND[k];
    l.forEach(function(x){ if (x[1]) x[1](e); });
  });
}

/* o.fresco (ms): usa a memória só se for mais nova que isso, e responde
   uma vez só. Para quem não aguenta ser repintado — a chamada, que
   apagaria as faltas marcadas, e formulário, que apagaria o digitado. */
function ler(fn, args, ok, erro, o){
  o = o || {};
  var k = fn + JSON.stringify(args || []), m = MEM[k];
  /* Resposta de uma tela que a pessoa já deixou não pinta nada. Sem
     isto, voltar rápido da lista de turmas e entrar na Agenda fazia a
     lista chegar atrasada e ser desenhada por cima da agenda. */
  var tela = atual();
  function viva(){ return atual() === tela; }
  if (m && o.fresco){
    if (Date.now() - m.t < o.fresco){ ok(JSON.parse(m.j)); return; }
    m = null;
  }
  if (m) ok(JSON.parse(m.j));
  buscar(fn, args || [], k, function(j){
    if (viva() && (!m || j !== m.j)) ok(JSON.parse(j));
  }, function(e){ if (viva() && !m && erro) erro(e); });
}

/* Busca antes de a pessoa pedir. Não repete o que chegou há pouco. */
function preler(fn, args){
  var k = fn + JSON.stringify(args || []), m = MEM[k];
  if (m && Date.now() - m.t < 30000) return;
  buscar(fn, args || [], k, function(){}, null);
}

/* O Apps Script embrulha o erro e chega "Error: ...". Ninguem no
   instituto precisa ver isso. */
function textoErro(e){
  var m = (e && e.message) ? String(e.message) : '';
  m = m.replace(/^\s*(Error|Exception|ScriptError|GoogleJsonResponseException)\s*:\s*/i, '').trim();
  return m || 'Não deu certo. Tente de novo.';
}

/* ─── toast ─── */
var toastTimer;
function toast(texto, tipo, acao){
  var t = el('toast');
  el('toastIcone').innerHTML = ico(tipo === 'erro' ? 'alerta' : 'cheque');
  var alvo = el('toastTexto');
  alvo.textContent = texto;
  var velha = t.querySelector('.acao');
  if (velha) velha.remove();
  if (acao){
    var b = document.createElement('button');
    b.className = 'acao'; b.type = 'button'; b.textContent = acao.rotulo;
    b.addEventListener('click', function(){ fecharToast(); acao.fn(); });
    t.appendChild(b);
  }
  t.dataset.tipo = tipo || 'ok';
  t.dataset.aberto = 'true';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(fecharToast, acao ? 6000 : 3600);
}
function fecharToast(){ el('toast').dataset.aberto = 'false'; }

/* ─── bottom sheet reaproveitavel ─── */
var folhaAoFechar = null;
function abrirFolha(titulo, corpoHtml, aoFechar){
  /* Zera os handlers da folha anterior. pedirTexto e pedirFicha armam
     onkeydown; quem não rearma herdava o closure velho e o Enter
     explodia num campo que não existe mais. */
  el('folhaCorpo').onclick = null;
  el('folhaCorpo').onkeydown = null;
  el('folha').hidden = false;
  el('folhaTitulo').textContent = titulo;
  el('folhaCorpo').innerHTML = corpoHtml;
  el('folha').dataset.aberto = 'true';
  el('veu').dataset.aberto = 'true';
  folhaAoFechar = aoFechar || null;
}
function fecharFolha(){
  el('folha').dataset.aberto = 'false';
  el('veu').dataset.aberto = 'false';
  el('folha').style.transform = '';
  /* Fechada só por transform, a folha continuava alcançável por Tab e
     lida pelo leitor de tela — que ficava preso num diálogo que o
     usuário acha que fechou. */
  setTimeout(function(){
    if (el('folha').dataset.aberto !== 'true'){
      el('folhaCorpo').innerHTML = '';
      el('folhaCorpo').onclick = null;
      el('folhaCorpo').onkeydown = null;
      el('folha').hidden = true;
    }
  }, 320);
  var f = folhaAoFechar; folhaAoFechar = null;
  if (f) f();
}
function folhaAberta(){ return el('folha').dataset.aberto === 'true'; }

/* opcoes: [{txt, sub, ini, icone, marcado, perigo, fn}] */
function folhaOpcoes(titulo, opcoes){
  var html = '<ul>';
  opcoes.forEach(function(o, i){
    html += '<li><button type="button" class="opc'+(o.perigo?' perigo':'')+'" data-op="'+i+'"'+
            (o.marcado !== undefined ? ' aria-selected="'+(o.marcado?'true':'false')+'"' : '')+'>';
    if (o.ini) html += '<span class="ini">'+esc(iniciais(o.ini))+'</span>';
    else if (o.icone) html += ico(o.icone);
    html += '<span>'+esc(o.txt)+(o.sub ? '<small>'+esc(o.sub)+'</small>' : '')+'</span>';
    if (o.marcado !== undefined) html += '<span class="cv">'+ico('cheque')+'</span>';
    html += '</button></li>';
  });
  abrirFolha(titulo, html + '</ul>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-op]');
    if (!b) return;
    var o = opcoes[+b.dataset.op];
    fecharFolha();
    if (o && o.fn) setTimeout(o.fn, 60);
  };
}

/* Folha com vários campos. campos = [{id, rotulo, valor, tipo, dica}] */
function pedirFicha(titulo, campos, rotuloBotao, fn){
  var h = '<div style="padding:0 8px">';
  campos.forEach(function(c){
    h += '<div class="campo"><label for="f_' + c.id + '">' + esc(c.rotulo) + '</label>' +
         '<input id="f_' + c.id + '" type="' + (c.tipo || 'text') + '" ' +
         'autocomplete="off" autocapitalize="' + (c.tipo === 'text' || !c.tipo ? 'words' : 'none') + '" ' +
         (c.dica ? 'placeholder="' + esc(c.dica) + '" ' : '') +
         'value="' + esc(c.valor || '') + '"></div>';
  });
  abrirFolha(titulo, h + '</div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var r = {};
    for (var i = 0; i < campos.length; i++){
      var c = campos[i], v = (el('f_' + c.id).value || '').trim();
      if (c.obrigatorio && v.length < 2){
        toast('Preencha ' + c.rotulo.toLowerCase() + '.', 'erro'); return;
      }
      r[c.id] = v;
    }
    fecharFolha(); setTimeout(function(){ fn(r); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('f_' + campos[0].id); if (i){ i.focus(); i.select(); } }, 320);
}

/* pedir um texto sem usar prompt() */
function pedirTexto(titulo, rotulo, valor, rotuloBotao, fn){
  abrirFolha(titulo,
    '<div style="padding:0 8px"><div class="campo"><label for="campoTxt">' + esc(rotulo) + '</label>' +
    '<input id="campoTxt" type="text" autocomplete="off" autocapitalize="words" ' +
    'spellcheck="false" value="' + esc(valor || '') + '"></div></div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var v = (el('campoTxt').value || '').trim();
    if (v.length < 2){ toast('Escreva pelo menos 2 letras.', 'erro'); return; }
    fecharFolha(); setTimeout(function(){ fn(v); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('campoTxt'); if (i){ i.focus(); i.select(); } }, 320);
}

/* confirmacao de acao destrutiva */
function confirmar(titulo, texto, rotulo, fn){
  abrirFolha(titulo,
    '<p class="sub">'+esc(texto)+'</p>'+
    '<div class="acoes"><button type="button" class="cancelar" data-c="0">Cancelar</button>'+
    '<button type="button" class="confirmar" data-c="1">'+esc(rotulo)+'</button></div>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-c]');
    if (!b) return;
    var sim = b.dataset.c === '1';
    fecharFolha();
    if (sim) setTimeout(fn, 60);
  };
}

el('veu').addEventListener('click', fecharFolha);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && folhaAberta()) fecharFolha();
});

/* arrastar a folha para baixo para fechar */
(function(){
  var y0 = null, dy = 0, f = el('folha');
  function inicio(e){ if (!folhaAberta()) return; y0 = e.touches[0].clientY; dy = 0; f.classList.add('arrastando'); }
  function move(e){
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0){ f.style.transform = 'translateY('+dy+'px)'; }
  }
  function fim(){
    if (y0 === null) return;
    f.classList.remove('arrastando'); f.style.transform = '';
    if (dy > 90) fecharFolha();
    y0 = null;
  }
  ['puxador','folhaTitulo'].forEach(function(id){
    var n = el(id);
    n.addEventListener('touchstart', inicio, {passive:true});
    n.addEventListener('touchmove', move, {passive:true});
    n.addEventListener('touchend', fim);
    n.addEventListener('touchcancel', fim);
  });
})();

/* ─── roteador ─── */
var TELAS = {};
var ACOES = {};

function atual(){ return S.pilha[S.pilha.length-1]; }
function ir(t, p, raiz){ if (raiz) S.pilha = []; S.pilha.push({t:t, p:p||{}}); desenhar(); }
function trocar(t, p){ S.pilha[S.pilha.length-1] = {t:t, p:p||{}}; desenhar(); }
function voltar(){ if (S.pilha.length > 1){ S.pilha.pop(); desenhar(); } }

/* ─── módulos sob demanda ───
   A página só traz de saída o que a chamada e a tela inicial usam.
   Gestão, caixa, agenda e materiais chegam na primeira vez que alguém
   entra neles. O professor que escaneia o QR não baixa nada disso:
   a chamada, que é o que abre 20 vezes por dia, não paga pelo resto. */
var MODS = {};   /* nome -> true quando pronto, ou fila de espera */
function modPronto(nome){
  var fila = MODS[nome];
  MODS[nome] = true;
  if (fila && fila.forEach) fila.forEach(function(f){ f.ok(); });
}
function modDaTela(t){
  return /^ag/.test(t) ? 'agenda' : /^mt/.test(t) ? 'materiais' : 'gestao';
}
function carregarModulo(nome, ok, erro){
  ok = ok || function(){}; erro = erro || function(){};
  if (MODS[nome] === true){ ok(); return; }
  var jaPediu = !!MODS[nome];
  if (!jaPediu) MODS[nome] = [];
  MODS[nome].push({ok:ok, erro:erro});
  if (jaPediu) return;
  api('modulo', [nome], function(html){
    var fila = MODS[nome];
    /* innerHTML não executa <script>; cada bloco vira um elemento novo. */
    var re = /<(script|style)[^>]*>([\s\S]*?)<\/\1>/gi, m;
    while ((m = re.exec(html))){
      var n = document.createElement(m[1].toLowerCase());
      n.textContent = m[2];
      (m[1].toLowerCase() === 'style' ? document.head : document.body).appendChild(n);
    }
    if (MODS[nome] !== true){
      delete MODS[nome];
      fila.forEach(function(f){ f.erro({message:'Parte do app não carregou. Recarregue a página.'}); });
    }
  }, function(e){
    var fila = MODS[nome];
    delete MODS[nome];
    if (fila && fila.forEach) fila.forEach(function(f){ f.erro(e); });
  }, 40000);
}

ACOES.copiarLink = function(b){ copiar(b.getAttribute('data-u')); };

function desenhar(){
  var a = atual();
  if (!TELAS[a.t]){
    el('cabTitulo').textContent = '';
    el('btVoltar').hidden = S.pilha.length < 2;
    el('btVoltar').innerHTML = ico('esq', 24);
    el('btGestao').hidden = true;
    el('cabPlacar').hidden = true;
    document.body.classList.add('semcapa');
    el('palco').innerHTML = '<div class="corpo">' + esqueleto(4) + '</div>';
    el('barra').hidden = true; medirBarra();
    carregarModulo(modDaTela(a.t), function(){
      if (atual() === a) desenhar();
    }, function(e){
      if (atual() !== a) return;
      el('palco').innerHTML = '<div class="corpo">' +
        estado('alerta', 'Não deu para abrir', textoErro(e)) + '</div>';
    });
    return;
  }
  var tela = TELAS[a.t](a.p);

  el('cabTitulo').textContent = tela.titulo || '';
  el('btVoltar').hidden = S.pilha.length < 2 && !tela.voltar;
  el('btVoltar').innerHTML = ico('esq', 24);
  el('btGestao').hidden = !tela.gestao || !ehGestao();
  el('btGestao').innerHTML = ico('engrenagem', 22);
  el('cabPlacar').hidden = !tela.placar;

  document.body.classList.toggle('semcapa', !tela.capa);
  el('palco').innerHTML = (tela.capa || '') +
    (tela.solto ? tela.html : '<div class="corpo">' + tela.html + '</div>');

  var b = el('barra');
  if (tela.barra){ el('barraDentro').innerHTML = tela.barra; b.hidden = false; }
  else { b.hidden = true; }
  medirBarra();

  /* O toast vive fora do #palco e sobrevivia 6 s à navegação. "Desfazer"
     e "Tentar de novo" rodavam sobre uma tela que não existe mais. */
  fecharToast();
  window.scrollTo(0, 0);
  document.body.classList.remove('rolou');
  if (tela.depois) tela.depois();
}

function medirBarra(){
  var b = el('barra');
  document.documentElement.style.setProperty('--barra-h',
    b.hidden ? '0px' : b.offsetHeight + 'px');
}

el('btVoltar').addEventListener('click', voltar);
el('btGestao').addEventListener('click', function(){ comGestao('gestao'); });

/* Escuta no documento, não no #palco: a barra de ação (#barra) e o
   cabeçalho ficam FORA do palco, e um listener só no palco deixava
   "Salvar chamada", "Criar turma", "Adicionar aluno" e "Adicionar
   professor" sem resposta nenhuma. */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]');
  if (!b) return;
  var f = ACOES[b.getAttribute('data-acao')];
  if (f) f(b, e);
});

/* li[role=button] não sintetiza clique no Enter/Espaço como <button>.
   Sem isto, marcar falta e abrir aluno são inalcançáveis por teclado. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var alvo = e.target;
  if (!alvo || !alvo.getAttribute || alvo.getAttribute('role') !== 'button') return;
  if (!alvo.hasAttribute('data-acao')) return;
  e.preventDefault();
  alvo.click();
});

window.addEventListener('scroll', function(){
  document.body.classList.toggle('rolou', window.scrollY > 32);
}, {passive:true});

/* realce de toque: sem isso a lista parece morta no Android */
(function(){
  var no = null, y0 = 0;
  function limpa(){ if (no){ no.classList.remove('tocado'); no = null; } }
  document.addEventListener('touchstart', function(e){
    var n = e.target.closest('.li[data-acao]');
    if (n){ no = n; y0 = e.touches[0].clientY; n.classList.add('tocado'); }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (no && Math.abs(e.touches[0].clientY - y0) > 10) limpa();
  }, {passive:true});
  document.addEventListener('touchend', limpa);
  document.addEventListener('touchcancel', limpa);
})();

/* ─── esqueleto ─── */
function esqueleto(n){
  var h = '<ul class="lista">';
  for (var i = 0; i < (n || 6); i++){
    h += '<li class="esq"><div class="osso c"></div>' +
         '<div class="osso t" style="max-width:' + (48 + (i*17) % 38) + '%"></div>' +
         '<div class="osso s"></div></li>';
  }
  return h + '</ul>';
}
function estado(icone, titulo, texto, botao){
  return '<div class="estado"><div class="circulo">' + ico(icone, 30) + '</div>' +
         '<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p>' +
         (botao ? '<button type="button" class="botao" data-acao="' + botao.acao + '">' +
                  esc(botao.txt) + '</button>' : '') + '</div>';
}
