<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Chamada — Instituto Veridiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* A fonte entra por JS de propósito: um <link rel="stylesheet"> comum
   bloqueia a primeira pintura, e em 4G ruim isso é 1 segundo de tela
   branca. Assim o texto aparece na hora com a fonte do sistema e a
   Plus Jakarta Sans troca sozinha quando chega. */
(function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap';
  document.head.appendChild(l);
})();
</script>
<style>
:root{
  --roxo:#4A1D6E; --roxo-fundo:#3A1556;
  /* pares fraco/claro do roxo, seguindo o mesmo padrao dos estados */
  --roxo-fraco:#EDE4F3; --roxo-claro:#D6C3E8;

  --tinta:#1B1020; --fundo:#F4F1F7; --papel:#FFFFFF;
  --borda:#E5DCEC; --apagado:#6B5E78;

  --presente:#16704A; --presente-fraco:#E8F3ED;
  --falta:#AF2338;    --falta-fraco:#FBEAEE;
  --justif:#8A6314;   --justif-fraco:#FAF2E1;

  --r-p:10px; --r-m:14px; --r-g:22px;
  --sombra:0 1px 2px rgba(27,16,32,.05), 0 8px 24px rgba(27,16,32,.06);
  --curva:cubic-bezier(.32,.72,0,1);
  --barra-h:0px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}

html{background:var(--fundo)}
/* clip corta o transbordo lateral SEM virar container de rolagem.
   Com overflow-x:hidden aqui, o position:sticky do cabecalho para
   de grudar e a barra roxa some ao rolar. */
html{overflow-x:clip}
html,body{max-width:100%}

body{
  margin:0; background:var(--fundo); min-height:100vh; color:var(--tinta);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  /* nada de selecao de texto nem menu de long-press: o toque aqui e um
     controle, nao um paragrafo. Campos de digitacao reativam abaixo. */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  padding-bottom:var(--barra-h);
}

input,textarea{-webkit-user-select:text;user-select:text}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

:focus-visible{outline:3px solid var(--roxo);outline-offset:2px;border-radius:var(--r-p)}
.sobre-roxo :focus-visible{outline-color:#fff}

/* ─────────── cabecalho fixo ─────────── */
.cab{
  position:sticky; top:0; z-index:30;
  background:var(--roxo); color:#fff;
  padding-top:env(safe-area-inset-top);
  transition:box-shadow 200ms var(--curva);
}
.cab .linha{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 4px;
  max-width:644px;margin:0 auto}
.cab .icone{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-items:center;border-radius:var(--r-p);
  transition:background 160ms var(--curva);
}
.cab .icone:active{background:rgba(255,255,255,.16)}
.cab .meio{flex:1;min-width:0;position:relative}
.cab .marca{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--roxo-claro);
  white-space:nowrap;opacity:1;transition:opacity 200ms var(--curva);pointer-events:none;
}
body.rolou .cab .marca, body.semcapa .cab .marca{opacity:0}
.cab .compacto{
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0; transition:opacity 200ms var(--curva);
}
.cab .placar{
  flex-shrink:0;padding-right:12px;text-align:right;
  font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  opacity:0; transition:opacity 200ms var(--curva);
}
body.rolou .cab{box-shadow:0 1px 0 rgba(0,0,0,.14), 0 6px 16px rgba(27,16,32,.16)}
body.rolou .cab .compacto,
body.rolou .cab .placar{opacity:1}
/* em telas sem capa (gestão) o título já nasce visível */
body.semcapa .cab .compacto{opacity:1}

/* ─────────── capa roxa que rola ─────────── */
.capa{background:var(--roxo);color:#fff;padding:4px 20px 24px}
.capa .topo{display:flex;align-items:flex-end;gap:16px;max-width:620px;margin:0 auto}
.capa h1{
  margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  flex:1;min-width:0;overflow-wrap:anywhere;
}
.capa .data{margin:4px 0 0;font-size:14px;color:var(--roxo-claro)}
.capa .conta{text-align:right;flex-shrink:0;line-height:1}
.capa .conta b{font-size:32px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.capa .conta span{display:block;font-size:13px;color:var(--roxo-claro);margin-top:4px;font-weight:500}

main{padding:0 0 24px}
.corpo{padding:20px 16px 0;max-width:620px;margin:0 auto}

/* ─────────── cartao do professor ─────────── */
.prof{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:12px 16px;margin-bottom:20px;text-align:left;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  transition:background 160ms var(--curva);
}
.prof:active{background:var(--fundo)}
.prof .ini{flex-shrink:0}
.prof .txt{flex:1;min-width:0}
.prof .txt small{display:block;font-size:13px;color:var(--apagado);line-height:1.3}
.prof .txt b{font-size:16px;font-weight:600;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof[data-vazio="true"] .txt b{color:var(--apagado);font-weight:400}
.prof .seta{flex-shrink:0;color:var(--apagado)}

/* ─────────── instrucao ─────────── */
.instrucao{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:12px;padding-left:4px;
}
.instrucao span{font-size:14px;color:var(--apagado)}
.instrucao button{
  font-size:14px;font-weight:600;color:var(--roxo);
  min-height:44px;padding:0 12px;margin:0 -4px 0 0;border-radius:var(--r-p);
}
.instrucao button:active{background:var(--roxo-fraco)}

/* ─────────── aviso ─────────── */
.aviso{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--justif-fraco);border:1px solid #E7D4A8;color:#6B4E12;
  padding:12px 16px;border-radius:var(--r-m);font-size:14px;margin-bottom:16px;
}
.aviso svg{flex-shrink:0;margin-top:2px}

/* ─────────── lista agrupada ─────────── */
/* Uma superficie so, com fios internos. Vinte cartoes flutuando cada um
   com sua sombra e o visual de dashboard web, nao de lista de aplicativo. */
.lista{
  list-style:none;margin:0 0 16px;padding:0;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);overflow:hidden;
}
.li{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:12px 16px;min-height:64px;
  transition:background 160ms var(--curva);
}
.li+.li::before{
  content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--borda);
}
.li[data-st="Falta"]{background:var(--falta-fraco)}
.li[data-st="Justificada"]{background:var(--justif-fraco)}
.li.tocado{background:var(--roxo-fraco)}
.li[data-st="Falta"].tocado{background:#F6DDE3}
.li[data-st="Justificada"].tocado{background:#F5EAD3}

.ini{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--roxo-fraco);color:var(--roxo);
  font-size:13px;font-weight:700;letter-spacing:.02em;
  transition:background 160ms var(--curva),color 160ms var(--curva);
}
.li[data-st="Falta"] .ini{background:var(--falta);color:#fff}
.li[data-st="Justificada"] .ini{background:var(--justif);color:#fff}

.nome{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}

.marca{flex-shrink:0;display:grid;place-items:center}
.marca .ok{
  width:26px;height:26px;border-radius:50%;
  background:var(--presente-fraco);color:var(--presente);
  display:grid;place-items:center;
}
.marca .selo{
  padding:6px 12px;border-radius:999px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.li[data-st="Falta"] .selo{background:var(--falta);color:#fff}
.li[data-st="Justificada"] .selo{background:var(--justif);color:#fff}

/* ─────────── barra de salvar ─────────── */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--fundo);border-top:1px solid var(--borda);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.barra .dentro{max-width:620px;margin:0 auto}
.salvar{
  width:100%;min-height:52px;padding:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  color:#fff;background:var(--roxo);border-radius:var(--r-m);
  transition:background 160ms var(--curva);
}
.salvar:active{background:var(--roxo-fundo)}
.salvar:disabled{background:#AC9BBA}

/* ─────────── bottom sheet ─────────── */
.veu{
  position:fixed;inset:0;z-index:40;background:rgba(27,16,32,.5);
  opacity:0;transition:opacity 240ms var(--curva);pointer-events:none;
}
.veu[data-aberto="true"]{opacity:1;pointer-events:auto}

.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--papel);
  border-radius:var(--r-g) var(--r-g) 0 0;
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform 300ms var(--curva);
  max-height:80vh;display:flex;flex-direction:column;
}
.folha[data-aberto="true"]{transform:translateY(0)}
.folha.arrastando{transition:none}
.puxador{width:38px;height:4px;border-radius:999px;background:#D9CFE2;margin:4px auto 12px;flex-shrink:0}
.folha h2{margin:0 20px 8px;font-size:17px;font-weight:700;letter-spacing:-.015em;flex-shrink:0}
.folha .sub{margin:0 20px 12px;font-size:14px;color:var(--apagado);flex-shrink:0}
.folha .rolo{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px}
.folha ul{list-style:none;margin:0;padding:0}
.folha .opc{
  width:100%;display:flex;align-items:center;gap:12px;
  min-height:56px;padding:12px;text-align:left;
  font-size:16px;font-weight:600;border-radius:var(--r-p);
  transition:background 160ms var(--curva);
}
.folha .opc:active{background:var(--fundo)}
.folha .opc .cv{margin-left:auto;color:var(--roxo);opacity:0;flex-shrink:0}
.folha .opc[aria-selected="true"] .cv{opacity:1}
.folha .opc.perigo{color:var(--falta)}
.folha .opc small{display:block;font-size:13px;font-weight:400;color:var(--apagado)}
.folha .opc .ini{width:34px;height:34px;flex-basis:34px}
.folha .acoes{display:flex;gap:8px;padding:12px 20px 0;flex-shrink:0}
.folha .acoes button{
  flex:1;min-height:52px;border-radius:var(--r-m);font-size:16px;font-weight:700;
  transition:background 160ms var(--curva);
}
.folha .acoes .cancelar{background:var(--fundo);color:var(--tinta)}
.folha .acoes .cancelar:active{background:var(--borda)}
.folha .acoes .confirmar{background:var(--falta);color:#fff}
.folha .acoes .confirmar:active{background:#8E1B2C}

/* ─────────── toast ─────────── */
.toast{
  position:fixed;z-index:60;left:16px;right:16px;
  bottom:calc(16px + var(--barra-h) + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
  display:flex;align-items:flex-start;gap:12px;
  background:var(--tinta);color:#fff;
  padding:12px 16px;border-radius:var(--r-m);
  font-size:15px;font-weight:500;line-height:1.35;
  box-shadow:0 12px 32px rgba(27,16,32,.32);
  transform:translateY(150%);opacity:0;pointer-events:none;
  transition:transform 340ms var(--curva),opacity 200ms var(--curva);
}
.toast[data-aberto="true"]{transform:translateY(0);opacity:1;pointer-events:auto}
.toast svg{flex-shrink:0;margin-top:2px}
.toast .acao{align-self:center}
.toast span{flex:1;min-width:0}
.toast[data-tipo="erro"]{background:#7E1828}
.toast .acao{
  flex-shrink:0;font-size:15px;font-weight:700;color:#fff;
  min-height:44px;min-width:44px;padding:0 8px;margin:-8px 0;
  text-decoration:underline;
}

/* ─────────── esqueleto ─────────── */
.osso{
  background:linear-gradient(90deg,#E9E2EF 25%,#F2EDF6 50%,#E9E2EF 75%);
  background-size:200% 100%;animation:brilho 1.4s linear infinite;border-radius:var(--r-p);
}
@keyframes brilho{to{background-position:-200% 0}}
.esq{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
.esq+.esq{border-top:1px solid var(--borda)}
.esq .c{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.esq .t{height:14px;flex:1}
.esq .s{width:26px;height:26px;border-radius:50%;flex-shrink:0}

/* ─────────── estados de tela inteira ─────────── */
.estado{text-align:center;padding:48px 24px}
.estado .circulo{
  width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;background:var(--roxo-fraco);color:var(--roxo);
}
.estado h2{font-size:21px;margin:0 0 8px;letter-spacing:-.015em}
.estado p{color:var(--apagado);margin:0;font-size:15px;line-height:1.5}
.estado .botao{
  display:inline-block;margin-top:24px;padding:16px 24px;min-height:52px;
  font-size:16px;font-weight:600;color:var(--roxo);
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
}

/* ─────────── sucesso ─────────── */
/* O unico momento de movimento do aplicativo. Tudo o mais entra parado. */
.fim{
  min-height:calc(100vh - 56px);background:var(--roxo);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.fim .selo-ok{
  width:88px;height:88px;border-radius:50%;margin-bottom:24px;
  background:rgba(255,255,255,.14);display:grid;place-items:center;
}
/* Visível por padrão; a animação só desenha a entrada. Antes o estado
   base era escondido, e qualquer coisa que impedisse a animação deixava
   o check invisível para sempre. */
.fim .selo-ok svg path{
  stroke-dasharray:32;
  animation:risca 420ms var(--curva) 120ms both;
}
@keyframes risca{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
.fim h2{font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
.fim p{margin:0;color:var(--roxo-claro);font-size:16px;line-height:1.5}
.fim .botao{
  margin-top:32px;padding:16px 24px;min-height:52px;
  font-size:16px;font-weight:700;color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:var(--r-m);
  transition:background 160ms var(--curva);
}
.fim .botao:active{background:rgba(255,255,255,.14)}

/* ─────────── cartoes de navegacao ─────────── */
.cartoes{list-style:none;margin:0;padding:0}
.cartoes li{margin-bottom:12px}
.cartoes .item{
  width:100%;display:flex;align-items:center;gap:12px;
  text-align:left;padding:16px;min-height:64px;
  font-size:17px;font-weight:600;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  transition:background 160ms var(--curva);
}
.cartoes .item:active{background:var(--fundo)}
.cartoes .item .txt{flex:1;min-width:0}
.cartoes .item small{display:block;font-size:13px;font-weight:400;color:var(--apagado);margin-top:2px}
.cartoes .item .seta{margin-left:auto;color:var(--apagado);flex-shrink:0}

/* ─────────── histórico ─────────── */
.passo{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  padding:4px;margin-bottom:16px;
}
.passo b{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.01em}
.passo button{
  width:44px;height:44px;flex:0 0 44px;border-radius:var(--r-p);
  display:grid;place-items:center;color:var(--roxo);
  transition:background 160ms var(--curva);
}
.passo button:active{background:var(--roxo-fraco)}
.passo button:disabled{color:var(--borda)}

.resumo{
  background:var(--roxo);color:#fff;border-radius:var(--r-m);
  padding:20px;text-align:center;
}
.resumo b{display:block;font-size:32px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.resumo span{display:block;font-size:14px;color:var(--roxo-claro);margin-top:4px}

.dia{font-size:13px;font-weight:600;color:var(--apagado);margin:16px 4px 8px}
.nome small{display:block;font-size:13px;font-weight:400;color:var(--apagado);margin-top:2px}
.pct{
  flex-shrink:0;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--apagado);
}
.pct.cheio{color:var(--presente)}
/* lista sem avatar: o fio interno alinha com o texto, nao com o circulo */
.lista.sem-avatar .li+.li::before{left:16px}

.cartao-info{
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  padding:20px;margin-bottom:12px;text-align:center;color:var(--roxo);
}
.cartao-info b{display:block;font-size:17px;font-weight:700;color:var(--tinta);margin:12px 0 4px}
.cartao-info span{display:block;font-size:14px;color:var(--apagado);line-height:1.5}

.botao-cheio{
  width:100%;min-height:52px;padding:16px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;color:#fff;background:var(--roxo);
  text-decoration:none;transition:background 160ms var(--curva);
}
.botao-cheio:active{background:var(--roxo-fundo)}
.botao-cheio:disabled{background:#AC9BBA}

/* ─────────── caixa ─────────── */
.saldo{
  background:var(--roxo);color:#fff;border-radius:var(--r-m);
  padding:20px;text-align:center;margin-bottom:8px;
}
.saldo>span{display:block;font-size:13px;color:var(--roxo-claro)}
.saldo>b{
  display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin-top:4px;
}
.saldo-linha{
  display:flex;gap:8px;margin-top:16px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.2);
}
.saldo-linha div{
  flex:1;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
}
.saldo-linha small{display:block;font-size:12px;color:var(--roxo-claro);font-weight:400;margin-top:2px}
.saldo-linha .ent{color:#A8E6C6}
.saldo-linha .sai{color:#F2B8C2}

.dinheiro{
  flex-shrink:0;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.dinheiro.ent{color:var(--presente)}
.dinheiro.sai{color:var(--falta)}

.bt-entrada,.bt-saida{
  flex:1;min-height:52px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;color:#fff;
  transition:background 160ms var(--curva);
}
.bt-entrada{background:var(--presente)}
.bt-entrada:active{background:#115A3B}
.bt-saida{background:var(--falta)}
.bt-saida:active{background:#8E1B2C}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:10px 14px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--apagado);
  background:var(--fundo);border:1px solid var(--borda);
  transition:background 160ms var(--curva),color 160ms var(--curva);
}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}

.campo label i{font-style:normal;font-weight:400;color:var(--apagado)}

      CHAMADAS.push({ data:hoje(), turma:d.turma, professor:d.professor });
      d.presencas.forEach(function(p){
        REGISTROS.push({ data:hoje(), turma:d.turma, professor:d.professor,
                         aluno:p.aluno, status:p.status });
      });
      var pres = d.presencas.filter(function(p){ return p.status==='Presente'; }).length;
      var r = { ok:true, turma:d.turma, professor:d.professor, data:hoje(),
                total:d.presencas.length, presentes:pres, faltas:d.presencas.length-pres };
      if (d.token) TOKENS[d.token] = r;
      return r;
    },
    entrarNaGestao: function(pin){
      exigirPin(pin);
      return {
        ok:true,
        turmas: TURMAS.filter(function(t){ return t.ativa; }).length,
        alunosAtivos: ALUNOS.filter(function(a){ return a.ativo; }).length,
        alunosInativos: ALUNOS.filter(function(a){ return !a.ativo; }).length,
        professores: PROFS.length
      };
    },
    listarTurmasCompleto: function(pin){
      exigirPin(pin);
      return TURMAS.filter(function(t){ return t.ativa; }).map(function(t){
        return { nome:t.nome,
          ativos: ALUNOS.filter(function(a){ return a.turma===t.nome && a.ativo; }).length,
          inativos: ALUNOS.filter(function(a){ return a.turma===t.nome && !a.ativo; }).length };
      }).sort(function(a,b){ return pt(a.nome,b.nome); });
    },
    criarTurma: function(pin, nome){
      exigirPin(pin); var n = exigirNome(nome);
      var j = TURMAS.filter(function(t){ return chave(t.nome)===chave(n); })[0];
      if (j && j.ativa) throw new Error('Já existe uma turma com esse nome.');
      if (j){ j.ativa = true; return {ok:true, nome:j.nome}; }
      TURMAS.push({ nome:n, ativa:true }); return {ok:true, nome:n};
    },
    renomearTurma: function(pin, atual, novo){
      exigirPin(pin); var n = exigirNome(novo);
      if (TURMAS.some(function(t){ return chave(t.nome)===chave(n) && t.nome!==atual; }))
        throw new Error('Já existe uma turma com esse nome.');
      var t = TURMAS.filter(function(x){ return x.nome===atual; })[0];
      if (!t) throw new Error('Turma não encontrada.');
      t.nome = n;
      ALUNOS.forEach(function(a){ if (a.turma===atual) a.turma = n; });
      CHAMADAS.forEach(function(c){ if (c.turma===atual) c.turma = n; });
      REGISTROS.forEach(function(r){ if (r.turma===atual) r.turma = n; });
      return {ok:true, nome:n};
    },
    arquivarTurma: function(pin, nome){
      exigirPin(pin);
      if (ALUNOS.some(function(a){ return a.turma===nome && a.ativo; }))
        throw new Error('Mova ou desative os alunos antes de arquivar.');
      var t = TURMAS.filter(function(x){ return x.nome===nome; })[0];
      if (!t) throw new Error('Turma não encontrada.');
      t.ativa = false; return {ok:true};
    },
    listarAlunos: function(pin, turma, incluirInativos){
      exigirPin(pin);
      return ALUNOS.filter(function(a){
        if (turma && a.turma!==turma) return false;
        if (!incluirInativos && !a.ativo) return false;
        return true;
      }).map(function(a){ return {nome:a.nome, turma:a.turma, ativo:a.ativo,
          nascimento:a.nascimento, responsavel:a.responsavel, telefone:a.telefone}; })
        .sort(function(a,b){ return pt(a.nome,b.nome); });
    },
    adicionarAluno: function(pin, turma, nome, dados){
      exigirPin(pin); var n = exigirNome(nome);
      if (ALUNOS.some(function(a){ return a.turma===turma && chave(a.nome)===chave(n); }))
        throw new Error('Esse aluno já está nessa turma.');
      if (!TURMAS.some(function(t){ return t.nome===turma && t.ativa; }))
        TURMAS.push({nome:turma, ativa:true});
      var d = dados || {};
      ALUNOS.push({turma:turma, nome:n, ativo:true, nascimento:d.nascimento||'',
                   responsavel:d.responsavel||'', telefone:(d.telefone||'').replace(/[^0-9]/g,'')});
      return {ok:true};
    },
    moverAluno: function(pin, nome, destino, origem){
      exigirPin(pin);
      var a = acharAluno(nome, origem);
      if (a.turma === destino) return {ok:true};
      if (ALUNOS.some(function(x){ return x.turma===destino && chave(x.nome)===chave(a.nome); }))
        throw new Error('Já existe um aluno com esse nome em '+destino+'.');
      a.turma = destino; return {ok:true};
    },
    desativarAluno: function(pin, nome, turma){ exigirPin(pin); acharAluno(nome,turma).ativo = false; return {ok:true}; },
    reativarAluno:  function(pin, nome, turma){ exigirPin(pin); acharAluno(nome,turma).ativo = true;  return {ok:true}; },
    listarProfessores: function(pin){ exigirPin(pin); return PROFS.slice().sort(pt); },
    adicionarProfessor: function(pin, nome){
      exigirPin(pin); var n = exigirNome(nome);
      if (PROFS.some(function(p){ return chave(p)===chave(n); }))
        throw new Error('Esse professor já está na equipe.');
      PROFS.push(n); return {ok:true};
    },
    removerProfessor: function(pin, nome){
      exigirPin(pin);
      var i = PROFS.findIndex(function(p){ return chave(p)===chave(nome); });
      if (i === -1) throw new Error('Professor não encontrado.');
      PROFS.splice(i,1); return {ok:true};
    },
    obterUrlApp: function(pin){ exigirPin(pin); return URL_APP; },

    alunosParaCertificado: function(pin, turma){
      exigirPin(pin);
      var min = {}; TURMAS.forEach(function(t){ min[t.nome] = t.minutos || 60; });
      var h = {};
      REGISTROS.forEach(function(r){
        if (!h[r.aluno]) h[r.aluno] = {primeira:r.data, ultima:r.data, aulas:0, minutos:0};
        var x = h[r.aluno];
        if (r.data < x.primeira) x.primeira = r.data;
        if (r.data > x.ultima) x.ultima = r.data;
        if (r.status === 'Presente'){ x.aulas++; x.minutos += (min[r.turma] || 60); }
      });
      return ALUNOS.filter(function(a){ return !turma || a.turma === turma; })
        .map(function(a){
          var x = h[a.nome];
          return { nome:a.nome, turma:a.turma, ativo:a.ativo,
                   aulas: x ? x.aulas : 0, horas: x ? Math.round(x.minutos/60) : 0,
                   desde: x ? x.primeira : '', homonimo:false,
                   responsavel:a.responsavel, telefone:a.telefone };
        }).sort(function(a,b){ return pt(a.nome,b.nome); });
    },
    gerarCertificado: function(pin, nomes, turma){
      exigirPin(pin);
      var lista = (nomes || []).filter(Boolean);
      if (!lista.length) throw new Error('Escolha pelo menos um aluno.');
      var comAula = API.alunosParaCertificado(pin, '').filter(function(a){
        return lista.indexOf(a.nome) !== -1 && a.aulas > 0;
      }).map(function(a){ return a.nome; });
      if (!comAula.length) throw new Error('Nenhum desses alunos tem presença registrada ainda.');
      return { ok:true,
        url:'https://drive.google.com/file/d/1EXEMPLO_CERTIFICADO_0000000/view',
        nome: comAula.length === 1
          ? 'Certificado — ' + comAula[0] + ' — ' + hoje() + '.pdf'
          : 'Certificados — ' + (turma || 'vários') + ' — ' + hoje() + '.pdf',
        quantidade: comAula.length, completo:true,
        aluno: comAula.length === 1 ? comAula[0] : '',
        publico: comAula.length === 1,
        ignorados: lista.filter(function(n){ return comAula.indexOf(n) === -1; }) };
    },
    mesesCaixa: function(pin){
      exigirPin(pin);
      var v = {}; CAIXA.forEach(function(r){ v[r.data.slice(0,7)] = 1; });
      var ms = Object.keys(v).sort().reverse();
      var ag = hoje().slice(0,7);
      if (ms.indexOf(ag) === -1) ms.unshift(ag);
      return ms;
    },
    listarCaixa: function(pin, mes){
      exigirPin(pin);
      var doMes = CAIXA.filter(function(r){ return r.data.slice(0,7) === mes; });
      var entrou = 0, saiu = 0;
      doMes.forEach(function(r){ if (r.tipo === 'Entrada') entrou += r.valor; else saiu += r.valor; });
      var acc = 0;
      CAIXA.forEach(function(r){
        if (r.data.slice(0,7) > mes) return;
        acc += (r.tipo === 'Entrada' ? r.valor : -r.valor);
      });
      doMes.sort(function(a,b){ return a.data === b.data ? b.linha - a.linha : (a.data < b.data ? 1 : -1); });
      return { mes:mes, lancamentos:doMes.slice(), entrou:entrou, saiu:saiu,
               doMes:entrou-saiu, acumulado:acc,
               categorias:{Entrada:CAT_ENTRADA, 'Saída':CAT_SAIDA}, fontes:fontesUsadas() };
    },
    lancarCaixa: function(pin, d){
      exigirPin(pin);
      var tipo = d.tipo === 'Entrada' ? 'Entrada' : (d.tipo === 'Saída' ? 'Saída' : '');
      if (!tipo) throw new Error('Diga se é entrada ou saída.');
      var valor = valorNumero(d.valor);
      if (!(valor > 0)) throw new Error('Escreva um valor maior que zero.');
      CAIXA.push({ registro:'', data:d.data || hoje(), tipo:tipo, valor:valor,
        categoria:d.categoria || 'Outro', descricao:d.descricao || '', fonte:d.fonte || '',
        comprovante: d.foto ? 'https://drive.google.com/mock' : '',
        quem:d.quem || '', linha: proximaLinha++ });
      return { ok:true, comFoto: !!d.foto, pediuFoto: !!d.foto };
    },
    apagarLancamento: function(pin, linha, valorConfere){
      exigirPin(pin);
      var i = CAIXA.findIndex(function(r){ return String(r.linha) === String(linha); });
      if (i === -1) throw new Error('Lançamento não encontrado.');
      if (valorConfere !== undefined && Math.abs(CAIXA[i].valor - Number(valorConfere)) > 0.005)
        throw new Error('A lista mudou desde que você abriu. Recarregue e tente de novo.');
      CAIXA.splice(i,1); return {ok:true};
    },
    resumoCaixa: function(pin, ini, fim){
      exigirPin(pin);
      if (ini > fim) throw new Error('A data de início vem depois da data de fim.');
      var doP = CAIXA.filter(function(r){ return r.data >= ini && r.data <= fim; });
      var cat = {Entrada:{}, 'Saída':{}}, fon = {}, entrou = 0, saiu = 0, sem = 0;
      doP.forEach(function(r){
        var lado = r.tipo === 'Entrada' ? 'Entrada' : 'Saída';
        cat[lado][r.categoria] = (cat[lado][r.categoria] || 0) + r.valor;
        var f = r.fonte || 'Sem fonte informada';
        if (!fon[f]) fon[f] = {fonte:f, entrou:0, saiu:0};
        if (lado === 'Entrada'){ fon[f].entrou += r.valor; entrou += r.valor; }
        else { fon[f].saiu += r.valor; saiu += r.valor; if (!r.comprovante) sem++; }
      });
      function ord(m){ return Object.keys(m).map(function(k){ return {nome:k, valor:m[k]}; })
        .sort(function(a,b){ return b.valor - a.valor; }); }
      return { inicio:ini, fim:fim, entrou:entrou, saiu:saiu, saldo:entrou-saiu,
               lancamentos:doP.length, semComprovante:sem,
               entradas:ord(cat.Entrada), saidas:ord(cat['Saída']),
               fontes:Object.keys(fon).map(function(k){ return fon[k]; })
                 .sort(function(a,b){ return (b.entrou+b.saiu)-(a.entrou+a.saiu); }) };
    },
    obterLinkPlanilha: function(pin){
      exigirPin(pin);
      return { url:'https://docs.google.com/spreadsheets/d/1EXEMPLO000000000000000000000/edit',
               nome:'Frequência — Veridiana' };
    },
    arrumarPlanilha: function(pin){ exigirPin(pin); return {ok:true, mensagem:'Planilha arrumada.'}; },

    mesesComChamada: function(pin){
      exigirPin(pin);
      var v = {};
      CHAMADAS.forEach(function(c){ v[c.data.slice(0,7)] = 1; });
      return Object.keys(v).sort().reverse();
    },
    atualizarAluno: function(pin, nome, turma, dados){
      exigirPin(pin);
      var a = acharAluno(nome, turma), d = dados || {};
      a.nascimento = d.nascimento || '';
      a.responsavel = d.responsavel || '';
      a.telefone = (d.telefone || '').replace(/[^0-9]/g,'');
      return {ok:true};
    },
    alunosEmRisco: function(pin, minimo){
      exigirPin(pin);
      var alvo = Math.max(2, Number(minimo) || 3);
      var datas = {}, st = {};
      REGISTROS.forEach(function(r){
        if (!datas[r.turma]) datas[r.turma] = {};
        datas[r.turma][r.data] = 1;
        st[r.turma+'|'+r.aluno+'|'+r.data] = r.status;
      });
      Object.keys(datas).forEach(function(t){
        datas[t] = Object.keys(datas[t]).sort().reverse();
      });
      var fora = [];
      ALUNOS.forEach(function(a){
        if (!a.ativo) return;
        var ds = datas[a.turma];
        if (!ds || !ds.length) return;
        var seguidas=0, just=0, ult='', desde='';
        for (var i=0;i<ds.length;i++){
          var x = st[a.turma+'|'+a.nome+'|'+ds[i]];
          if (x === undefined) break;
          if (x === 'Presente'){ ult = ds[i]; break; }
          seguidas++; if (x === 'Justificada') just++;
          desde = ds[i];
        }
        if (seguidas >= alvo) fora.push({ aluno:a.nome, turma:a.turma, faltas:seguidas,
          justificadas:just, desde:desde, ultimaPresenca:ult,
          responsavel:a.responsavel, telefone:a.telefone, idade:idadeEm(a.nascimento) });
      });
      fora.sort(function(x,y){ return y.faltas - x.faltas || pt(x.aluno,y.aluno); });
      return { minimo:alvo, alunos:fora };
    },
    contarRisco: function(pin){ return API.alunosEmRisco(pin, 3).alunos.length; },
    aniversariantesSemana: function(pin){ exigirPin(pin); return aniversariosEntre(0, 6, ''); },
    relatorioPeriodo: function(pin, ini, fim){
      exigirPin(pin);
      if (ini > fim) throw new Error('A data de início vem depois da data de fim.');
      var linhas = REGISTROS.filter(function(r){ return r.data >= ini && r.data <= fim; });
      var ben = {}, aulas = {}, pt2 = {};
      linhas.forEach(function(r){
        ben[r.aluno] = 1; aulas[r.data+'|'+r.turma] = 1;
        if (!pt2[r.turma]) pt2[r.turma] = {turma:r.turma, dias:{}, alunos:{}, presentes:0, total:0};
        var t = pt2[r.turma];
        t.dias[r.data]=1; t.alunos[r.aluno]=1; t.total++;
        if (r.status==='Presente') t.presentes++;
      });
      var idades = {};
      ALUNOS.forEach(function(a){ idades[a.nome] = idadeEm(a.nascimento); });
      var faixas = {'Crianças (até 11)':0,'Adolescentes (12 a 17)':0,'Jovens (18 a 29)':0,'Sem data de nascimento':0};
      Object.keys(ben).forEach(function(n){
        var i = idades[n];
        if (i === null || i === undefined) faixas['Sem data de nascimento']++;
        else if (i <= 11) faixas['Crianças (até 11)']++;
        else if (i <= 17) faixas['Adolescentes (12 a 17)']++;
        else faixas['Jovens (18 a 29)']++;
      });
      var turmas = Object.keys(pt2).map(function(k){
        var t = pt2[k];
        return {turma:t.turma, aulas:Object.keys(t.dias).length, alunos:Object.keys(t.alunos).length,
                presentes:t.presentes, total:t.total,
                pct: t.total ? Math.round(t.presentes*100/t.total) : 0};
      }).sort(function(a,b){ return pt(a.turma,b.turma); });
      var P=0,T=0; turmas.forEach(function(t){ P+=t.presentes; T+=t.total; });
      return { inicio:ini, fim:fim, completo:true, beneficiarios:Object.keys(ben).length,
               aulas:Object.keys(aulas).length, turmas:turmas, faixas:faixas,
               frequencia: T ? Math.round(P*100/T) : 0 };
    },
    resumoHistorico: function(pin, mes){
      exigirPin(pin);
      var doMes = REGISTROS.filter(function(r){ return r.data.slice(0,7) === mes; });
      var mapa = {}, porTurma = {};
      doMes.forEach(function(r){
        var k = r.data + '|' + r.turma;
        if (!mapa[k]) mapa[k] = {data:r.data, turma:r.turma, professor:r.professor, presentes:0, total:0};
        mapa[k].total++;
        if (r.status === 'Presente') mapa[k].presentes++;
        if (!porTurma[r.turma]) porTurma[r.turma] = {turma:r.turma, dias:{}, presentes:0, total:0};
        porTurma[r.turma].dias[r.data] = 1;
        porTurma[r.turma].total++;
        if (r.status === 'Presente') porTurma[r.turma].presentes++;
      });
      var aulas = Object.keys(mapa).map(function(k){ return mapa[k]; });
      aulas.sort(function(a,b){ return a.data===b.data ? pt(a.turma,b.turma) : (a.data<b.data?1:-1); });
      var turmas = Object.keys(porTurma).map(function(k){
        var t = porTurma[k];
        return {turma:t.turma, aulas:Object.keys(t.dias).length, presentes:t.presentes,
                total:t.total, pct: t.total ? Math.round(t.presentes*100/t.total) : 0};
      }).sort(function(a,b){ return pt(a.turma,b.turma); });
      var P=0, T=0;
      turmas.forEach(function(t){ P+=t.presentes; T+=t.total; });
      return { mes:mes, aulas:aulas, turmas:turmas,
               totais:{ aulas:aulas.length, presentes:P, marcacoes:T,
                        pct: T ? Math.round(P*100/T) : 0 } };
    }
  };

  /* ─── a ponte, igualzinha à do Apps Script ─── */
  function Corredor(ok, err){ this._ok = ok; this._err = err; }
  Corredor.prototype.withSuccessHandler = function(f){ return new Corredor(f, this._err); };
  Corredor.prototype.withFailureHandler = function(f){ return new Corredor(this._ok, f); };
  Object.keys(API).forEach(function(nome){
    Corredor.prototype[nome] = function(){
      var args = [].slice.call(arguments), ok = this._ok, err = this._err;
      var espera = CFG.atraso + Math.random() * CFG.atraso * 0.6;
      setTimeout(function(){
        if (CFG.offline){ if (err) err(new Error('Falha na rede.')); return; }
        if (CFG.falha && Math.random() < CFG.falha){
          if (err) err(new Error('Falha de rede simulada.')); return;
        }
        var r;
        try { r = API[nome].apply(null, args); }
        catch (e){ if (err) err(e); return; }
        if (ok) ok(JSON.parse(JSON.stringify(r)));
      }, espera);
      console.log('[mock] ' + nome, args);
    };
  });

  window.google = {
    script: {
      get run(){ return new Corredor(null, null); },
      url: {
        getLocation: function(cb){
          setTimeout(function(){
            var p = {};
            P.forEach(function(v,k){ p[k] = v; });
            cb({ parameter:p, parameters:{}, hash:'' });
          }, 60);
        }
      },
      host: { close: function(){}, setHeight: function(){}, origin:'' }
    }
  };

  /* ─── painel de rede, só com ?dev=1 ─── */
  if (P.get('dev') === '1'){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9999;background:#1B1020;color:#fff;'+
      'font:12px/1.4 system-ui;padding:10px 12px;border-radius:10px;opacity:.94;max-width:190px';
    d.innerHTML = '<b>mock</b><br>' +
      '<label><input type="radio" name="rd" checked> boa (420ms)</label><br>' +
      '<label><input type="radio" name="rd"> 4G ruim (2.5s, 25% falha)</label><br>' +
      '<label><input type="radio" name="rd"> offline</label><br>' +
      '<span style="opacity:.6">PIN 1234</span>';
    document.body.appendChild(d);
    var rs = d.querySelectorAll('input');
    rs[0].onchange = function(){ CFG = {atraso:420, falha:0, offline:false}; };
    rs[1].onchange = function(){ CFG = {atraso:2500, falha:.25, offline:false}; };
    rs[2].onchange = function(){ CFG = {atraso:300, falha:0, offline:true}; };
  }
})();

</script>

<script>
/* Núcleo: estado, ícones, utilidades, ponte com o servidor, toast, folha e roteador. */
/* ══════════════════════════════════════════════════════════════
   Chamada — Instituto Veridiana
   Um arquivo. Sem dependencia. Sem build.
   ══════════════════════════════════════════════════════════════ */

var S = {
  turmaInicial:'', pilha:[], viaQr:false,
  turma:'', data:'', alunos:[], professores:[], professor:'', jaRegistrada:false,
  token:'', salvando:false,
  pin:'', gest:null, filtro:'ativos', busca:''

/* ─── utilidades ─── */
function el(id){ return document.getElementById(id); }

/* A coluna Comprovante é texto livre na planilha. Quem tem acesso de
   edição pode escrever javascript:... ali, e o link viraria execução de
   código ao ser tocado. Só http(s) passa. */
function urlSegura(u){
  return /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
}
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function iniciais(n){
  var p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0].charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}
var DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
             'agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return DIAS[d.getDay()] + ', ' + (+p[2]) + ' de ' + MESES[+p[1]-1];
}
function mesExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length < 2) return '';
  var m = MESES[+p[1] - 1] || '';
  return m.charAt(0).toUpperCase() + m.slice(1) + ' de ' + p[0];
}
function dataCurta(iso){
  var p = String(iso || '').split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : '';
}
/* Monta o link do WhatsApp. Número guardado só com dígitos; se vier sem
   o 55 do Brasil, entra na hora. */
function linkZap(tel, texto){
  var n = String(tel || '').replace(/[^0-9]/g, '');
  if (!n) return '';
  if (n.length <= 11) n = '55' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
}
function vibrar(){ try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){} }
function sorteioToken(){

}
function semAcento(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}
function plural(n, um, muitos){ return n + ' ' + (n === 1 ? um : muitos); }

/* ─── ponte com o Apps Script, com prazo ─── */
/* Sem prazo, um 4G que cai deixa o botao em "Salvando..." para sempre. */
function api(fn, args, ok, erro){
  /* Sem a ponte do Apps Script isto lançava ReferenceError dentro do
     depois() e a tela ficava no esqueleto para sempre, sem mensagem. */
  if (typeof google === 'undefined' || !google.script || !google.script.run){
    if (erro) erro({ message: 'A conexão com a planilha não abriu. Recarregue a página.' });
    return;
  }
  var fim = false;
  var t = setTimeout(function(){
    if (fim) return; fim = true;
    erro({ message:'A internet demorou demais para responder.' });
  }, 25000);
  function pronto(f){ return function(v){ if (fim) return; fim = true; clearTimeout(t); f(v); }; }
  var r = google.script.run
    .withSuccessHandler(pronto(ok))
    .withFailureHandler(pronto(erro || function(){}));
  r[fn].apply(r, args || []);
}

/* O Apps Script embrulha o erro e chega "Error: ...". Ninguem no
   instituto precisa ver isso. */
function textoErro(e){
  var m = (e && e.message) ? String(e.message) : '';
  m = m.replace(/^\s*(Error|Exception|ScriptError|GoogleJsonResponseException)\s*:\s*/i, '').trim();
  return m || 'Não deu certo. Tente de novo.';
}

/* ─── toast ─── */
var toastTimer;
function toast(texto, tipo, acao){
  var t = el('toast');
  el('toastIcone').innerHTML = ico(tipo === 'erro' ? 'alerta' : 'cheque');
  var alvo = el('toastTexto');
  alvo.textContent = texto;
  var velha = t.querySelector('.acao');
  if (velha) velha.remove();
  if (acao){
    var b = document.createElement('button');
    b.className = 'acao'; b.type = 'button'; b.textContent = acao.rotulo;
    b.addEventListener('click', function(){ fecharToast(); acao.fn(); });
    t.appendChild(b);
  }
  t.dataset.tipo = tipo || 'ok';
  t.dataset.aberto = 'true';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(fecharToast, acao ? 6000 : 3600);
}
function fecharToast(){ el('toast').dataset.aberto = 'false'; }

/* ─── bottom sheet reaproveitavel ─── */
var folhaAoFechar = null;
function abrirFolha(titulo, corpoHtml, aoFechar){
  /* Zera os handlers da folha anterior. pedirTexto e pedirFicha armam
     onkeydown; quem não rearma herdava o closure velho e o Enter
     explodia num campo que não existe mais. */
  el('folhaCorpo').onclick = null;
  el('folhaCorpo').onkeydown = null;
  el('folha').hidden = false;
  el('folhaTitulo').textContent = titulo;
  el('folhaCorpo').innerHTML = corpoHtml;
  el('folha').dataset.aberto = 'true';
  el('veu').dataset.aberto = 'true';
  folhaAoFechar = aoFechar || null;
}
function fecharFolha(){
  el('folha').dataset.aberto = 'false';
  el('veu').dataset.aberto = 'false';
  el('folha').style.transform = '';
  /* Fechada só por transform, a folha continuava alcançável por Tab e
     lida pelo leitor de tela — que ficava preso num diálogo que o
     usuário acha que fechou. */
  setTimeout(function(){
    if (el('folha').dataset.aberto !== 'true'){
      el('folhaCorpo').innerHTML = '';
      el('folhaCorpo').onclick = null;
      el('folhaCorpo').onkeydown = null;
      el('folha').hidden = true;
    }
  }, 320);
  var f = folhaAoFechar; folhaAoFechar = null;
  if (f) f();
}
function folhaAberta(){ return el('folha').dataset.aberto === 'true'; }

/* opcoes: [{txt, sub, ini, icone, marcado, perigo, fn}] */
function folhaOpcoes(titulo, opcoes){
  var html = '<ul>';
  opcoes.forEach(function(o, i){
    html += '<li><button type="button" class="opc'+(o.perigo?' perigo':'')+'" data-op="'+i+'"'+
            (o.marcado !== undefined ? ' aria-selected="'+(o.marcado?'true':'false')+'"' : '')+'>';
    if (o.ini) html += '<span class="ini">'+esc(iniciais(o.ini))+'</span>';
    else if (o.icone) html += ico(o.icone);
    html += '<span>'+esc(o.txt)+(o.sub ? '<small>'+esc(o.sub)+'</small>' : '')+'</span>';
    if (o.marcado !== undefined) html += '<span class="cv">'+ico('cheque')+'</span>';
    html += '</button></li>';
  });
  abrirFolha(titulo, html + '</ul>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-op]');
    if (!b) return;
    var o = opcoes[+b.dataset.op];
    fecharFolha();
    if (o && o.fn) setTimeout(o.fn, 60);
  };
}

/* Folha com vários campos. campos = [{id, rotulo, valor, tipo, dica}] */
function pedirFicha(titulo, campos, rotuloBotao, fn){
  var h = '<div style="padding:0 8px">';
  campos.forEach(function(c){
    h += '<div class="campo"><label for="f_' + c.id + '">' + esc(c.rotulo) + '</label>' +
         '<input id="f_' + c.id + '" type="' + (c.tipo || 'text') + '" ' +
         'autocomplete="off" autocapitalize="' + (c.tipo === 'text' || !c.tipo ? 'words' : 'none') + '" ' +
         (c.dica ? 'placeholder="' + esc(c.dica) + '" ' : '') +
         'value="' + esc(c.valor || '') + '"></div>';
  });
  abrirFolha(titulo, h + '</div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var r = {};
    for (var i = 0; i < campos.length; i++){
      var c = campos[i], v = (el('f_' + c.id).value || '').trim();
      if (c.obrigatorio && v.length < 2){
        toast('Preencha ' + c.rotulo.toLowerCase() + '.', 'erro'); return;
      }
      r[c.id] = v;
    }
    fecharFolha(); setTimeout(function(){ fn(r); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('f_' + campos[0].id); if (i){ i.focus(); i.select(); } }, 320);
}

/* confirmacao de acao destrutiva */
function confirmar(titulo, texto, rotulo, fn){
  abrirFolha(titulo,
    '<p class="sub">'+esc(texto)+'</p>'+
    '<div class="acoes"><button type="button" class="cancelar" data-c="0">Cancelar</button>'+
    '<button type="button" class="confirmar" data-c="1">'+esc(rotulo)+'</button></div>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-c]');
    if (!b) return;
    var sim = b.dataset.c === '1';
    fecharFolha();
    if (sim) setTimeout(fn, 60);
  };
}

el('veu').addEventListener('click', fecharFolha);
document.addEventListener('keydown', function(e){

/* arrastar a folha para baixo para fechar */
(function(){
  var y0 = null, dy = 0, f = el('folha');
  function inicio(e){ if (!folhaAberta()) return; y0 = e.touches[0].clientY; dy = 0; f.classList.add('arrastando'); }
  function move(e){
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0){ f.style.transform = 'translateY('+dy+'px)'; }
  }
  function fim(){
    if (y0 === null) return;
    f.classList.remove('arrastando'); f.style.transform = '';
    if (dy > 90) fecharFolha();
    y0 = null;
  }
  ['puxador','folhaTitulo'].forEach(function(id){
    var n = el(id);
    n.addEventListener('touchstart', inicio, {passive:true});
    n.addEventListener('touchmove', move, {passive:true});
    n.addEventListener('touchend', fim);
    n.addEventListener('touchcancel', fim);
  });
})();

/* ─── roteador ─── */
var TELAS = {};
var ACOES = {};

function atual(){ return S.pilha[S.pilha.length-1]; }
function ir(t, p, raiz){ if (raiz) S.pilha = []; S.pilha.push({t:t, p:p||{}}); desenhar(); }
function trocar(t, p){ S.pilha[S.pilha.length-1] = {t:t, p:p||{}}; desenhar(); }
function voltar(){ if (S.pilha.length > 1){ S.pilha.pop(); desenhar(); } }

function desenhar(){
  var a = atual(), tela = TELAS[a.t](a.p);

  el('cabTitulo').textContent = tela.titulo || '';
  el('btVoltar').hidden = S.pilha.length < 2 && !tela.voltar;
  el('btVoltar').innerHTML = ico('esq', 24);
  el('btGestao').hidden = !tela.gestao;
  el('btGestao').innerHTML = ico('engrenagem', 22);
  el('cabPlacar').hidden = !tela.placar;

  document.body.classList.toggle('semcapa', !tela.capa);
  el('palco').innerHTML = (tela.capa || '') +
    (tela.solto ? tela.html : '<div class="corpo">' + tela.html + '</div>');

  var b = el('barra');
  if (tela.barra){ el('barraDentro').innerHTML = tela.barra; b.hidden = false; }
  else { b.hidden = true; }
  medirBarra();

  /* O toast vive fora do #palco e sobrevivia 6 s à navegação. "Desfazer"
     e "Tentar de novo" rodavam sobre uma tela que não existe mais. */
  fecharToast();
  window.scrollTo(0, 0);
  document.body.classList.remove('rolou');
  if (tela.depois) tela.depois();
}

function medirBarra(){
  var b = el('barra');
  document.documentElement.style.setProperty('--barra-h',
    b.hidden ? '0px' : b.offsetHeight + 'px');
}

el('btVoltar').addEventListener('click', voltar);

/* Escuta no documento, não no #palco: a barra de ação (#barra) e o
   cabeçalho ficam FORA do palco, e um listener só no palco deixava
   "Salvar chamada", "Criar turma", "Adicionar aluno" e "Adicionar
   professor" sem resposta nenhuma. */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]');
  if (!b) return;
  var f = ACOES[b.getAttribute('data-acao')];
  if (f) f(b, e);
});

/* li[role=button] não sintetiza clique no Enter/Espaço como <button>.
   Sem isto, marcar falta e abrir aluno são inalcançáveis por teclado. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var alvo = e.target;
  if (!alvo || !alvo.getAttribute || alvo.getAttribute('role') !== 'button') return;
  if (!alvo.hasAttribute('data-acao')) return;
  e.preventDefault();
  alvo.click();
});

window.addEventListener('scroll', function(){
  document.body.classList.toggle('rolou', window.scrollY > 32);
}, {passive:true});

/* realce de toque: sem isso a lista parece morta no Android */
(function(){
  var no = null, y0 = 0;
  function limpa(){ if (no){ no.classList.remove('tocado'); no = null; } }
  document.addEventListener('touchstart', function(e){
    var n = e.target.closest('.li[data-acao]');
    if (n){ no = n; y0 = e.touches[0].clientY; n.classList.add('tocado'); }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (no && Math.abs(e.touches[0].clientY - y0) > 10) limpa();
  }, {passive:true});
  document.addEventListener('touchend', limpa);
  document.addEventListener('touchcancel', limpa);
})();

function esqueleto(n){

         '<div class="osso t" style="max-width:' + (48 + (i*17) % 38) + '%"></div>' +
         '<div class="osso s"></div></li>';
  }
  return h + '</ul>';
}
function estado(icone, titulo, texto, botao){

         (botao ? '<button type="button" class="botao" data-acao="' + botao.acao + '">' +
                  esc(botao.txt) + '</button>' : '') + '</div>';
}

          return;
        }
        var h = '<ul class="cartoes">';
        turmas.forEach(function(t){
          h += '<li><button type="button" class="item" data-acao="abrirTurma" data-t="' + esc(t) + '">' +
               '<span class="txt">' + esc(t) + '</span>' +
               '<span class="seta">' + ico('dir') + '</span></button></li>';
        });
        el('palco').querySelector('.corpo').innerHTML = h + '</ul>';
      }, function(e){
        el('palco').querySelector('.corpo').innerHTML =
          estado('alerta','Não deu para carregar', textoErro(e));
      });
    }
  };
};
ACOES.abrirTurma = function(b){ ir('chamada', {turma:b.getAttribute('data-t')}); };

/* ══════════════ TELA: chamada ══════════════ */
TELAS.chamada = function(p){
  var t = {
    titulo: p.turma, placar:true,
    capa:'<div class="capa"><div class="topo">' +
         '<div style="flex:1;min-width:0"><h1>' + esc(p.turma) + '</h1>' +
         '<p class="data" id="capaData">carregando…</p></div>' +
         '<div class="conta"><b id="capaN">—</b><span id="capaR">&nbsp;</span></div>' +
         '</div></div>',
    html: esqueleto(6),
    voltar: !S.viaQr,
    depois: function(){
      api('carregarTurma', [p.turma], montarChamada, function(e){
        el('palco').querySelector('.corpo').innerHTML =
          estado('alerta','Não deu para carregar', textoErro(e));
      });
    }
  };
  return t;
};

function montarChamada(d){
  /* Se o professor voltou ou trocou de turma enquanto a resposta vinha,
     esta resposta é de outra tela: pintá-la deixaria a lista da turma A
     sob o cabeçalho da turma B — e "Salvar" gravaria a errada. */
  var atu = atual();
  if (!atu || atu.t !== 'chamada' || atu.p.turma !== d.turma) return;

  S.turma = d.turma; S.data = d.data;
  S.professores = d.professores || [];
  S.professor = d.professorSugerido || '';
  S.jaRegistrada = !!d.jaRegistrada; S.forcar = false;
  S.token = sorteioToken();
  S.alunos = (d.alunos || []).map(function(n){ return {aluno:n, status:'Presente'}; });

  el('capaData').textContent = dataExtenso(d.data);

  if (!S.alunos.length){
    el('palco').querySelector('.corpo').innerHTML =
      estado('grupo','Turma sem alunos',
             'Ninguém ativo em ' + d.turma + '. Toque na engrenagem na tela inicial para cadastrar.');
    el('capaN').textContent = '0'; el('capaR').textContent = 'sem alunos';
    return;
  }

  var h = '';
  /* Zero toque a mais: só uma linha que o professor vê antes de começar. */
  if (d.aniversarios && d.aniversarios.length){
    h += '<div class="bolo">' + ico('bolo', 22) + '<div><b>Aniversário hoje</b>';
    d.aniversarios.forEach(function(x){
      h += '<span>' + esc(x.aluno) + ' está fazendo ' + x.faz + ' anos</span>';
    });
    h += '</div></div>';
  }
  if (S.jaRegistrada){
    h += '<div class="aviso">' + ico('alerta', 18) +
         '<span>Esta turma já teve chamada salva hoje. Se salvar de novo, vai contar duas vezes.</span></div>';
  }
  h += '<button type="button" class="prof" id="cartaoProf" data-acao="escolherProf" data-vazio="' +
       (S.professor ? 'false' : 'true') + '">' + ico('pessoa', 22) +
       '<span class="txt"><small>Quem está dando a aula</small>' +
       '<b id="profNome">' + esc(S.professor || 'Escolher') + '</b></span>' +
       '<span class="seta">' + ico('dir') + '</span></button>';
  h += '<div class="instrucao"><span>Toque em quem faltou</span>' +
       '<button type="button" id="btTodos" data-acao="todosPresentes" hidden>Todos presentes</button></div>';
  h += '<ul class="lista">';
  S.alunos.forEach(function(a, i){
    h += '<li class="li" data-st="Presente" id="li' + i + '" data-acao="ciclar" data-i="' + i + '"' +
         ' role="button" tabindex="0" aria-label="' + esc(a.aluno) + ', presente">' +
         '<span class="ini">' + esc(iniciais(a.aluno)) + '</span>' +
         '<span class="nome">' + esc(a.aluno) + '</span>' +
         '<span class="marca" id="mk' + i + '"></span></li>';
  });
  el('palco').querySelector('.corpo').innerHTML = h + '</ul>';

  S.alunos.forEach(function(a, i){ pintar(i); });
  atualizarPlacar();

  el('barraDentro').innerHTML =
    '<button type="button" class="salvar" id="btSalvar" data-acao="salvar">Salvar chamada</button>';
  el('barra').hidden = false;
  medirBarra();

  /* Sem sugestao de professor a folha abre sozinha: e a primeira pergunta
     da aula, e assim o fluxo inteiro fecha em cinco toques. */
  if (!S.professor && S.professores.length) setTimeout(escolherProf, 340);
}

function naChamada(){
  var a = atual();
  return !!a && a.t === 'chamada' && !!el('li0');
}

function pintar(i){
  var st = S.alunos[i].status, li = el('li' + i);
  li.dataset.st = st;
  li.setAttribute('aria-label', S.alunos[i].aluno + ', ' +
    (st === 'Presente' ? 'presente' : st === 'Falta' ? 'faltou' : 'falta justificada'));
  el('mk' + i).innerHTML = st === 'Presente'
    ? '<span class="ok">' + ico('cheque', 16) + '</span>'
    : '<span class="selo">' + (st === 'Falta' ? 'Faltou' : 'Justificada') + '</span>';
}

ACOES.ciclar = function(b){
  var i = +b.getAttribute('data-i');
  S.alunos[i].status = CICLO[S.alunos[i].status];
  pintar(i); atualizarPlacar(); vibrar();
};

ACOES.todosPresentes = function(){
  var antes = S.alunos.map(function(a){ return a.status; });
  var mudou = false;
  S.alunos.forEach(function(a, i){ if (a.status !== 'Presente'){ a.status = 'Presente'; pintar(i); mudou = true; } });
  if (!mudou) return;
  atualizarPlacar(); vibrar();
  toast('Todos marcados como presentes', 'ok', {rotulo:'Desfazer', fn:function(){
    if (!naChamada()) return;
    S.alunos.forEach(function(a, i){ a.status = antes[i]; pintar(i); });
    atualizarPlacar(); vibrar();
  }});
};

function atualizarPlacar(){
  var p = S.alunos.filter(function(a){ return a.status === 'Presente'; }).length;
  var n = S.alunos.length, f = n - p;
  el('capaN').textContent = p + '/' + n;
  el('capaR').textContent = f === 0 ? 'turma completa' : plural(f, 'faltou', 'faltaram');
  el('cabPlacar').textContent = p + '/' + n;
  var bt = el('btTodos');
  if (bt) bt.hidden = (f === 0);   /* nada a desfazer enquanto todos estao presentes */
  el('cabPlacar').setAttribute('aria-label', p + ' de ' + n + ' presentes');
}

function escolherProf(){
  if (!S.professores.length){
    toast('Nenhum professor cadastrado. Use a engrenagem na tela inicial.', 'erro');
    return;
  }
  folhaOpcoes('Quem está dando a aula', S.professores.map(function(nome){
    return { txt:nome, ini:nome, marcado:(nome === S.professor), fn:function(){
      S.professor = nome;
      el('profNome').textContent = nome;
      el('cartaoProf').dataset.vazio = 'false';
      vibrar();
    }};
  }));
}
ACOES.escolherProf = escolherProf;

/* ─── salvar ─── */
ACOES.salvar = function(){
  if (!S.professor){ toast('Escolha quem está dando a aula', 'erro'); escolherProf(); return; }
  if (S.jaRegistrada && !S.forcar){
    confirmar('Salvar de novo?',
      'Esta turma já teve chamada salva hoje. Salvar de novo cria um segundo registro e conta em dobro nos relatórios.',
      'Salvar assim mesmo', function(){ S.forcar = true; ACOES.salvar(); });
    return;
  }
  if (navigator.onLine === false){
    toast('Sem internet agora. Suas marcações continuam aqui.', 'erro',
          {rotulo:'Tentar', fn:enviarChamada});
    return;
  }
  enviarChamada();
};

function enviarChamada(){
  if (S.salvando) return;
  if (!naChamada()) return;
  S.salvando = true;
  var b = el('btSalvar');
  if (b){ b.disabled = true; b.textContent = 'Salvando…'; }
  api('salvarChamada',
    [{turma:S.turma, professor:S.professor, token:S.token,
      presencas:S.alunos, forcar: !!S.forcar}],
    function(r){ S.salvando = false; vibrar(); ir('fim', {r:r}, true); },
    function(e){
      /* Nada de re-render aqui: as marcacoes do professor continuam na tela. */
      S.salvando = false;
      var bb = el('btSalvar');
      if (bb){ bb.disabled = false; bb.textContent = 'Salvar chamada'; }
      /* Se o servidor recusou por duplicidade, oferecer "tentar de novo"
         seria empurrar o professor para o erro que acabamos de evitar. */
      var msg = textoErro(e);
      if (msg.indexOf('DUPLICADA') === 0){
        S.jaRegistrada = true;
        toast('Esta turma já tem chamada salva hoje.', 'erro');
        return;
      }
      toast('Não salvou. Confira a internet e tente de novo.', 'erro',
            {rotulo:'Tentar de novo', fn:enviarChamada});
    });
}

/* ══════════════ TELA: chamada salva ══════════════ */
TELAS.fim = function(p){
  var r = p.r || {};
  var resumo = r.faltas
    ? plural(r.presentes, 'presente', 'presentes') + ' · ' + plural(r.faltas, 'faltou', 'faltaram')
    : 'Turma completa, ' + plural(r.total, 'aluno presente', 'alunos presentes');
  return {
    titulo:'', solto:true,
    html:'<div class="fim"><div class="selo-ok">' +
      '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>' +
      '</div><h2>Chamada salva</h2><p>' + esc(r.turma || S.turma) + '<br>' + esc(resumo) + '</p>' +
      '<button type="button" class="botao" data-acao="outraChamada">Fazer outra chamada</button></div>'
  };
};
ACOES.outraChamada = function(){
  if (S.viaQr) ir('chamada', {turma:S.turma}, true);
  else ir('turmas', {}, true);
};
</script>

<script>
/* Área da equipe: PIN, cadastros, QR, histórico e planilha. */
/* ══════════════ TELA: PIN ══════════════ */
var pinBuf = '';
TELAS.pin = function(){
  pinBuf = '';
  var teclas = '';
  for (var i = 1; i <= 9; i++)
    teclas += '<button type="button" data-acao="pinDig" data-d="' + i + '">' + i + '</button>';
  teclas += '<span class="vazia"></span>' +
            '<button type="button" data-acao="pinDig" data-d="0">0</button>' +
            '<button type="button" class="apagar" data-acao="pinApaga" aria-label="Apagar">' +
            ico('apagarTecla', 24) + '</button>';
  return {
    titulo:'Gestão', solto:true,
    html:'<div class="pin"><div class="circulo" style="width:64px;height:64px;border-radius:50%;' +
      'margin:0 auto 16px;display:grid;place-items:center;background:var(--roxo-fraco);color:var(--roxo)">' +
      ico('cadeado', 26) + '</div>' +
      '<h2>Área da equipe</h2>' +
      '<p>Digite o código de 4 números para cuidar de turmas, alunos e professores.</p>' +
      '<div class="pontos" id="pontos" role="status" aria-label="Código, 0 de 4 números">' +
      '<i></i><i></i><i></i><i></i></div>' +
      '<div class="teclado">' + teclas + '</div></div>'
  };
};
function pontos(){
  var ns = el('pontos');
  if (!ns) return;
  for (var i = 0; i < 4; i++) ns.children[i].classList.toggle('cheio', i < pinBuf.length);
  ns.setAttribute('aria-label', 'Código, ' + pinBuf.length + ' de 4 números');
}
ACOES.pinDig = function(b){
  if (pinBuf.length >= 4) return;
  pinBuf += b.getAttribute('data-d'); vibrar(); pontos();
  if (pinBuf.length === 4) setTimeout(validaPin, 120);
};
ACOES.pinApaga = function(){ pinBuf = pinBuf.slice(0, -1); vibrar(); pontos(); };
function validaPin(){
  var tentativa = pinBuf;
  api('entrarNaGestao', [tentativa], function(g){
    S.pin = tentativa; S.gest = g; trocar('gestao');
  }, function(e){
    var n = el('pontos');
    if (n){ n.classList.add('errou'); setTimeout(function(){ n.classList.remove('errou'); }, 360); }
    pinBuf = ''; pontos();
    toast(textoErro(e), 'erro');
  });
}
document.addEventListener('keydown', function(e){
  var a = atual();
  if (!a || a.t !== 'pin' || folhaAberta()) return;
  if (/^[0-9]$/.test(e.key)){ ACOES.pinDig({getAttribute:function(){ return e.key; }}); }
  else if (e.key === 'Backspace'){ ACOES.pinApaga(); }
});

/* ══════════════ TELA: menu de gestão ══════════════ */
TELAS.gestao = function(){
  var g = S.gest || {};
  var itens = [
    {ic:'prancheta', t:'Turmas', s:plural(g.turmas || 0, 'turma ativa', 'turmas ativas'), a:'gTurmas'},
    {ic:'grupo', t:'Alunos', s:(g.alunosAtivos || 0) + ' ativos, ' + (g.alunosInativos || 0) + ' inativos', a:'gAlunos'},
    {ic:'pessoa', t:'Professores', s:plural(g.professores || 0, 'na equipe', 'na equipe'), a:'gProfs'},
    {ic:'qr', t:'QR das turmas', s:'gerar código para imprimir', a:'gQr'},
    {ic:'sino', t:'Precisam de atenção', s:'carregando…', a:'gRisco', id:'itRisco'},
    {ic:'calendario', t:'Histórico', s:'quem veio, por dia e por mês', a:'gHistorico'},
    {ic:'carteira', t:'Caixa', s:'entradas, saídas e comprovantes', a:'gCaixa'},
    {ic:'medalha', t:'Certificados', s:'comprovante de horas para as alunas', a:'gCert'},
    {ic:'documento', t:'Relatório para edital', s:'beneficiários, aulas e frequência', a:'gRelatorio'},
    {ic:'tabela', t:'Planilha', s:'abrir e compartilhar a planilha', a:'gPlanilha'}
  ];
  var h = '<ul class="cartoes">';
  itens.forEach(function(i){
    h += '<li><button type="button" class="item" data-acao="' + i.a + '">' + ico(i.ic, 22) +
         '<span class="txt">' + esc(i.t) + '<small>' + esc(i.s) + '</small></span>' +
         '<span class="seta">' + ico('dir') + '</span></button></li>';
  });
  return {
    titulo:'Gestão',
    html:'<div id="caixaBolo"></div>' + h + '</ul>',
    depois:function(){
      /* Fora do carregamento do menu: ler Chamadas para o alerta custa
         caro e não pode segurar a tela. */
      api('contarRisco', [S.pin], function(n){
        var i = el('itRisco');
        if (!i) return;
        i.querySelector('small').textContent = n === 0
          ? 'ninguém faltando seguido, ótimo'
          : plural(n, 'aluno some há 3 aulas', 'alunos somem há 3 aulas');
        if (n > 0) i.querySelector('small').style.color = 'var(--falta)';
      }, function(){});
      api('aniversariantesSemana', [S.pin], function(lista){
        if (!lista || !lista.length) return;
        var c = el('caixaBolo');
        if (!c) return;
        var h2 = '<div class="bolo">' + ico('bolo', 22) + '<div><b>' +
          (lista.length === 1 ? 'Aniversário esta semana' : lista.length + ' aniversários esta semana') +
          '</b>';
        lista.forEach(function(a){
          h2 += '<span>' + esc(a.aluno) + ' faz ' + a.faz + ' em ' + dataCurta(a.dia) + '</span>';
        });
        c.innerHTML = h2 + '</div></div>';
      }, function(){});
    }
  };
};
ACOES.gTurmas = function(){ ir('gTurmas'); };
ACOES.gAlunos = function(){ S.busca = ''; S.filtro = 'ativos'; ir('gAlunos'); };
ACOES.gProfs  = function(){ ir('gProfs'); };
ACOES.gQr     = function(){ ir('gQr'); };
ACOES.gHistorico = function(){ ir('gHistorico'); };
ACOES.gPlanilha  = function(){ ir('gPlanilha'); };
ACOES.gRisco     = function(){ ir('gRisco'); };
ACOES.gRelatorio = function(){ ir('gRelatorio'); };
ACOES.gCert      = function(){ ir('gCert'); };
ACOES.gCaixa     = function(){ ir('gCaixa'); };

/* recarrega os contadores depois de qualquer escrita */
function recontar(){
  api('entrarNaGestao', [S.pin], function(g){ S.gest = g; }, function(){});
}

/* ─── escrita na gestão: toast vermelho no erro, tela intacta ─── */
function escrever(fn, args, msgOk, depois){
  api(fn, [S.pin].concat(args), function(r){
    vibrar(); toast(msgOk);
    recontar();
    if (depois) depois(r);
  }, function(e){
    toast(textoErro(e), 'erro');
  });
}

/* pedir um nome sem usar prompt() */
function pedirTexto(titulo, rotulo, valor, rotuloBotao, fn){
  abrirFolha(titulo,
    '<div style="padding:0 8px"><div class="campo"><label for="campoTxt">' + esc(rotulo) + '</label>' +
    '<input id="campoTxt" type="text" autocomplete="off" autocapitalize="words" ' +
    'spellcheck="false" value="' + esc(valor || '') + '"></div></div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var v = (el('campoTxt').value || '').trim();
    if (v.length < 2){ toast('Escreva pelo menos 2 letras.', 'erro'); return; }
    fecharFolha(); setTimeout(function(){ fn(v); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('campoTxt'); if (i){ i.focus(); i.select(); } }, 320);
}

/* ══════════════ GESTÃO: turmas ══════════════ */
TELAS.gTurmas = function(){
  return {
    titulo:'Turmas', html:esqueleto(4),
    barra:'<button type="button" class="salvar" data-acao="novaTurma">' + ico('mais') + 'Criar turma</button>',

};
function listarTurmasGestao(){
  api('listarTurmasCompleto', [S.pin], function(ts){
    var alvo = el('palco').querySelector('.corpo');

      alvo.innerHTML = estado('prancheta','Nenhuma turma ainda',

      h += '<li><button type="button" class="item" data-acao="abrirFicha" data-t="' + esc(t.nome) + '">' +
           '<span class="txt">' + esc(t.nome) + '<small>' + plural(t.ativos, 'aluno', 'alunos') +
           (t.inativos ? ' · ' + t.inativos + ' inativo' + (t.inativos > 1 ? 's' : '') : '') +
           '</small></span><span class="seta">' + ico('dir') + '</span></button></li>';
    });
    alvo.innerHTML = h + '</ul>';
  }, function(e){
    el('palco').querySelector('.corpo').innerHTML = estado('alerta','Não deu para carregar', textoErro(e));
  });
}
ACOES.novaTurma = function(){

  });

/* ══════════════ GESTÃO: ficha da turma ══════════════ */
TELAS.gTurma = function(p){
  return {
    titulo:p.turma, html:esqueleto(4),
    barra:'<button type="button" class="salvar" data-acao="novoAluno" data-t="' + esc(p.turma) + '">' +
          ico('mais') + 'Adicionar aluno</button>',
    depois:function(){ carregarFicha(p.turma); }
  };
};
function carregarFicha(turma){
  api('listarAlunos', [S.pin, turma, true], function(as){
    S.todosAlunos = as;
    var ativos = as.filter(function(a){ return a.ativo; });
    var inativos = as.filter(function(a){ return !a.ativo; });
    var h = '<div class="duplo" style="margin-bottom:20px">' +
      '<button type="button" class="secundario" data-acao="renomearTurma" data-t="' + esc(turma) + '">' +
      ico('renomear', 18) + ' Renomear</button>' +
      '<button type="button" class="secundario" data-acao="arquivarTurma" data-t="' + esc(turma) +
      '" data-n="' + ativos.length + '">' + ico('arquivar', 18) + ' Arquivar</button></div>';

    if (!ativos.length){
      h += estado('grupo','Turma sem alunos','Toque em "Adicionar aluno" aqui embaixo.');
    } else {
      h += '<div class="secao">' + plural(ativos.length, 'aluno', 'alunos') + '</div>';
      h += linhasAlunos(ativos, false);
    }
    if (inativos.length){
      h += '<button type="button" class="recolhe" data-acao="verInativos" aria-expanded="false">' +
           '<span class="seta">' + ico('dir', 18) + '</span>' +
           plural(inativos.length, 'aluno inativo', 'alunos inativos') + '</button>' +
           '<div id="caixaInativos" hidden>' + linhasAlunos(inativos, true) + '</div>';
    }
    el('palco').querySelector('.corpo').innerHTML = h;
  }, function(e){
    el('palco').querySelector('.corpo').innerHTML = estado('alerta','Não deu para carregar', textoErro(e));
  });
}
function linhasAlunos(lista, inativo){
  var h = '<ul class="lista">';
  lista.forEach(function(a){

ACOES.partilhar = function(b){
  var url = b.getAttribute('data-u'), t = b.getAttribute('data-t');
  try {
    navigator.share({ title:'Chamada · ' + t, text:'Chamada da turma ' + t, url:url })
      .catch(function(){ /* cancelou ou o iframe bloqueou: silencio */ });
  } catch(e){ copiar(url); }
};
ACOES.copiarLink = function(b){ copiar(b.getAttribute('data-u')); };
function copiar(txt){
  function ok(){ vibrar(); toast('Link copiado'); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, function(){ copiaAntiga(txt, ok); });
  } else copiaAntiga(txt, ok);
}
function copiaAntiga(txt, ok){
  var a = document.createElement('textarea');
  a.value = txt; a.setAttribute('readonly','');
  a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(a); a.focus(); a.select();
  var deu = false;
  try { deu = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(a);
  if (deu) ok(); else toast('Não deu para copiar sozinho. Segure o dedo no link.', 'erro');
}

            ' aulas de ' + a.turma + '. Está tudo bem? A gente gostaria muito de ver de volta.';
          var zap = linkZap(a.telefone, texto);
          h += '<div class="risco">' +
            '<div class="cab-risco"><span class="ini">' + esc(iniciais(a.aluno)) + '</span>' +

            '<p class="detalhe">' + plural(a.faltas, 'falta seguida', 'faltas seguidas') +
            (a.justificadas ? ' (' + a.justificadas + ' justificada' + (a.justificadas > 1 ? 's' : '') + ')' : '') +
            (a.ultimaPresenca ? ' · veio pela última vez em ' + dataCurta(a.ultimaPresenca) : ' · sem presença nas aulas recentes') +
            '</p>';

            h += '<a class="botao-zap" href="' + esc(zap) + '" target="_blank" rel="noopener">' +
                 ico('conversa', 18) + ' ' + esc(rotuloZap(a.responsavel)) + '</a>';

/* "Falar com Ana" quando há nome; senão não inventa parentesco. */

       relatório errado em silêncio é pior que erro na cara. */
    if (r.completo === false){
      h += '<div class="aviso">' + ico('alerta', 18) +
           '<span>O histórico é grande demais e a leitura parou antes do fim. ' +
           'Estes números estão <b>por baixo</b>. Gere por períodos menores, ' +
           'um semestre de cada vez.</span></div>';
    }
    h += '<div><b>' + r.beneficiarios + '</b><span>beneficiários</span></div>';
    h += '<div><b>' + r.aulas + '</b><span>aulas</span></div>';
    h += '<div><b>' + r.frequencia + '%</b><span>frequência</span></div>';

    Object.keys(r.faixas).forEach(function(k){

    h += '</ul>';

      h += '<div class="secao">Por turma</div><ul class="lista sem-avatar">';
      r.turmas.forEach(function(t){
        h += '<li class="li"><span class="nome">' + esc(t.turma) +
             '<small>' + plural(t.aulas,'aula','aulas') + ' · ' +
             plural(t.alunos,'aluno','alunos') + '</small></span>' +
             '<span class="pct">' + t.pct + '%</span></li>';
      });

         ico('copiar', 18) + ' Copiar para colar no edital</button>';

ACOES.copiarRel = function(){
  var r = S.rel;
  if (!r) return;
  var L = [];
  L.push('INSTITUTO VERIDIANA — Relatório de frequência');
  L.push('Período: ' + dataCurta(r.inicio) + '/' + r.inicio.slice(0,4) +
         ' a ' + dataCurta(r.fim) + '/' + r.fim.slice(0,4));
  L.push('');
  L.push('Beneficiários atendidos: ' + r.beneficiarios);
  L.push('Aulas realizadas: ' + r.aulas);
  L.push('Frequência média: ' + r.frequencia + '%');
  L.push('');
  L.push('Faixa etária:');
  Object.keys(r.faixas).forEach(function(k){
    if (r.faixas[k]) L.push('- ' + k + ': ' + r.faixas[k]);

  L.push('');
  L.push('Por turma:');

           ' alunos, ' + t.pct + '% de frequência');

             '<small>' + plural(x.aulas, 'aula', 'aulas') + ' · ' +
             x.presentes + ' de ' + x.total + ' presenças</small></span>' +
             '<span class="pct">' + x.pct + '%</span></li>';

    if (r.aulas.length){
      h += '<div class="secao">Aulas do mês</div>';
      var diaAtual = '';

        if (a.data !== diaAtual){
          if (diaAtual) h += '</ul>';
          diaAtual = a.data;
          h += '<div class="dia">' + esc(dataExtenso(a.data)) + '</div><ul class="lista sem-avatar">';
        }
        h += '<li class="li"><span class="nome">' + esc(a.turma) +
             '<small>' + esc(a.professor || 'sem professor') + '</small></span>' +
             '<span class="pct' + (a.presentes === a.total ? ' cheio' : '') + '">' +
             a.presentes + '/' + a.total + '</span></li>';
      });

    }

    alvo.innerHTML = passoMes(mes) + estado('alerta','Não deu para carregar', textoErro(e));

function passoMes(mes){

<script>
/* Fluxo de caixa: lançar em 4 toques, do celular, entre uma aula e outra. */

function reais(v){
  var n = Number(v || 0);
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* Reduz a foto ANTES de subir. Nota fiscal de 4 MB em 4G instável não
   chega — e o comprovante é justamente o que não pode faltar. */
function reduzirFoto(file, cb){
  if (!file){ cb(''); return; }
  var r = new FileReader();
  r.onerror = function(){ cb(''); };
  r.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(''); };
    img.onload = function(){
      var max = 1400;
      var e = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * e);
      c.height = Math.round(img.height * e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.75)); } catch(err){ cb(''); }
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ══════════════ CAIXA: o mês ══════════════ */
TELAS.gCaixa = function(){
  return {
    titulo:'Caixa', html:esqueleto(4),
    barra:'<div class="duplo">' +
      '<button type="button" class="bt-entrada" data-acao="lancar" data-tipo="Entrada">' +
      ico('mais', 18) + ' Entrou</button>' +
      '<button type="button" class="bt-saida" data-acao="lancar" data-tipo="Saída">' +
      ico('menos', 18) + ' Saiu</button></div>',
    depois:function(){
      api('mesesCaixa', [S.pin], function(ms){
        S.mesesCx = ms; S.mesCxIdx = 0;
        carregarCaixa();
      }, function(e){
        el('palco').querySelector('.corpo').innerHTML = estado('alerta','Não deu para carregar', textoErro(e));
      });
    }
  };
};

function noCaixa(){ var a = atual(); return !!a && a.t === 'gCaixa'; }

function carregarCaixa(){
  if (!noCaixa()) return;
  var mes = S.mesesCx[S.mesCxIdx];
  var alvo = el('palco').querySelector('.corpo');
  if (!alvo) return;
  alvo.innerHTML = passoCaixa(mes) + esqueleto(3);
  api('listarCaixa', [S.pin, mes], function(r){
    if (!noCaixa() || !el('palco').querySelector('.corpo')) return;
    S.caixa = r;
    var h = passoCaixa(mes);

    h += '<div class="saldo"><span>em caixa</span><b>' + reais(r.acumulado) + '</b>' +
         '<div class="saldo-linha">' +
           '<div class="ent">' + reais(r.entrou) + '<small>entrou no mês</small></div>' +
           '<div class="sai">' + reais(r.saiu) + '<small>saiu no mês</small></div>' +
         '</div></div>';

    if (!r.lancamentos.length){
      alvo.innerHTML = h + estado('carteira','Nada lançado neste mês',
        'Use os botões aqui embaixo assim que entrar ou sair dinheiro.');
      return;
    }

    h += '<div class="secao">' + plural(r.lancamentos.length, 'lançamento', 'lançamentos') + '</div>';
    var dia = '';
    r.lancamentos.forEach(function(l, i){
      if (l.data !== dia){
        if (dia) h += '</ul>';
        dia = l.data;
        h += '<div class="dia">' + esc(dataExtenso(l.data)) + '</div><ul class="lista sem-avatar">';
      }
      var entrada = l.tipo === 'Entrada';
      h += '<li class="li" data-acao="verLanc" data-i="' + i + '" role="button" tabindex="0">' +
           '<span class="nome">' + esc(l.categoria) +
             '<small>' + esc(l.descricao || l.fonte || (entrada ? 'entrada' : 'saída')) +
             (l.comprovante ? ' · com nota' : (entrada ? '' : ' · sem nota')) + '</small></span>' +
           '<span class="dinheiro ' + (entrada ? 'ent' : 'sai') + '">' +
             (entrada ? '+' : '−') + ' ' + reais(l.valor) + '</span></li>';
    });
    h += '</ul>';
    h += '<button type="button" class="botao-cheio" style="margin-top:20px;background:var(--fundo);' +
         'color:var(--roxo)" data-acao="gCaixaResumo">' + ico('documento', 18) +
         ' Resumo para prestação de contas</button>';
    alvo.innerHTML = h;
  }, function(e){
    if (!noCaixa() || !el('palco').querySelector('.corpo')) return;
    el('palco').querySelector('.corpo').innerHTML =
      passoCaixa(mes) + estado('alerta','Não deu para carregar', textoErro(e));
  });
}

function passoCaixa(mes){
  var antes = S.mesCxIdx < S.mesesCx.length - 1, depois = S.mesCxIdx > 0;
  return '<div class="passo">' +
    '<button type="button" data-acao="cxAntes" aria-label="Mês anterior"' + (antes?'':' disabled') + '>' +

    '<button type="button" data-acao="cxDepois" aria-label="Próximo mês"' + (depois?'':' disabled') + '>' +
      ico('dir', 22) + '</button></div>';
}
ACOES.cxAntes  = function(){ if (S.mesCxIdx < S.mesesCx.length - 1){ S.mesCxIdx++; vibrar(); carregarCaixa(); } };
ACOES.cxDepois = function(){ if (S.mesCxIdx > 0){ S.mesCxIdx--; vibrar(); carregarCaixa(); } };
