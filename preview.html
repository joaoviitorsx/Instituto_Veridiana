</style>
<script>
/* Agenda anual. Não substitui o calendário de papel da coordenação:
   alimenta ele. O fim da linha é o PDF para imprimir. */

var MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var DIA_CURTO = ['dom','seg','ter','qua','qui','sex','sáb'];

function corTipo(t){
  var c = S.agCores || {};
  return c[t] || c.Outro || '#6B5E78';
}
function tagTipo(t){
  return '<span class="tag" style="--c:' + esc(corTipo(t)) + '">' + esc(t) + '</span>';
}
function somarMes(mes, n){
  var a = +mes.slice(0,4), m = +mes.slice(5,7) - 1 + n;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + '-' + String(m + 1).padStart(2,'0');
}
function diaSemanaIso(iso){
  var p = iso.split('-');
  return DIA_CURTO[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function textoTurmas(ts){
  return !ts || !ts.length ? 'Todas as turmas' : ts.join(', ');
}
/* Garante tipos, cores e turmas antes de montar formulário. */
function comListas(fn){
  if (S.agListas){ fn(); return; }
  var h = hojeISO();
  ler('listarAgenda', [+h.slice(0,4), +h.slice(5,7)], function(r){ S.agListas = r; S.agCores = r.cores; fn(); },
      function(e){ toast(textoErro(e), 'erro'); }, {fresco:300000});
}

/* ══════════════ AGENDA: mês ══════════════ */
TELAS.agenda = function(p){
  if (!p.mes) p.mes = hojeISO().slice(0,7);
  var mes = p.mes;
  return {
    titulo:'Agenda',
    html:'<div class="passo">' +
        '<button type="button" data-acao="agMes" data-n="-1" aria-label="Mês anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + esc(mesExtenso(mes)) + '</b>' +
        '<button type="button" data-acao="agMes" data-n="1" aria-label="Próximo mês">' + ico('dir', 22) + '</button></div>' +
      '<div class="atalhos">' +
        '<button type="button" data-acao="agAno">' + ico('tabela', 18) + ' Ver o ano</button>' +
        '<button type="button" data-acao="agImprimir">' + ico('impressora', 18) + ' Imprimir</button></div>' +
      '<div id="agLista">' + esqueleto(3) + '</div>',
    barra:'<button type="button" class="salvar" data-acao="agNovo">' + ico('mais') + 'Novo evento</button>',
    depois:function(){ carregarAgMes(mes); }
  };
};

function carregarAgMes(mes){
  ler('listarAgenda', [+mes.slice(0,4), +mes.slice(5,7)], function(r){
    var a = atual();
    if (!a || a.t !== 'agenda' || a.p.mes !== mes || !el('agLista')) return;
    S.agListas = r; S.agCores = r.cores; S.agEventos = r.eventos;
    /* Quem olha um mês costuma passar para o lado: os vizinhos já vêm. */
    [-1, 1].forEach(function(n){
      var v = somarMes(mes, n);
      preler('listarAgenda', [+v.slice(0,4), +v.slice(5,7)]);
    });
    if (!r.eventos.length){
      el('agLista').innerHTML = estado('calendario', 'Nada marcado em ' + MESES[+mes.slice(5,7) - 1],
        'Toque em "Novo evento" aqui embaixo para colocar a primeira data do mês.');
      return;
    }
    var h = '<ul class="eventos">';
    r.eventos.forEach(function(ev, i){
      var passou = ev.dataFim ? ev.dataFim < r.hoje : ev.data < r.hoje;
      var comecaAntes = ev.data.slice(0,7) < mes;
      var linha = [];
      if (ev.dataFim) linha.push('de ' + dataCurta(ev.data) + ' a ' + dataCurta(ev.dataFim));
      linha.push(textoTurmas(ev.turmas));
      if (ev.local) linha.push(ev.local);
      if (ev.status !== 'Planejado') linha.push(ev.status);
      h += '<li><button type="button" class="ev' + (passou ? ' passado' : '') +
           (ev.status === 'Cancelado' ? ' cancelado' : '') + '" data-acao="agVer" data-i="' + i + '">' +
           '<span class="ev-dia"><b>' + (comecaAntes ? '…' : +ev.data.slice(8)) + '</b>' +
           '<small>' + (comecaAntes ? 'desde ' + dataCurta(ev.data) : diaSemanaIso(ev.data)) + '</small></span>' +
           '<span class="ev-txt">' + tagTipo(ev.tipo) + '<b>' + esc(ev.titulo) + '</b>' +
           '<small>' + esc(linha.join(' · ')) + '</small></span></button></li>';
    });
    el('agLista').innerHTML = h + '</ul>';
  }, function(e){
    if (el('agLista')) el('agLista').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
  });
}

ACOES.agMes = function(b){
  vibrar();
  trocar('agenda', {mes:somarMes(atual().p.mes, +b.getAttribute('data-n'))});
};
ACOES.agAno = function(){ ir('agAno', {ano:+atual().p.mes.slice(0,4)}); };
ACOES.agImprimir = function(){
  var a = atual();
  var ano = a.p.ano || +(a.p.mes || hojeISO()).slice(0,4);
  comPin('agImprimir', {ano:ano});
};
ACOES.agNovo = function(){
  var mes = atual().p.mes || hojeISO().slice(0,7);
  /* No mês de hoje, a data já vem hoje. Em outro mês, o dia 1 dele:
     quem navegou até abril quer marcar algo em abril. */
  comPin('agNovo', {data: mes === hojeISO().slice(0,7) ? hojeISO() : mes + '-01'});
};

/* ─── ver um evento ─── */
ACOES.agVer = function(b){
  var ev = (S.agEventos || [])[+b.getAttribute('data-i')];
  if (!ev) return;
  var quando = ev.dataFim
    ? 'De ' + dataExtenso(ev.data) + ' a ' + dataExtenso(ev.dataFim)
    : dataExtenso(ev.data);
  var h = '<div style="padding:0 8px 8px">' + tagTipo(ev.tipo) + '</div><ul class="detalhes">' +
    '<li>' + ico('calendario', 18) + '<span>' + esc(quando.charAt(0).toUpperCase() + quando.slice(1)) + '</span></li>' +
    '<li>' + ico('grupo', 18) + '<span>' + esc(textoTurmas(ev.turmas)) + '</span></li>' +
    (ev.local ? '<li>' + ico('local', 18) + '<span>' + esc(ev.local) + '</span></li>' : '') +
    '<li>' + ico('cheque', 18) + '<span>' + esc(ev.status) + '</span></li>' +
    (ev.obs ? '<li>' + ico('documento', 18) + '<span>' + esc(ev.obs) + '</span></li>' : '') +
    '</ul><ul>' +
    '<li><button type="button" class="opc" data-ev="editar">' + ico('renomear') + '<span>Editar</span></button></li>' +
    '<li><button type="button" class="opc" data-ev="status">' + ico('cheque') +
      '<span>Mudar situação<small>planejado, confirmado, realizado, cancelado</small></span></button></li>' +
    '<li><button type="button" class="opc perigo" data-ev="excluir">' + ico('lixo') +
      '<span>Apagar<small>só para engano de digitação</small></span></button></li></ul>';
  abrirFolha(ev.titulo, h);
  el('folhaCorpo').onclick = function(e){
    var o = e.target.closest('[data-ev]');
    if (!o) return;
    var qual = o.getAttribute('data-ev');
    fecharFolha();
    setTimeout(function(){
      if (!S.pin){ pedirPin(); return; }
      if (qual === 'editar') ir('agNovo', {id:ev.id});
      else if (qual === 'status') mudarStatus(ev);
      else confirmar('Apagar evento', ev.titulo + ' some da agenda. Se ele só não vai mais acontecer, prefira "Cancelado": fica registrado no ano.',
        'Apagar', function(){
          api('excluirEvento', [S.pin, ev.id], function(){
            vibrar(); toast('Evento apagado'); carregarAgMes(atual().p.mes);
          }, function(e2){ toast(textoErro(e2), 'erro'); });
        });
    }, 60);
  };
};

function mudarStatus(ev){
  folhaOpcoes('Situação de ' + ev.titulo, S.agListas.status.map(function(st){
    return { txt:st, marcado:(st === ev.status), fn:function(){
      if (st === ev.status) return;
      api('editarEvento', [S.pin, ev.id, {status:st}], function(){
        vibrar(); toast(ev.titulo + ': ' + st.toLowerCase());
        if (atual().t === 'agenda') carregarAgMes(atual().p.mes);
      }, function(e){ toast(textoErro(e), 'erro'); });
    }};
  }));
}

/* ══════════════ AGENDA: novo / editar ══════════════ */
TELAS.agNovo = function(p){
  return {
    titulo: p.id ? 'Editar evento' : 'Novo evento',
    html: esqueleto(4),
    barra:'<button type="button" class="salvar" id="btAgSalvar" data-acao="agSalvar" disabled>Salvar evento</button>',
    depois:function(){ comListas(function(){ montarFormEvento(p); }); }
  };
};

function montarFormEvento(p){
  var a = atual();
  if (!a || a.t !== 'agNovo' || a.p !== p) return;
  var L = S.agListas;
  var ev = p.id ? (S.agEventos || []).filter(function(x){ return x.id === p.id; })[0] : null;
  if (p.id && !ev){
    el('palco').querySelector('.corpo').innerHTML = estado('alerta', 'Evento não encontrado', 'Volte e abra de novo.');
    return;
  }
  var f = ev ? JSON.parse(JSON.stringify(ev))
             : {titulo:'', data:p.data || hojeISO(), dataFim:'', tipo:'', turmas:[], local:'', status:'Planejado', obs:''};
  S.agForm = f;

  var h = '<div class="campo"><label for="agTitulo">Nome do evento</label>' +
    '<input id="agTitulo" type="text" autocomplete="off" autocapitalize="sentences" maxlength="120" ' +
    'placeholder="Dia da Dança" value="' + esc(f.titulo) + '"></div>';
  h += '<div class="campo"><label for="agData">Data</label>' +
    '<input id="agData" type="date" value="' + esc(f.data) + '"></div>';
  h += '<label class="marca-dia"><input type="checkbox" id="agVarios"' + (f.dataFim ? ' checked' : '') +
    '> Dura mais de um dia</label>';
  h += '<div class="campo" id="agFimBox"' + (f.dataFim ? '' : ' hidden') + '><label for="agFim">Termina em</label>' +
    '<input id="agFim" type="date" value="' + esc(f.dataFim) + '"></div>';

  h += '<div class="campo"><label>Tipo</label><div class="tipos" id="agTipos">';
  L.tipos.forEach(function(t){
    h += '<button type="button" data-tipo="' + esc(t) + '" style="--c:' + esc(corTipo(t)) + '" aria-pressed="' +
         (f.tipo === t) + '">' + esc(t) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="campo"><label>Turmas</label><div class="chips" id="agTurmas">' +
    '<button type="button" class="chip' + (f.turmas.length ? '' : ' on') + '" data-turma="">Todas</button>';
  L.turmas.forEach(function(t){
    h += '<button type="button" class="chip' + (f.turmas.indexOf(t) !== -1 ? ' on' : '') +
         '" data-turma="' + esc(t) + '">' + esc(t) + '</button>';
  });
  h += '</div></div>';

  h += '<div class="campo"><label for="agLocal">Local <i>(opcional)</i></label>' +
    '<input id="agLocal" type="text" autocomplete="off" maxlength="120" placeholder="Teatro do bairro" value="' + esc(f.local) + '"></div>';
  h += '<div class="campo"><label for="agObs">Observação <i>(opcional)</i></label>' +
    '<input id="agObs" type="text" autocomplete="off" maxlength="500" value="' + esc(f.obs) + '"></div>';

  h += '<div class="campo"><label>Situação</label><div class="chips" id="agStatus">';
  L.status.forEach(function(st){
    h += '<button type="button" class="chip' + (f.status === st ? ' on' : '') + '" data-st="' + esc(st) + '">' +
         esc(st) + '</button>';
  });
  h += '</div></div>';

  el('palco').querySelector('.corpo').innerHTML = h;
  el('btAgSalvar').disabled = false;

  el('agVarios').onchange = function(){
    el('agFimBox').hidden = !this.checked;
    if (this.checked && !el('agFim').value) el('agFim').value = el('agData').value;
  };
  el('palco').querySelector('.corpo').onclick = function(e){
    var t = e.target.closest('[data-tipo]');
    if (t){
      var ts = el('agTipos').children;
      for (var i = 0; i < ts.length; i++) ts[i].setAttribute('aria-pressed', ts[i] === t ? 'true' : 'false');
      vibrar(); return;
    }
    var tu = e.target.closest('[data-turma]');
    if (tu){
      var todas = el('agTurmas').querySelector('[data-turma=""]');
      if (tu === todas){
        el('agTurmas').querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === todas); });
      } else {
        tu.classList.toggle('on');
        var alguma = el('agTurmas').querySelectorAll('.chip.on:not([data-turma=""])').length > 0;
        todas.classList.toggle('on', !alguma);
      }
      vibrar(); return;
    }
    var st = e.target.closest('[data-st]');
    if (st){
      el('agStatus').querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === st); });
      vibrar();
    }
  };
  if (!p.id) setTimeout(function(){ var i = el('agTitulo'); if (i) i.focus(); }, 200);
}

ACOES.agSalvar = function(){
  var p = atual().p;
  if (!el('agTitulo')) return;
  var tipo = el('agTipos').querySelector('[aria-pressed="true"]');
  var st = el('agStatus').querySelector('.chip.on');
  var dados = {
    titulo: el('agTitulo').value.trim(),
    data: el('agData').value,
    dataFim: el('agVarios').checked ? el('agFim').value : '',
    tipo: tipo ? tipo.getAttribute('data-tipo') : '',
    turmas: [].map.call(el('agTurmas').querySelectorAll('.chip.on:not([data-turma=""])'),
                        function(c){ return c.getAttribute('data-turma'); }),
    local: el('agLocal').value.trim(),
    obs: el('agObs').value.trim(),
    status: st ? st.getAttribute('data-st') : 'Planejado'
  };
  if (dados.titulo.length < 2){ toast('Escreva o nome do evento.', 'erro'); el('agTitulo').focus(); return; }
  if (!dados.data){ toast('Escolha a data.', 'erro'); return; }
  if (!dados.tipo){ toast('Escolha o tipo do evento.', 'erro'); return; }
  if (dados.dataFim && dados.dataFim < dados.data){ toast('A data do fim vem antes do começo.', 'erro'); return; }

  var bt = el('btAgSalvar');
  bt.disabled = true; bt.textContent = 'Salvando…';
  api(p.id ? 'editarEvento' : 'criarEvento', p.id ? [S.pin, p.id, dados] : [S.pin, dados], function(r){
    vibrar();
    toast(p.id ? 'Evento salvo' : dados.titulo + ' está na agenda');
    /* Volta para a agenda no mês do evento, para ela ver onde caiu. */
    var mes = r.data.slice(0,7);
    S.pilha.pop();
    var baixo = atual();
    if (baixo && baixo.t === 'agenda'){ baixo.p.mes = mes; desenhar(); }
    else if (baixo && baixo.t === 'agAno'){ desenhar(); }
    else { S.pilha.push({t:'agenda', p:{mes:mes}}); desenhar(); }
  }, function(e){
    var b2 = el('btAgSalvar');
    if (b2){ b2.disabled = false; b2.textContent = 'Salvar evento'; }
    toast(textoErro(e), 'erro');
  });
};

/* ══════════════ AGENDA: o ano ══════════════ */
/* A tela de janeiro, quando ela planeja o ano inteiro. */
TELAS.agAno = function(p){
  if (!p.ano) p.ano = +hojeISO().slice(0,4);
  var ano = p.ano;
  return {
    titulo:'Agenda de ' + ano,
    html:'<div class="passo">' +
        '<button type="button" data-acao="agAnoPasso" data-n="-1" aria-label="Ano anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + ano + '</b>' +
        '<button type="button" data-acao="agAnoPasso" data-n="1" aria-label="Próximo ano">' + ico('dir', 22) + '</button></div>' +
      '<div id="agMeses">' + esqueleto(3) + '</div>' +
      '<ul class="cartoes">' +
      '<li><button type="button" class="item" data-acao="agDatas">' + ico('bolo', 22) +
        '<span class="txt">Datas comemorativas<small>colocar as datas fixas do ano</small></span>' +
        '<span class="seta">' + ico('dir') + '</span></button></li>' +
      '<li><button type="button" class="item" data-acao="agImprimir">' + ico('impressora', 22) +
        '<span class="txt">Calendário para imprimir<small>PDF em A4 deitado, com espaço para escrever</small></span>' +
        '<span class="seta">' + ico('dir') + '</span></button></li></ul>',
    depois:function(){
      ler('listarAgendaAno', [ano], function(r){
        var a = atual();
        if (!a || a.t !== 'agAno' || a.p.ano !== ano || !el('agMeses')) return;
        S.agCores = r.cores;
        var hj = r.hoje.slice(0,7);
        var h = '<div class="meses">';
        r.meses.forEach(function(m){
          var chaveMes = ano + '-' + String(m.mes).padStart(2,'0');
          var pontos = '';
          r.tipos.forEach(function(t){
            for (var i = 0; i < Math.min(m.tipos[t] || 0, 4); i++) pontos += '<u style="--c:' + esc(r.cores[t]) + '"></u>';
          });
          h += '<button type="button" data-acao="agAbrirMes" data-m="' + chaveMes + '"' +
               (chaveMes === hj ? ' class="atual"' : '') +
               ' aria-label="' + esc(MESES[m.mes - 1] + ', ' + plural(m.total, 'evento', 'eventos')) + '">' +
               '<span>' + MES_CURTO[m.mes - 1] + '</span>' +
               '<b' + (m.total ? '' : ' class="zero"') + '>' + m.total + '</b>' +
               '<i>' + pontos + '</i></button>';
        });
        el('agMeses').innerHTML = h + '</div>';
      }, function(e){
        if (el('agMeses')) el('agMeses').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
      });
    }
  };
};
ACOES.agAnoPasso = function(b){ vibrar(); trocar('agAno', {ano:atual().p.ano + +b.getAttribute('data-n')}); };
ACOES.agAbrirMes = function(b){
  var mes = b.getAttribute('data-m');
  /* Se veio da agenda do mês, volta para ela no mês tocado. */
  var baixo = S.pilha[S.pilha.length - 2];
  if (baixo && baixo.t === 'agenda'){ S.pilha.pop(); baixo.p.mes = mes; desenhar(); }
  else ir('agenda', {mes:mes});
};
ACOES.agDatas = function(){ comPin('agDatas', {ano:atual().p.ano}); };

/* ══════════════ AGENDA: datas comemorativas ══════════════ */
TELAS.agDatas = function(p){
  return {
    titulo:'Datas de ' + p.ano,
    html:esqueleto(3),
    barra:'<button type="button" class="salvar" id="btDatas" data-acao="agPrecarregar" disabled>Colocar na agenda</button>',
    depois:function(){
      ler('datasFixas', [p.ano], function(r){
        var a = atual();
        if (!a || a.t !== 'agDatas' || a.p.ano !== p.ano) return;
        var h = '<p style="color:var(--apagado);font-size:14px;margin:0 0 16px 4px">' +
          'Datas que se repetem todo ano. Desmarque o que não quiser e toque em "Colocar na agenda".</p>' +
          '<ul class="lista checks">';
        var livres = 0;
        r.datas.forEach(function(d){
          if (!d.jaTem) livres++;
          h += '<li class="li" role="checkbox" tabindex="0" data-acao="agMarcaData" data-dia="' + esc(d.dia) + '"' +
               ' aria-checked="' + (!d.jaTem) + '"' + (d.jaTem ? ' aria-disabled="true"' : '') + '>' +
               '<span class="caixa">' + ico('cheque', 16) + '</span>' +
               '<span class="nome">' + esc(d.titulo) + '<small>' + esc(dataExtenso(d.data)) +
               (d.jaTem ? ' · já está na agenda' : '') + '</small></span></li>';
        });
        h += '</ul><p class="dica" style="margin:4px 4px 0">Faltou alguma? Cadastre pelo "Novo evento" na agenda do mês.</p>';
        el('palco').querySelector('.corpo').innerHTML = h;
        var bt = el('btDatas');
        if (bt) bt.disabled = !livres;
      }, function(e){
        el('palco').querySelector('.corpo').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
      }, {fresco:300000});
    }
  };
};
ACOES.agMarcaData = function(b){
  if (b.getAttribute('aria-disabled') === 'true') return;
  b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
  vibrar();
};
ACOES.agPrecarregar = function(){
  var ano = atual().p.ano;
  var dias = [].map.call(document.querySelectorAll('.checks [aria-checked="true"]:not([aria-disabled="true"])'),
                         function(n){ return n.getAttribute('data-dia'); });
  if (!dias.length){ toast('Marque pelo menos uma data.', 'erro'); return; }
  var bt = el('btDatas'); bt.disabled = true; bt.textContent = 'Colocando…';
  api('precarregarDatas', [S.pin, ano, dias], function(r){
    vibrar();
    toast(r.criados ? plural(r.criados, 'data entrou', 'datas entraram') + ' na agenda de ' + ano
                    : 'Essas datas já estavam na agenda');
    voltar();
  }, function(e){
    bt.disabled = false; bt.textContent = 'Colocar na agenda';
    toast(textoErro(e), 'erro');
  });
};

/* ══════════════ AGENDA: calendário para imprimir ══════════════ */
/* Fecha o ciclo: ela imprime e escreve em cima, como sempre fez. */
TELAS.agImprimir = function(p){
  return {
    titulo:'Calendário para imprimir',
    html:'<div class="passo">' +
        '<button type="button" data-acao="agImpPasso" data-n="-1" aria-label="Ano anterior">' + ico('esq', 22) + '</button>' +
        '<b>' + p.ano + '</b>' +
        '<button type="button" data-acao="agImpPasso" data-n="1" aria-label="Próximo ano">' + ico('dir', 22) + '</button></div>' +
      '<div class="cartao-info">' + ico('impressora', 26) +
        '<b>Calendário ' + p.ano + '</b>' +
        '<span>Folha A4 deitada, uma página por trimestre, com os eventos marcados em cada dia ' +
        'e espaço em branco para escrever à mão. Mês com muito evento ganha página própria.</span>' +
        '<span id="agImpConta" style="margin-top:8px;font-weight:600;color:var(--roxo)"></span></div>' +
      '<button type="button" class="botao-cheio" id="btPdf" data-acao="agGerarPdf">' +
        ico('documento', 18) + ' Gerar o PDF</button>' +
      '<p class="dica" id="agPdfEspera" role="status" aria-live="polite" style="text-align:center;min-height:3em"></p>',
    depois:function(){
      ler('listarAgendaAno', [p.ano], function(r){
        var n = el('agImpConta');
        if (n && atual().p.ano === p.ano)
          n.textContent = r.total ? plural(r.total, 'evento marcado', 'eventos marcados') + ' no ano'
                                  : 'Nenhum evento ainda: sai o calendário em branco.';
      }, function(){});
    }
  };
};
ACOES.agImpPasso = function(b){ vibrar(); trocar('agImprimir', {ano:atual().p.ano + +b.getAttribute('data-n')}); };
/* "Gerando…" parado por 40 segundos é igual a travado. O contador anda
   a cada segundo e o texto muda conforme a espera cresce. Não finge
   progresso: o servidor não conta em que página está, só o relógio. */
var agPdfRelogio = 0;
function esperaPdf(inicio){
  var n = el('agPdfEspera');
  if (!n){ clearInterval(agPdfRelogio); return; }
  var s = Math.round((Date.now() - inicio) / 1000);
  n.textContent = (s < 20 ? 'Montando as páginas do calendário no Google'
    : s < 60 ? 'Ainda montando. O Google leva seu tempo com PDF; pode deixar a tela aberta'
    : 'Está demorando mais que o normal, mas continua trabalhando') + ' · ' + s + ' s';
}
ACOES.agGerarPdf = function(){
  var ano = atual().p.ano;
  var bt = el('btPdf');
  bt.disabled = true; bt.textContent = 'Gerando o calendário…';
  var inicio = Date.now();
  clearInterval(agPdfRelogio);
  esperaPdf(inicio);
  agPdfRelogio = setInterval(function(){ esperaPdf(inicio); }, 1000);
  function parar(){ clearInterval(agPdfRelogio); if (el('agPdfEspera')) el('agPdfEspera').textContent = ''; }
  api('gerarCalendarioPdf', [S.pin, ano], function(r){
    parar();
    var b2 = el('btPdf');
    if (b2){ b2.disabled = false; b2.innerHTML = ico('documento', 18) + ' Gerar de novo'; }
    vibrar();
    var texto = 'Calendário ' + ano + ' do Instituto Veridiana: ' + r.url;
    var seg = r.tempo ? r.tempo.total : Math.round((Date.now() - inicio) / 1000);
    var h = '<p class="sub">' + esc(r.nome) + ' · ' + plural(r.paginas, 'página', 'páginas') +
      ' · pronto em ' + String(seg).replace('.', ',') + ' s</p>' +
      '<div style="padding:0 8px">' +
      '<a class="botao-cheio" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + ico('abrir', 18) + ' Abrir o PDF</a>';
    if (r.publico){
      h += '<a class="botao-zap" style="margin-top:8px" href="https://wa.me/?text=' + encodeURIComponent(texto) +
           '" target="_blank" rel="noopener">' + ico('conversa', 18) + ' Mandar no WhatsApp</a>';
    }
    h += '<button type="button" class="botao-cheio" style="margin-top:8px;background:var(--fundo);color:var(--roxo)" ' +
         'data-acao="copiarLink" data-u="' + esc(r.url) + '">' + ico('copiar', 18) + ' Copiar link</button>';
    if (!r.publico){
      h += '<p class="dica" style="margin:16px 4px 0">O Drive do instituto não deixou abrir o link para qualquer pessoa. ' +
           'Quem receber precisa ter acesso à pasta "Agenda — Instituto Veridiana".</p>';
    }
    abrirFolha('Calendário pronto', h + '</div>');
  }, function(e){
    parar();
    var b2 = el('btPdf');
    if (b2){ b2.disabled = false; b2.innerHTML = ico('documento', 18) + ' Gerar o PDF'; }
    toast(textoErro(e), 'erro');
  }, 150000);
};
</script>

<script>
/* Materiais: estrutura fixa, categorias livres. Cadastro rápido é a
   única métrica que importa aqui: cadastro lento não acontece. */

/* "Ambos" é instituto e bazar: aparece no filtro de cada um. */
function bateFinalidade(item, f){
  if (!f) return true;
  if (f === 'Instituto' || f === 'Bazar') return item.finalidade === f || item.finalidade === 'Ambos';
  return item.finalidade === f;
}
function ehBazar(i){ return i.finalidade === 'Bazar' || i.finalidade === 'Ambos'; }
function mtItem(id){ return ((S.mt && S.mt.itens) || []).filter(function(i){ return i.id === id; })[0]; }

/* repintavel: a tela aguenta ser desenhada duas vezes (memória, depois
   o dado novo). Formulário e caminho depois de salvar não aguentam. */
function carregarMt(fn, falhou, repintavel){
  ler('listarMateriais', [{}], function(r){ S.mt = r; fn(r); },
      falhou || function(e){ toast(textoErro(e), 'erro'); },
      repintavel ? null : {fresco:300000});
}

/* ══════════════ MATERIAIS: lista ══════════════ */
TELAS.mtLista = function(){
  if (!S.mtFiltro) S.mtFiltro = {categoria:'', finalidade:'', estado:'', busca:''};
  if (!S.mtFechados) S.mtFechados = {};
  return {
    titulo:'Materiais',
    html:'<div id="mtAtalhos"></div>' +
      '<div class="busca">' + ico('lupa') +
      '<input id="mtBusca" type="search" placeholder="Procurar item" autocomplete="off" aria-label="Procurar item" ' +
      'value="' + esc(S.mtFiltro.busca) + '"></div>' +
      '<div class="mt-filtros" id="mtFiltros"></div>' +
      '<div id="mtLista">' + esqueleto(5) + '</div>',
    barra:'<button type="button" class="salvar" data-acao="mtNovo">' + ico('mais') + 'Novo item</button>',
    depois:function(){
      el('mtBusca').addEventListener('input', function(){ S.mtFiltro.busca = this.value; pintarMt(); });
      if (S.mt) pintarMt();
      carregarMt(function(){ if (atual().t === 'mtLista') pintarMt(); }, function(e){
        if (el('mtLista') && !S.mt) el('mtLista').innerHTML = estado('alerta', 'Não deu para carregar', textoErro(e));
      }, true);
    }
  };
};

function pintarMt(){
  if (!el('mtLista') || !S.mt) return;
  var F = S.mtFiltro, todos = S.mt.itens;
  var nBazar = todos.filter(ehBazar).length;
  var nReparo = todos.filter(function(i){ return i.estado === 'Precisa reparo'; }).length;

  /* Os dois atalhos com valor operacional: o que vai para o bazar e o
     que precisa de conserto. Com número, sem precisar abrir filtro. */
  el('mtAtalhos').innerHTML = '<div class="mt-atalhos">' +
    '<button type="button" data-acao="mtAtalho" data-a="bazar" aria-pressed="' + (F.finalidade === 'Bazar') + '">' +
      ico('etiqueta', 18) + 'Para o bazar <b>' + nBazar + '</b></button>' +
    '<button type="button" data-acao="mtAtalho" data-a="reparo" aria-pressed="' + (F.estado === 'Precisa reparo') + '">' +
      ico('chave', 18) + 'Precisa reparo <b>' + nReparo + '</b></button>' +
    '<button type="button" data-acao="mtResumo">' + ico('tabela', 18) + 'Resumo</button></div>';

  function filtroBt(campo, rotulo, vazio){
    var v = F[campo];
    return '<button type="button" data-acao="mtFiltro" data-c="' + campo + '"' + (v ? ' class="on"' : '') + '>' +
      esc(rotulo) + '<b>' + esc(v || vazio) + '</b></button>';
  }
  el('mtFiltros').innerHTML = filtroBt('categoria', 'Categoria', 'Todas') +
    filtroBt('finalidade', 'Finalidade', 'Todas') + filtroBt('estado', 'Estado', 'Todos');

  var b = semAcento(F.busca);
  var lista = todos.filter(function(i){
    if (F.categoria && i.categoria !== F.categoria) return false;
    if (!bateFinalidade(i, F.finalidade)) return false;
    if (F.estado && i.estado !== F.estado) return false;
    return !b || semAcento(i.item).indexOf(b) !== -1 || semAcento(i.local).indexOf(b) !== -1;
  });
  var algumFiltro = F.categoria || F.finalidade || F.estado || F.busca;
  var h = algumFiltro ? '<button type="button" class="mt-limpar" data-acao="mtLimpar">Limpar filtros</button>' : '';

  if (!todos.length){
    el('mtLista').innerHTML = estado('pacote', 'Nenhum item ainda',
      'Toque em "Novo item" aqui embaixo. Nome, quantidade e onde fica já bastam.');
    return;
  }
  if (!lista.length){
    el('mtLista').innerHTML = h + estado('lupa', 'Nada com esse filtro', 'Troque o filtro ou limpe a busca.');
    return;
  }
  var grupos = {}, ordem = [];
  lista.forEach(function(i){
    if (!grupos[i.categoria]){ grupos[i.categoria] = []; ordem.push(i.categoria); }
    grupos[i.categoria].push(i);
  });
  ordem.forEach(function(cat, gi){
    var aberto = !S.mtFechados[cat];
    h += '<div class="grupo-mt"><button type="button" class="recolhe" data-acao="mtGrupo" data-g="' + esc(cat) +
         '" aria-expanded="' + aberto + '" aria-controls="mtG' + gi + '">' +
         '<span class="seta">' + ico('dir', 18) + '</span>' + esc(cat) +
         '<span class="conta-g">' + grupos[cat].length + '</span></button>' +
         '<ul class="lista sem-avatar" id="mtG' + gi + '"' + (aberto ? '' : ' hidden') + '>';
    grupos[cat].forEach(function(i){
      var ruim = i.estado === 'Precisa reparo' || i.estado === 'Inservível';
      h += '<li class="li" data-acao="mtAbrir" data-id="' + esc(i.id) + '" role="button" tabindex="0">' +
           '<span class="nome">' + esc(i.item) +
           (ruim ? '<span class="selo-estado ruim">' + esc(i.estado) + '</span>' : '') +
           '<small>' + esc([i.local || 'sem local', ehBazar(i) ? 'bazar' : ''].filter(Boolean).join(' · ')) + '</small></span>' +
           '<span class="qtd-li" aria-label="' + plural(i.quantidade, 'unidade', 'unidades') + '">' + i.quantidade + '</span></li>';
    });
    h += '</ul></div>';
  });
  el('mtLista').innerHTML = h;
}

ACOES.mtGrupo = function(b){
  var g = b.getAttribute('data-g');
  var aberto = b.getAttribute('aria-expanded') === 'true';
  S.mtFechados[g] = aberto;
  b.setAttribute('aria-expanded', aberto ? 'false' : 'true');
  el(b.getAttribute('aria-controls')).hidden = aberto;
};
ACOES.mtAtalho = function(b){
  var a = b.getAttribute('data-a'), F = S.mtFiltro;
  if (a === 'bazar') F.finalidade = F.finalidade === 'Bazar' ? '' : 'Bazar';
  else F.estado = F.estado === 'Precisa reparo' ? '' : 'Precisa reparo';
  vibrar(); pintarMt();
};
ACOES.mtLimpar = function(){
  S.mtFiltro = {categoria:'', finalidade:'', estado:'', busca:''};
  if (el('mtBusca')) el('mtBusca').value = '';
  vibrar(); pintarMt();
};
ACOES.mtFiltro = function(b){
  var c = b.getAttribute('data-c'), F = S.mtFiltro;
  var valores = c === 'categoria' ? distintosCliente('categoria')
              : c === 'finalidade' ? S.mt.finalidades : S.mt.estados;
  var titulo = c === 'categoria' ? 'Categoria' : c === 'finalidade' ? 'Finalidade' : 'Estado';
  var ops = [{txt:c === 'estado' ? 'Todos' : 'Todas', marcado:!F[c], fn:function(){ F[c] = ''; pintarMt(); }}];
  valores.forEach(function(v){
    ops.push({txt:v, sub:c === 'finalidade' && v === 'Ambos' ? 'instituto e bazar' : '',
              marcado:F[c] === v, fn:function(){ F[c] = v; pintarMt(); }});
  });
  folhaOpcoes(titulo, ops);
};
function distintosCliente(campo){
  var v = {};
  (S.mt.itens || []).forEach(function(i){ if (i[campo]) v[i[campo]] = 1; });
  return Object.keys(v).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); });
}
ACOES.mtAbrir = function(b){ ir('mtItem', {id:b.getAttribute('data-id')}); };
ACOES.mtNovo = function(){ comPin('mtNovo', {}); };
ACOES.mtResumo = function(){ ir('mtResumo'); };

/* ══════════════ MATERIAIS: novo / editar ══════════════ */
TELAS.mtNovo = function(p){
  return {
    titulo: p.id ? 'Editar item' : 'Novo item',
    html:esqueleto(4),
    barra:'<button type="button" class="salvar" id="btMtSalvar" data-acao="mtSalvar" disabled>Salvar item</button>',
    depois:function(){
      if (S.mt) montarFormMt(p);
      else carregarMt(function(){ montarFormMt(p); });
    }
  };
};

function montarFormMt(p){
  var a = atual();
  if (!a || a.t !== 'mtNovo' || a.p !== p) return;
  var ult = S.mtUltimo || {};
  var it = p.id ? mtItem(p.id) : null;
  if (p.id && !it){
    el('palco').querySelector('.corpo').innerHTML = estado('alerta', 'Item não encontrado', 'Volte e abra de novo.');
    return;
  }
  /* Cadastro em série (ela arrumando o depósito): categoria, local e
     finalidade repetem os do último item salvo. */
  var f = it ? JSON.parse(JSON.stringify(it)) : {
    item:'', quantidade:1, categoria:ult.categoria || '', local:ult.local || '',
    estado:'Bom', finalidade:ult.finalidade || 'Instituto', obs:''
  };
  if (f.categoria === 'Sem categoria') f.categoria = '';
  S.mtForm = f;

  var h = '<div class="campo"><label for="mtNome">Nome do item</label>' +
    '<input id="mtNome" type="text" autocomplete="off" autocapitalize="sentences" maxlength="120" ' +
    'placeholder="Ventilador de coluna" value="' + esc(f.item) + '"></div>';
  h += '<div class="campo"><label for="mtQtd">Quantidade</label><div class="qtd">' +
    '<button type="button" data-q="-1" aria-label="Menos um">' + ico('menos', 22) + '</button>' +
    '<input id="mtQtd" type="number" inputmode="numeric" min="0" step="1" value="' + f.quantidade + '">' +
    '<button type="button" data-q="1" aria-label="Mais um">' + ico('mais', 22) + '</button></div></div>';
  h += '<div class="campo"><label>Categoria</label>' +
    '<button type="button" class="escolha" id="mtCat" data-lista="categoria" data-vazio="' + !f.categoria + '">' +
    '<span>' + esc(f.categoria || 'Escolher ou criar') + '</span>' + ico('dir', 18) + '</button></div>';
  h += '<div class="campo"><label>Onde fica</label>' +
    '<button type="button" class="escolha" id="mtLocal" data-lista="local" data-vazio="' + !f.local + '">' +
    '<span>' + esc(f.local || 'Escolher ou criar') + '</span>' + ico('dir', 18) + '</button></div>';
  h += '<div class="campo"><label>Estado</label><div class="chips" id="mtEstado">';
  S.mt.estados.forEach(function(e){
    h += '<button type="button" class="chip' + (f.estado === e ? ' on' : '') + '" data-est="' + esc(e) + '">' + esc(e) + '</button>';
  });
  h += '</div></div>';
  h += '<div class="campo"><label>Para que serve</label><div class="chips" id="mtFin">';
  S.mt.finalidades.forEach(function(x){
    h += '<button type="button" class="chip' + (f.finalidade === x ? ' on' : '') + '" data-fin="' + esc(x) + '">' +
         esc(x === 'Ambos' ? 'Ambos (instituto e bazar)' : x) + '</button>';
  });
  h += '</div></div>';
  h += '<div class="campo"><label for="mtObs">Observação <i>(opcional)</i></label>' +
    '<input id="mtObs" type="text" autocomplete="off" maxlength="500" value="' + esc(f.obs) + '"></div>';

  var corpo = el('palco').querySelector('.corpo');
  corpo.innerHTML = h;
  el('btMtSalvar').disabled = false;
  corpo.onclick = function(e){
    var q = e.target.closest('[data-q]');
    if (q){
      var n = Math.max(0, (parseInt(el('mtQtd').value, 10) || 0) + +q.getAttribute('data-q'));
      el('mtQtd').value = n; vibrar(); return;
    }
    var l = e.target.closest('[data-lista]');
    if (l){ escolherNaLista(l.getAttribute('data-lista')); return; }
    var es = e.target.closest('[data-est]');
    if (es){ marcarUm('mtEstado', es); f.estado = es.getAttribute('data-est'); return; }
    var fi = e.target.closest('[data-fin]');
    if (fi){ marcarUm('mtFin', fi); f.finalidade = fi.getAttribute('data-fin'); }
  };
  if (!p.id) setTimeout(function(){ var i = el('mtNome'); if (i) i.focus(); }, 200);
}

function marcarUm(id, alvo){
  el(id).querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === alvo); });
  vibrar();
}

/* Categoria e local: o que já existe, sugestões enquanto a lista é
   curta, e "criar" no fim. É aqui que mora a liberdade que ela pediu. */
function escolherNaLista(campo){
  var f = S.mtForm;
  var L = campo === 'categoria' ? S.mt.categorias : S.mt.locais;
  var nome = campo === 'categoria' ? 'categoria' : 'local';
  var html = '<ul>';
  var ops = [];
  function linha(v){
    ops.push(v);
    html += '<li><button type="button" class="opc" data-v="' + (ops.length - 1) + '" aria-selected="' + (f[campo] === v) + '">' +
            ico(campo === 'categoria' ? 'etiqueta' : 'local') + '<span>' + esc(v) + '</span>' +
            '<span class="cv">' + ico('cheque') + '</span></button></li>';
  }
  L.usadas.forEach(linha);
  html += '</ul>';
  if (L.sugestoes.length){
    html += '<p class="grupo-rot">Sugestões</p><ul>';
    L.sugestoes.forEach(linha);
    html += '</ul>';
  }
  html += '<ul><li><button type="button" class="opc" data-v="novo" style="color:var(--roxo)">' + ico('mais') +
          '<span>Criar ' + (campo === 'categoria' ? 'categoria' : 'local') + '</span></button></li>';
  if (f[campo]) html += '<li><button type="button" class="opc" data-v="nada">' + ico('menos') +
          '<span>Deixar sem ' + nome + '</span></button></li>';
  html += '</ul>';
  abrirFolha(campo === 'categoria' ? 'Categoria' : 'Onde fica', html);
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-v]');
    if (!b) return;
    var v = b.getAttribute('data-v');
    fecharFolha();
    if (v === 'novo'){
      setTimeout(function(){
        pedirTexto(campo === 'categoria' ? 'Nova categoria' : 'Novo local',
          campo === 'categoria' ? 'Nome da categoria' : 'Nome do lugar', '', 'Usar', function(txt){
            /* Mesma coisa com outra grafia vira a existente: "som e audio"
               não pode nascer como categoria nova ao lado de "Som e áudio". */
            var igual = L.usadas.concat(L.sugestoes).filter(function(x){ return semAcento(x) === semAcento(txt); })[0];
            aplicarEscolha(campo, igual || txt);
          });
      }, 60);
      return;
    }
    aplicarEscolha(campo, v === 'nada' ? '' : ops[+v]);
  };
}
function aplicarEscolha(campo, v){
  S.mtForm[campo] = v;
  var b = el(campo === 'categoria' ? 'mtCat' : 'mtLocal');
  if (!b) return;
  b.dataset.vazio = v ? 'false' : 'true';
  b.querySelector('span').textContent = v || 'Escolher ou criar';
  vibrar();
}

ACOES.mtSalvar = function(){
  var p = atual().p, f = S.mtForm;
  if (!el('mtNome')) return;
  var dados = {
    item: el('mtNome').value.trim(),
    quantidade: parseInt(el('mtQtd').value, 10),
    categoria: f.categoria, local: f.local,
    estado: f.estado, finalidade: f.finalidade,
    obs: el('mtObs').value.trim()
  };
  if (dados.item.length < 2){ toast('Escreva o nome do item.', 'erro'); el('mtNome').focus(); return; }
  if (!(dados.quantidade >= 0)){ toast('Escreva a quantidade.', 'erro'); el('mtQtd').focus(); return; }
  var bt = el('btMtSalvar');
  bt.disabled = true; bt.textContent = 'Salvando…';
  api(p.id ? 'editarMaterial' : 'criarMaterial', p.id ? [S.pin, p.id, dados] : [S.pin, dados], function(){
    vibrar();
    S.mtUltimo = {categoria:dados.categoria, local:dados.local, finalidade:dados.finalidade};
    toast(p.id ? 'Item salvo' : dados.item + ' cadastrado');
    carregarMt(function(){
      if (atual() && atual().t === 'mtNovo'){ voltar(); }
    });
  }, function(e){
    var b2 = el('btMtSalvar');
    if (b2){ b2.disabled = false; b2.textContent = 'Salvar item'; }
    toast(textoErro(e), 'erro');
  });
};

/* ══════════════ MATERIAIS: ficha do item ══════════════ */
TELAS.mtItem = function(p){
  var it = mtItem(p.id);
  if (!it) return { titulo:'Item', html:estado('alerta', 'Item não encontrado', 'Volte para a lista e abra de novo.') };
  var linhas = [
    ['etiqueta', 'Categoria', it.categoria],
    ['local', 'Onde fica', it.local || 'sem local'],
    ['cheque', 'Estado', it.estado],
    ['pacote', 'Para que serve', it.finalidade === 'Ambos' ? 'Instituto e bazar' : it.finalidade]
  ];
  if (it.obs) linhas.push(['documento', 'Observação', it.obs]);
  var h = '<div class="ficha-mt"><h2>' + esc(it.item) + '</h2></div>' +
    '<div class="qtd grande">' +
      '<button type="button" data-acao="mtMais" data-n="-1" aria-label="Menos um">' + ico('menos', 26) + '</button>' +
      '<output id="mtQ" aria-live="polite">' + it.quantidade + '</output>' +
      '<button type="button" data-acao="mtMais" data-n="1" aria-label="Mais um">' + ico('mais', 26) + '</button></div>' +
    '<p class="qtd-rot" id="mtQrot">' + (it.quantidade === 1 ? 'unidade' : 'unidades') + '</p>' +
    '<ul class="lista sem-avatar">';
  linhas.forEach(function(l){
    h += '<li class="li"><span class="nome"><small style="margin:0 0 2px">' + esc(l[1]) + '</small>' + esc(l[2]) + '</span></li>';
  });
  h += '</ul>';
  if (it.estado !== 'Inservível'){
    h += '<button type="button" class="botao-vazio" data-acao="mtInservivel">' + ico('alerta', 18) +
         ' Marcar como inservível</button>';
  }
  h += '<button type="button" class="botao-vazio" style="color:var(--falta);border-color:#EDC6CE" data-acao="mtDescartar">' +
       ico('lixo', 18) + ' Tirar da lista</button>';
  return {
    titulo:it.item, html:h,
    barra:'<button type="button" class="salvar" data-acao="mtEditar">' + ico('renomear') + 'Editar</button>'
  };
};

/* Mais e menos respondem na hora e mandam um ajuste só depois que o
   dedo para: cinco toques seguidos são uma escrita, não cinco. */
var mtAjuste = {id:'', delta:0, t:0};
ACOES.mtMais = function(b){
  if (!S.pin){ pedirPin(); return; }
  var id = atual().p.id, it = mtItem(id);
  if (!it) return;
  var n = +b.getAttribute('data-n');
  if (it.quantidade + n < 0) return;
  if (mtAjuste.id && mtAjuste.id !== id) enviarAjuste();
  it.quantidade += n;
  mtAjuste.id = id; mtAjuste.delta += n;
  pintarQtd(it.quantidade);
  vibrar();
  clearTimeout(mtAjuste.t);
  mtAjuste.t = setTimeout(enviarAjuste, 800);
};
function pintarQtd(q){
  el('mtQ').textContent = q;
  el('mtQrot').textContent = q === 1 ? 'unidade' : 'unidades';
}
function enviarAjuste(){
  clearTimeout(mtAjuste.t);
  var id = mtAjuste.id, d = mtAjuste.delta;
  mtAjuste = {id:'', delta:0, t:0};
  if (!id || !d) return;
  api('ajustarQuantidade', [S.pin, id, d], function(r){
    var it = mtItem(id);
    if (it) it.quantidade = r.quantidade;
    var a = atual();
    if (a && a.t === 'mtItem' && a.p.id === id && el('mtQ') && mtAjuste.id !== id) pintarQtd(r.quantidade);
  }, function(e){
    var it = mtItem(id);
    if (it) it.quantidade = Math.max(0, it.quantidade - d);
    var a = atual();
    if (a && a.t === 'mtItem' && a.p.id === id && el('mtQ') && it) pintarQtd(it.quantidade);
    toast('A quantidade não foi salva. ' + textoErro(e), 'erro');
  });
}
ACOES.mtEditar = function(){ enviarAjuste(); comPin('mtNovo', {id:atual().p.id}); };
ACOES.mtInservivel = function(){
  if (!S.pin){ pedirPin(); return; }
  var id = atual().p.id, it = mtItem(id);
  confirmar('Marcar como inservível', it.item + ' continua na lista, marcado como sem uso. Se foi para o lixo, use "Tirar da lista".',
    'Marcar', function(){
      api('editarMaterial', [S.pin, id, {estado:'Inservível'}], function(){
        vibrar(); toast(it.item + ' marcado como inservível');
        carregarMt(function(){ if (atual().t === 'mtItem') desenhar(); });
      }, function(e){ toast(textoErro(e), 'erro'); });
    });
};
ACOES.mtDescartar = function(){
  if (!S.pin){ pedirPin(); return; }
  var id = atual().p.id, it = mtItem(id);
  confirmar('Tirar da lista', it.item + ' sai da lista de materiais. A linha continua guardada na planilha.',
    'Tirar da lista', function(){
      api('inativarMaterial', [S.pin, id], function(){
        vibrar(); toast(it.item + ' saiu da lista');
        carregarMt(function(){ if (atual().t === 'mtItem') voltar(); });
      }, function(e){ toast(textoErro(e), 'erro'); });
    });
};

/* ══════════════ MATERIAIS: resumo ══════════════ */
TELAS.mtResumo = function(){
  return {
    titulo:'Resumo dos materiais', html:esqueleto(4),
    depois:function(){
      if (S.mt) pintarResumoMt();
      carregarMt(function(){ if (atual().t === 'mtResumo') pintarResumoMt(); }, null, true);
    }
  };
};
function pintarResumoMt(){
  var corpo = el('palco').querySelector('.corpo');
  var itens = S.mt.itens;
  if (!itens.length){
    corpo.innerHTML = estado('pacote', 'Nenhum item ainda', 'Cadastre os materiais pela lista.');
    return;
  }
  var unidades = 0, porCat = {};
  itens.forEach(function(i){
    unidades += i.quantidade;
    var c = porCat[i.categoria] || (porCat[i.categoria] = {itens:0, un:0});
    c.itens++; c.un += i.quantidade;
  });
  var cats = Object.keys(porCat).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); });
  var h = '<div class="numeros">' +
    '<div><b>' + itens.length + '</b><span>' + (itens.length === 1 ? 'item' : 'itens') + '</span></div>' +
    '<div><b>' + unidades + '</b><span>unidades</span></div>' +
    '<div><b>' + cats.length + '</b><span>' + (cats.length === 1 ? 'categoria' : 'categorias') + '</span></div></div>';

  function listaItens(titulo, lista, vazio){
    var s = '<div class="secao">' + esc(titulo) + '</div>';
    if (!lista.length) return s + '<p class="dica" style="margin:0 4px">' + esc(vazio) + '</p>';
    s += '<ul class="lista sem-avatar">';
    lista.forEach(function(i){
      s += '<li class="li" data-acao="mtAbrir" data-id="' + esc(i.id) + '" role="button" tabindex="0">' +
           '<span class="nome">' + esc(i.item) + '<small>' + esc(i.local || 'sem local') + '</small></span>' +
           '<span class="qtd-li">' + i.quantidade + '</span></li>';
    });
    return s + '</ul>';
  }
  h += listaItens('Para o bazar', itens.filter(ehBazar), 'Nenhum item marcado para o bazar.');
  h += listaItens('Precisam de reparo', itens.filter(function(i){ return i.estado === 'Precisa reparo'; }),
                  'Nada quebrado. Ótimo.');

  function grupos(titulo, campo, mapa, nomes){
    var s = '<div class="secao">' + titulo + '</div><ul class="lista sem-avatar">';
    nomes.forEach(function(c){
      s += '<li class="li" data-acao="mtListaResumo" data-campo="' + campo + '" data-c="' + esc(c) + '" role="button" tabindex="0">' +
           '<span class="nome">' + esc(c) + '<small>' + plural(mapa[c].un, 'unidade', 'unidades') + '</small></span>' +
           '<span class="qtd-li">' + mapa[c].itens + '</span></li>';
    });
    return s + '</ul>';
  }
  var porLocal = {};
  itens.forEach(function(i){
    var k = i.local || 'Sem local';
    var c = porLocal[k] || (porLocal[k] = {itens:0, un:0});
    c.itens++; c.un += i.quantidade;
  });
  h += grupos('Por categoria', 'categoria', porCat, cats);
  h += grupos('Por local', 'local', porLocal,
              Object.keys(porLocal).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); }));
  h += '<p class="dica" style="margin:0 4px">Toque numa categoria ou num local para ver os itens ou mudar o nome.</p>';
  corpo.innerHTML = h;
}
ACOES.mtListaResumo = function(b){
  var c = b.getAttribute('data-c'), campo = b.getAttribute('data-campo');
  var vazio = c === 'Sem categoria' || c === 'Sem local';
  var ops = [{txt:'Ver os itens', icone:'lupa', fn:function(){
    S.mtFiltro = {categoria:'', finalidade:'', estado:'', busca:''};
    if (campo === 'categoria') S.mtFiltro.categoria = c;
    else S.mtFiltro.busca = vazio ? '' : c;
    voltar();
  }}];
  if (!vazio) ops.push({txt:'Mudar o nome', sub:'muda em todos os itens de uma vez', icone:'renomear', fn:function(){
    if (!S.pin){ pedirPin(); return; }
    pedirTexto('Mudar o nome', campo === 'categoria' ? 'Novo nome da categoria' : 'Novo nome do local', c, 'Mudar', function(novo){
      api('renomearNaLista', [S.pin, campo, c, novo], function(r){
        vibrar(); toast(plural(r.mudou, 'item mudou', 'itens mudaram') + ' para ' + novo);
        carregarMt(function(){ if (atual().t === 'mtResumo') pintarResumoMt(); });
      }, function(e){ toast(textoErro(e), 'erro'); });
    });
  }});
  folhaOpcoes(c, ops);
};
</script>

<script>modPronto("materiais");</script>
<script>
/* Partida: lê turma e professor da URL e abre a primeira tela. Roda por último. */
/* ══════════════ partida ══════════════ */
function iniciar(){
  /* getLocation pode levar até 4 s (ou nunca responder). Até aqui o
     #palco ficava vazio: barra roxa e branco embaixo. */
  el('palco').innerHTML = '<div class="corpo">' + esqueleto(5) + '</div>';

  /* Sem ?turma= a pessoa abriu o app pelo atalho, não pelo QR da
     parede: é aí, e só aí, que aparece a tela inicial. */
  function semParametro(){ S.viaQr = false; ir('inicio', {}, true); }
  try {
    if (google.script.url && google.script.url.getLocation){
      var respondeu = false;
      var prazo = setTimeout(function(){ if (!respondeu){ respondeu = true; semParametro(); } }, 4000);
      google.script.url.getLocation(function(loc){
        if (respondeu) return;
        respondeu = true; clearTimeout(prazo);
        var q = (loc && loc.parameter) || {};
        /* ?prof= vem do atalho que cada professor salva no celular. Sem
           login e sem cookie (o iframe do Apps Script não guarda nada),
           é o jeito de o app saber quem está com ele na mão. */
        S.prof = q.prof ? String(q.prof).trim().replace(/\s+/g, ' ').slice(0, 80) : '';
        var t = q.turma ? String(q.turma) : '';
        if (t){ S.viaQr = true; ir('chamada', {turma:t}, true); }
        else semParametro();
      });
    } else semParametro();
  } catch(e){ semParametro(); }
}

window.addEventListener('resize', medirBarra);
iniciar();
</script>
