<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chamada — Instituto Veridiana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* A fonte entra por JS de propósito: um <link rel="stylesheet"> comum
   bloqueia a primeira pintura, e em 4G ruim isso é 1 segundo de tela
   branca. Assim o texto aparece na hora com a fonte do sistema e a
   Plus Jakarta Sans troca sozinha quando chega. */
(function () {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap';
  document.head.appendChild(l);
})();
</script>
<style>
:root{
  --roxo:#4A1D6E; --roxo-fundo:#3A1556;
  /* pares fraco/claro do roxo, seguindo o mesmo padrao dos estados */
  --roxo-fraco:#EDE4F3; --roxo-claro:#D6C3E8;

  --tinta:#1B1020; --fundo:#F4F1F7; --papel:#FFFFFF;
  --borda:#E5DCEC; --apagado:#6B5E78;

  --presente:#16704A; --presente-fraco:#E8F3ED;
  --falta:#AF2338;    --falta-fraco:#FBEAEE;
  --justif:#8A6314;   --justif-fraco:#FAF2E1;

  --r-p:10px; --r-m:14px; --r-g:22px;
  --sombra:0 1px 2px rgba(27,16,32,.05), 0 8px 24px rgba(27,16,32,.06);
  --curva:cubic-bezier(.32,.72,0,1);
  --barra-h:0px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}

html{background:var(--fundo)}
/* clip corta o transbordo lateral SEM virar container de rolagem.
   Com overflow-x:hidden aqui, o position:sticky do cabecalho para
   de grudar e a barra roxa some ao rolar. */
html{overflow-x:clip}
html,body{max-width:100%}

body{
  margin:0; background:var(--fundo); min-height:100vh; color:var(--tinta);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  /* nada de selecao de texto nem menu de long-press: o toque aqui e um
     controle, nao um paragrafo. Campos de digitacao reativam abaixo. */
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  padding-bottom:var(--barra-h);
}

input,textarea{-webkit-user-select:text;user-select:text}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

:focus-visible{outline:3px solid var(--roxo);outline-offset:2px;border-radius:var(--r-p)}
.sobre-roxo :focus-visible{outline-color:#fff}

/* ─────────── cabecalho fixo ─────────── */
.cab{
  position:sticky; top:0; z-index:30;
  background:var(--roxo); color:#fff;
  padding-top:env(safe-area-inset-top);
  transition:box-shadow 200ms var(--curva);
}
.cab .linha{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 4px;
  max-width:644px;margin:0 auto}
.cab .icone{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-items:center;border-radius:var(--r-p);
  transition:background 160ms var(--curva);
}
.cab .icone:active{background:rgba(255,255,255,.16)}
.cab .meio{flex:1;min-width:0;position:relative}
.cab .marca{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--roxo-claro);
  white-space:nowrap;opacity:1;transition:opacity 200ms var(--curva);pointer-events:none;
}
body.rolou .cab .marca, body.semcapa .cab .marca{opacity:0}
.cab .compacto{
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0; transition:opacity 200ms var(--curva);
}
.cab .placar{
  flex-shrink:0;padding-right:12px;text-align:right;
  font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  opacity:0; transition:opacity 200ms var(--curva);
}
body.rolou .cab{box-shadow:0 1px 0 rgba(0,0,0,.14), 0 6px 16px rgba(27,16,32,.16)}
body.rolou .cab .compacto,
body.rolou .cab .placar{opacity:1}
/* em telas sem capa (gestão) o título já nasce visível */
body.semcapa .cab .compacto{opacity:1}

/* ─────────── capa roxa que rola ─────────── */
.capa{background:var(--roxo);color:#fff;padding:4px 20px 24px}
.capa .topo{display:flex;align-items:flex-end;gap:16px;max-width:620px;margin:0 auto}
.capa h1{
  margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
  flex:1;min-width:0;overflow-wrap:anywhere;
}
.capa .data{margin:4px 0 0;font-size:14px;color:var(--roxo-claro)}
.capa .conta{text-align:right;flex-shrink:0;line-height:1}
.capa .conta b{font-size:32px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.capa .conta span{display:block;font-size:13px;color:var(--roxo-claro);margin-top:4px;font-weight:500}

main{padding:0 0 24px}
.corpo{padding:20px 16px 0;max-width:620px;margin:0 auto}

/* ─────────── cartao do professor ─────────── */
.prof{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:12px 16px;margin-bottom:20px;text-align:left;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  transition:background 160ms var(--curva);
}
.prof:active{background:var(--fundo)}
.prof .ini{flex-shrink:0}
.prof .txt{flex:1;min-width:0}
.prof .txt small{display:block;font-size:13px;color:var(--apagado);line-height:1.3}
.prof .txt b{font-size:16px;font-weight:600;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof[data-vazio="true"] .txt b{color:var(--apagado);font-weight:400}
.prof .seta{flex-shrink:0;color:var(--apagado)}

/* ─────────── instrucao ─────────── */
.instrucao{
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;margin-bottom:12px;padding-left:4px;
}
.instrucao span{font-size:14px;color:var(--apagado)}
.instrucao button{
  font-size:14px;font-weight:600;color:var(--roxo);
  min-height:44px;padding:0 12px;margin:0 -4px 0 0;border-radius:var(--r-p);
}
.instrucao button:active{background:var(--roxo-fraco)}

/* ─────────── aviso ─────────── */
.aviso{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--justif-fraco);border:1px solid #E7D4A8;color:#6B4E12;
  padding:12px 16px;border-radius:var(--r-m);font-size:14px;margin-bottom:16px;
}
.aviso svg{flex-shrink:0;margin-top:2px}

/* ─────────── lista agrupada ─────────── */
/* Uma superficie so, com fios internos. Vinte cartoes flutuando cada um
   com sua sombra e o visual de dashboard web, nao de lista de aplicativo. */
.lista{
  list-style:none;margin:0 0 16px;padding:0;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);overflow:hidden;
}
.li{
  position:relative;display:flex;align-items:center;gap:12px;
  padding:12px 16px;min-height:64px;
  transition:background 160ms var(--curva);
}
.li+.li::before{
  content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--borda);
}
.li[data-st="Falta"]{background:var(--falta-fraco)}
.li[data-st="Justificada"]{background:var(--justif-fraco)}
.li.tocado{background:var(--roxo-fraco)}
.li[data-st="Falta"].tocado{background:#F6DDE3}
.li[data-st="Justificada"].tocado{background:#F5EAD3}

.ini{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--roxo-fraco);color:var(--roxo);
  font-size:13px;font-weight:700;letter-spacing:.02em;
  transition:background 160ms var(--curva),color 160ms var(--curva);
}
.li[data-st="Falta"] .ini{background:var(--falta);color:#fff}
.li[data-st="Justificada"] .ini{background:var(--justif);color:#fff}

.nome{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}

.marca{flex-shrink:0;display:grid;place-items:center}
.marca .ok{
  width:26px;height:26px;border-radius:50%;
  background:var(--presente-fraco);color:var(--presente);
  display:grid;place-items:center;
}
.marca .selo{
  padding:6px 12px;border-radius:999px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.li[data-st="Falta"] .selo{background:var(--falta);color:#fff}
.li[data-st="Justificada"] .selo{background:var(--justif);color:#fff}

/* ─────────── barra de salvar ─────────── */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--fundo);border-top:1px solid var(--borda);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.barra .dentro{max-width:620px;margin:0 auto}
.salvar{
  width:100%;min-height:52px;padding:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:17px;font-weight:700;letter-spacing:-.01em;
  color:#fff;background:var(--roxo);border-radius:var(--r-m);
  transition:background 160ms var(--curva);
}
.salvar:active{background:var(--roxo-fundo)}
.salvar:disabled{background:#AC9BBA}

/* ─────────── bottom sheet ─────────── */
.veu{
  position:fixed;inset:0;z-index:40;background:rgba(27,16,32,.5);
  opacity:0;transition:opacity 240ms var(--curva);pointer-events:none;
}
.veu[data-aberto="true"]{opacity:1;pointer-events:auto}

.folha{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--papel);
  border-radius:var(--r-g) var(--r-g) 0 0;
  padding:8px 0 calc(12px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform 300ms var(--curva);
  max-height:80vh;display:flex;flex-direction:column;
}
.folha[data-aberto="true"]{transform:translateY(0)}
.folha.arrastando{transition:none}
.puxador{width:38px;height:4px;border-radius:999px;background:#D9CFE2;margin:4px auto 12px;flex-shrink:0}
.folha h2{margin:0 20px 8px;font-size:17px;font-weight:700;letter-spacing:-.015em;flex-shrink:0}
.folha .sub{margin:0 20px 12px;font-size:14px;color:var(--apagado);flex-shrink:0}
.folha .rolo{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px}
.folha ul{list-style:none;margin:0;padding:0}
.folha .opc{
  width:100%;display:flex;align-items:center;gap:12px;
  min-height:56px;padding:12px;text-align:left;
  font-size:16px;font-weight:600;border-radius:var(--r-p);
  transition:background 160ms var(--curva);
}
.folha .opc:active{background:var(--fundo)}
.folha .opc .cv{margin-left:auto;color:var(--roxo);opacity:0;flex-shrink:0}
.folha .opc[aria-selected="true"] .cv{opacity:1}
.folha .opc.perigo{color:var(--falta)}
.folha .opc small{display:block;font-size:13px;font-weight:400;color:var(--apagado)}
.folha .opc .ini{width:34px;height:34px;flex-basis:34px}
.folha .acoes{display:flex;gap:8px;padding:12px 20px 0;flex-shrink:0}
.folha .acoes button{
  flex:1;min-height:52px;border-radius:var(--r-m);font-size:16px;font-weight:700;
  transition:background 160ms var(--curva);
}
.folha .acoes .cancelar{background:var(--fundo);color:var(--tinta)}
.folha .acoes .cancelar:active{background:var(--borda)}
.folha .acoes .confirmar{background:var(--falta);color:#fff}
.folha .acoes .confirmar:active{background:#8E1B2C}

/* ─────────── toast ─────────── */
.toast{
  position:fixed;z-index:60;left:16px;right:16px;
  bottom:calc(16px + var(--barra-h) + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
  display:flex;align-items:flex-start;gap:12px;
  background:var(--tinta);color:#fff;
  padding:12px 16px;border-radius:var(--r-m);
  font-size:15px;font-weight:500;line-height:1.35;
  box-shadow:0 12px 32px rgba(27,16,32,.32);
  transform:translateY(150%);opacity:0;pointer-events:none;
  transition:transform 340ms var(--curva),opacity 200ms var(--curva);
}
.toast[data-aberto="true"]{transform:translateY(0);opacity:1;pointer-events:auto}
.toast svg{flex-shrink:0;margin-top:2px}
.toast .acao{align-self:center}
.toast span{flex:1;min-width:0}
.toast[data-tipo="erro"]{background:#7E1828}
.toast .acao{
  flex-shrink:0;font-size:15px;font-weight:700;color:#fff;
  min-height:44px;min-width:44px;padding:0 8px;margin:-8px 0;
  text-decoration:underline;
}

/* ─────────── esqueleto ─────────── */
.osso{
  background:linear-gradient(90deg,#E9E2EF 25%,#F2EDF6 50%,#E9E2EF 75%);
  background-size:200% 100%;animation:brilho 1.4s linear infinite;border-radius:var(--r-p);
}
@keyframes brilho{to{background-position:-200% 0}}
.esq{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
.esq+.esq{border-top:1px solid var(--borda)}
.esq .c{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.esq .t{height:14px;flex:1}
.esq .s{width:26px;height:26px;border-radius:50%;flex-shrink:0}

/* ─────────── estados de tela inteira ─────────── */
.estado{text-align:center;padding:48px 24px}
.estado .circulo{
  width:64px;height:64px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;background:var(--roxo-fraco);color:var(--roxo);
}
.estado h2{font-size:21px;margin:0 0 8px;letter-spacing:-.015em}
.estado p{color:var(--apagado);margin:0;font-size:15px;line-height:1.5}
.estado .botao{
  display:inline-block;margin-top:24px;padding:16px 24px;min-height:52px;
  font-size:16px;font-weight:600;color:var(--roxo);
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
}

/* ─────────── sucesso ─────────── */
/* O unico momento de movimento do aplicativo. Tudo o mais entra parado. */
.fim{
  min-height:calc(100vh - 56px);background:var(--roxo);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;
}
.fim .selo-ok{
  width:88px;height:88px;border-radius:50%;margin-bottom:24px;
  background:rgba(255,255,255,.14);display:grid;place-items:center;
}
/* Visível por padrão; a animação só desenha a entrada. Antes o estado
   base era escondido, e qualquer coisa que impedisse a animação deixava
   o check invisível para sempre. */
.fim .selo-ok svg path{
  stroke-dasharray:32;
  animation:risca 420ms var(--curva) 120ms both;
}
@keyframes risca{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
.fim h2{font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
.fim p{margin:0;color:var(--roxo-claro);font-size:16px;line-height:1.5}
.fim .botao{
  margin-top:32px;padding:16px 24px;min-height:52px;
  font-size:16px;font-weight:700;color:#fff;
  border:1px solid rgba(255,255,255,.35);border-radius:var(--r-m);
  transition:background 160ms var(--curva);
}
.fim .botao:active{background:rgba(255,255,255,.14)}

/* ─────────── cartoes de navegacao ─────────── */
.cartoes{list-style:none;margin:0;padding:0}
.cartoes li{margin-bottom:12px}
.cartoes .item{
  width:100%;display:flex;align-items:center;gap:12px;
  text-align:left;padding:16px;min-height:64px;
  font-size:17px;font-weight:600;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  transition:background 160ms var(--curva);
}
.cartoes .item:active{background:var(--fundo)}
.cartoes .item .txt{flex:1;min-width:0}
.cartoes .item small{display:block;font-size:13px;font-weight:400;color:var(--apagado);margin-top:2px}
.cartoes .item .seta{margin-left:auto;color:var(--apagado);flex-shrink:0}

/* ─────────── histórico ─────────── */
.passo{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  padding:4px;margin-bottom:16px;
}
.passo b{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:-.01em}
.passo button{
  width:44px;height:44px;flex:0 0 44px;border-radius:var(--r-p);
  display:grid;place-items:center;color:var(--roxo);
  transition:background 160ms var(--curva);
}
.passo button:active{background:var(--roxo-fraco)}
.passo button:disabled{color:var(--borda)}

.resumo{
  background:var(--roxo);color:#fff;border-radius:var(--r-m);
  padding:20px;text-align:center;
}
.resumo b{display:block;font-size:32px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.resumo span{display:block;font-size:14px;color:var(--roxo-claro);margin-top:4px}

.dia{font-size:13px;font-weight:600;color:var(--apagado);margin:16px 4px 8px}
.nome small{display:block;font-size:13px;font-weight:400;color:var(--apagado);margin-top:2px}
.pct{
  flex-shrink:0;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--apagado);
}
.pct.cheio{color:var(--presente)}
/* lista sem avatar: o fio interno alinha com o texto, nao com o circulo */
.lista.sem-avatar .li+.li::before{left:16px}

.cartao-info{
  background:var(--papel);border:1px solid var(--borda);
  border-radius:var(--r-m);box-shadow:var(--sombra);
  padding:20px;margin-bottom:12px;text-align:center;color:var(--roxo);
}
.cartao-info b{display:block;font-size:17px;font-weight:700;color:var(--tinta);margin:12px 0 4px}
.cartao-info span{display:block;font-size:14px;color:var(--apagado);line-height:1.5}

.botao-cheio{
  width:100%;min-height:52px;padding:16px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;color:#fff;background:var(--roxo);
  text-decoration:none;transition:background 160ms var(--curva);
}
.botao-cheio:active{background:var(--roxo-fundo)}
.botao-cheio:disabled{background:#AC9BBA}

/* ─────────── caixa ─────────── */
.saldo{
  background:var(--roxo);color:#fff;border-radius:var(--r-m);
  padding:20px;text-align:center;margin-bottom:8px;
}
.saldo>span{display:block;font-size:13px;color:var(--roxo-claro)}
.saldo>b{
  display:block;font-size:32px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;margin-top:4px;
}
.saldo-linha{
  display:flex;gap:8px;margin-top:16px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.2);
}
.saldo-linha div{
  flex:1;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
}
.saldo-linha small{display:block;font-size:12px;color:var(--roxo-claro);font-weight:400;margin-top:2px}
.saldo-linha .ent{color:#A8E6C6}
.saldo-linha .sai{color:#F2B8C2}

.dinheiro{
  flex-shrink:0;font-size:16px;font-weight:700;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.dinheiro.ent{color:var(--presente)}
.dinheiro.sai{color:var(--falta)}

.bt-entrada,.bt-saida{
  flex:1;min-height:52px;border-radius:var(--r-m);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16px;font-weight:700;color:#fff;
  transition:background 160ms var(--curva);
}
.bt-entrada{background:var(--presente)}
.bt-entrada:active{background:#115A3B}
.bt-saida{background:var(--falta)}
.bt-saida:active{background:#8E1B2C}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:10px 14px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--apagado);
  background:var(--fundo);border:1px solid var(--borda);
  transition:background 160ms var(--curva),color 160ms var(--curva);
}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}

.campo label i{font-style:normal;font-weight:400;color:var(--apagado)}

    alunosParaCertificado: function(pin, turma){
      exigirPin(pin);
      var min = {}; TURMAS.forEach(function(t){ min[t.nome] = t.minutos || 60; });
      var h = {};
      REGISTROS.forEach(function(r){
        if (!h[r.aluno]) h[r.aluno] = {primeira:r.data, ultima:r.data, aulas:0, minutos:0};
        var x = h[r.aluno];
        if (r.data < x.primeira) x.primeira = r.data;
        if (r.data > x.ultima) x.ultima = r.data;

      });
      return ALUNOS.filter(function(a){ return !turma || a.turma === turma; })
        .map(function(a){
          var x = h[a.nome];
          return { nome:a.nome, turma:a.turma, ativo:a.ativo,
                   aulas: x ? x.aulas : 0, horas: x ? Math.round(x.minutos/60) : 0,
                   desde: x ? x.primeira : '', homonimo:false,

    gerarCertificado: function(pin, nomes, turma){
      exigirPin(pin);

      var comAula = API.alunosParaCertificado(pin, '').filter(function(a){
        return lista.indexOf(a.nome) !== -1 && a.aulas > 0;

      if (!comAula.length) throw new Error('Nenhum desses alunos tem presença registrada ainda.');
      return { ok:true,
        url:'https://drive.google.com/file/d/1EXEMPLO_CERTIFICADO_0000000/view',
        nome: comAula.length === 1

          : 'Certificados — ' + (turma || 'vários') + ' — ' + hoje() + '.pdf',
        quantidade: comAula.length, completo:true,

        publico: comAula.length === 1,
        ignorados: lista.filter(function(n){ return comAula.indexOf(n) === -1; }) };

    mesesCaixa: function(pin){
      exigirPin(pin);
      var v = {}; CAIXA.forEach(function(r){ v[r.data.slice(0,7)] = 1; });
      var ms = Object.keys(v).sort().reverse();
      var ag = hoje().slice(0,7);
      if (ms.indexOf(ag) === -1) ms.unshift(ag);
      return ms;
    },
    listarCaixa: function(pin, mes){
      exigirPin(pin);
      var doMes = CAIXA.filter(function(r){ return r.data.slice(0,7) === mes; });
      var entrou = 0, saiu = 0;
      doMes.forEach(function(r){ if (r.tipo === 'Entrada') entrou += r.valor; else saiu += r.valor; });
      var acc = 0;
      CAIXA.forEach(function(r){
        if (r.data.slice(0,7) > mes) return;
        acc += (r.tipo === 'Entrada' ? r.valor : -r.valor);
      });
      doMes.sort(function(a,b){ return a.data === b.data ? b.linha - a.linha : (a.data < b.data ? 1 : -1); });
      return { mes:mes, lancamentos:doMes.slice(), entrou:entrou, saiu:saiu,
               doMes:entrou-saiu, acumulado:acc,
               categorias:{Entrada:CAT_ENTRADA, 'Saída':CAT_SAIDA}, fontes:fontesUsadas() };
    },
    lancarCaixa: function(pin, d){
      exigirPin(pin);
      var tipo = d.tipo === 'Entrada' ? 'Entrada' : (d.tipo === 'Saída' ? 'Saída' : '');
      if (!tipo) throw new Error('Diga se é entrada ou saída.');
      var valor = valorNumero(d.valor);
      if (!(valor > 0)) throw new Error('Escreva um valor maior que zero.');
      CAIXA.push({ registro:'', data:d.data || hoje(), tipo:tipo, valor:valor,
        categoria:d.categoria || 'Outro', descricao:d.descricao || '', fonte:d.fonte || '',
        comprovante: d.foto ? 'https://drive.google.com/mock' : '',
        quem:d.quem || '', linha: proximaLinha++ });
      return { ok:true, comFoto: !!d.foto, pediuFoto: !!d.foto };
    },
    apagarLancamento: function(pin, linha, valorConfere){
      exigirPin(pin);
      var i = CAIXA.findIndex(function(r){ return String(r.linha) === String(linha); });
      if (i === -1) throw new Error('Lançamento não encontrado.');
      if (valorConfere !== undefined && Math.abs(CAIXA[i].valor - Number(valorConfere)) > 0.005)
        throw new Error('A lista mudou desde que você abriu. Recarregue e tente de novo.');
      CAIXA.splice(i,1); return {ok:true};
    },
    resumoCaixa: function(pin, ini, fim){
      exigirPin(pin);
      if (ini > fim) throw new Error('A data de início vem depois da data de fim.');
      var doP = CAIXA.filter(function(r){ return r.data >= ini && r.data <= fim; });
      var cat = {Entrada:{}, 'Saída':{}}, fon = {}, entrou = 0, saiu = 0, sem = 0;
      doP.forEach(function(r){
        var lado = r.tipo === 'Entrada' ? 'Entrada' : 'Saída';
        cat[lado][r.categoria] = (cat[lado][r.categoria] || 0) + r.valor;
        var f = r.fonte || 'Sem fonte informada';
        if (!fon[f]) fon[f] = {fonte:f, entrou:0, saiu:0};
        if (lado === 'Entrada'){ fon[f].entrou += r.valor; entrou += r.valor; }
        else { fon[f].saiu += r.valor; saiu += r.valor; if (!r.comprovante) sem++; }
      });
      function ord(m){ return Object.keys(m).map(function(k){ return {nome:k, valor:m[k]}; })
        .sort(function(a,b){ return b.valor - a.valor; }); }
      return { inicio:ini, fim:fim, entrou:entrou, saiu:saiu, saldo:entrou-saiu,
               lancamentos:doP.length, semComprovante:sem,
               entradas:ord(cat.Entrada), saidas:ord(cat['Saída']),
               fontes:Object.keys(fon).map(function(k){ return fon[k]; })
                 .sort(function(a,b){ return (b.entrou+b.saiu)-(a.entrou+a.saiu); }) };

               nome:'Frequência — Veridiana' };

    mesesComChamada: function(pin){
      exigirPin(pin);

      exigirPin(pin);

    alunosEmRisco: function(pin, minimo){
      exigirPin(pin);
      var alvo = Math.max(2, Number(minimo) || 3);
      var datas = {}, st = {};
      REGISTROS.forEach(function(r){
        if (!datas[r.turma]) datas[r.turma] = {};
        datas[r.turma][r.data] = 1;
        st[r.turma+'|'+r.aluno+'|'+r.data] = r.status;
      });
      Object.keys(datas).forEach(function(t){
        datas[t] = Object.keys(datas[t]).sort().reverse();
      });
      var fora = [];
      ALUNOS.forEach(function(a){
        if (!a.ativo) return;
        var ds = datas[a.turma];
        if (!ds || !ds.length) return;
        var seguidas=0, just=0, ult='', desde='';
        for (var i=0;i<ds.length;i++){
          var x = st[a.turma+'|'+a.nome+'|'+ds[i]];
          if (x === undefined) break;
          if (x === 'Presente'){ ult = ds[i]; break; }
          seguidas++; if (x === 'Justificada') just++;
          desde = ds[i];
        }
        if (seguidas >= alvo) fora.push({ aluno:a.nome, turma:a.turma, faltas:seguidas,
          justificadas:just, desde:desde, ultimaPresenca:ult,
          responsavel:a.responsavel, telefone:a.telefone, idade:idadeEm(a.nascimento) });
      });
      fora.sort(function(x,y){ return y.faltas - x.faltas || pt(x.aluno,y.aluno); });
      return { minimo:alvo, alunos:fora };
    },
    contarRisco: function(pin){ return API.alunosEmRisco(pin, 3).alunos.length; },
    aniversariantesSemana: function(pin){ exigirPin(pin); return aniversariosEntre(0, 6, ''); },
    relatorioPeriodo: function(pin, ini, fim){
      exigirPin(pin);
      if (ini > fim) throw new Error('A data de início vem depois da data de fim.');
      var linhas = REGISTROS.filter(function(r){ return r.data >= ini && r.data <= fim; });
      var ben = {}, aulas = {}, pt2 = {};
      linhas.forEach(function(r){
        ben[r.aluno] = 1; aulas[r.data+'|'+r.turma] = 1;
        if (!pt2[r.turma]) pt2[r.turma] = {turma:r.turma, dias:{}, alunos:{}, presentes:0, total:0};
        var t = pt2[r.turma];
        t.dias[r.data]=1; t.alunos[r.aluno]=1; t.total++;
        if (r.status==='Presente') t.presentes++;
      });
      var idades = {};
      ALUNOS.forEach(function(a){ idades[a.nome] = idadeEm(a.nascimento); });
      var faixas = {'Crianças (até 11)':0,'Adolescentes (12 a 17)':0,'Jovens (18 a 29)':0,'Sem data de nascimento':0};
      Object.keys(ben).forEach(function(n){
        var i = idades[n];
        if (i === null || i === undefined) faixas['Sem data de nascimento']++;
        else if (i <= 11) faixas['Crianças (até 11)']++;
        else if (i <= 17) faixas['Adolescentes (12 a 17)']++;
        else faixas['Jovens (18 a 29)']++;
      });
      var turmas = Object.keys(pt2).map(function(k){
        var t = pt2[k];
        return {turma:t.turma, aulas:Object.keys(t.dias).length, alunos:Object.keys(t.alunos).length,
                presentes:t.presentes, total:t.total,
                pct: t.total ? Math.round(t.presentes*100/t.total) : 0};
      }).sort(function(a,b){ return pt(a.turma,b.turma); });
      var P=0,T=0; turmas.forEach(function(t){ P+=t.presentes; T+=t.total; });
      return { inicio:ini, fim:fim, completo:true, beneficiarios:Object.keys(ben).length,
               aulas:Object.keys(aulas).length, turmas:turmas, faixas:faixas,
               frequencia: T ? Math.round(P*100/T) : 0 };
    },
    resumoHistorico: function(pin, mes){
      exigirPin(pin);
      var doMes = REGISTROS.filter(function(r){ return r.data.slice(0,7) === mes; });
      var mapa = {}, porTurma = {};
      doMes.forEach(function(r){
        var k = r.data + '|' + r.turma;
        if (!mapa[k]) mapa[k] = {data:r.data, turma:r.turma, professor:r.professor, presentes:0, total:0};

        if (!porTurma[r.turma]) porTurma[r.turma] = {turma:r.turma, dias:{}, presentes:0, total:0};

        porTurma[r.turma].total++;
        if (r.status === 'Presente') porTurma[r.turma].presentes++;

  /* ─── a ponte, igualzinha à do Apps Script ─── */
  function Corredor(ok, err){ this._ok = ok; this._err = err; }
  Corredor.prototype.withSuccessHandler = function(f){ return new Corredor(f, this._err); };

          if (err) err(new Error('Falha de rede simulada.')); return;

        var r;
        try { r = API[nome].apply(null, args); }
        catch (e){ if (err) err(e); return; }
        if (ok) ok(JSON.parse(JSON.stringify(r)));
      }, espera);
      console.log('[mock] ' + nome, args);
    };
  });

})();

/* ─── utilidades ─── */
function el(id){ return document.getElementById(id); }

/* A coluna Comprovante é texto livre na planilha. Quem tem acesso de
   edição pode escrever javascript:... ali, e o link viraria execução de
   código ao ser tocado. Só http(s) passa. */
function urlSegura(u){
  return /^https?:\/\//i.test(String(u || '')) ? String(u) : '';
}
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function iniciais(n){
  var p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return '?';
  return (p[0].charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}
var DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
             'agosto','setembro','outubro','novembro','dezembro'];
function dataExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length !== 3) return '';
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return DIAS[d.getDay()] + ', ' + (+p[2]) + ' de ' + MESES[+p[1]-1];
}
function mesExtenso(iso){
  var p = String(iso || '').split('-');
  if (p.length < 2) return '';
  var m = MESES[+p[1] - 1] || '';
  return m.charAt(0).toUpperCase() + m.slice(1) + ' de ' + p[0];
}
function dataCurta(iso){
  var p = String(iso || '').split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : '';
}
/* Monta o link do WhatsApp. Número guardado só com dígitos; se vier sem
   o 55 do Brasil, entra na hora. */
function linkZap(tel, texto){
  var n = String(tel || '').replace(/[^0-9]/g, '');
  if (!n) return '';
  if (n.length <= 11) n = '55' + n;
  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(texto);
}
function vibrar(){ try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){} }
function sorteioToken(){
  return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 10);
}
function semAcento(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
}
function plural(n, um, muitos){ return n + ' ' + (n === 1 ? um : muitos); }
function primeiroNome(n){ return String(n || '').trim().split(/\s+/)[0] || ''; }
function hojeISO(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
         '-' + String(d.getDate()).padStart(2,'0');
}
function reais(v){
  var n = Number(v || 0);
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function copiar(txt){
  function ok(){ vibrar(); toast('Link copiado'); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, function(){ copiaAntiga(txt, ok); });
  } else copiaAntiga(txt, ok);
}
function copiaAntiga(txt, ok){
  var a = document.createElement('textarea');
  a.value = txt; a.setAttribute('readonly','');
  a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(a); a.focus(); a.select();
  var deu = false;
  try { deu = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(a);
  if (deu) ok(); else toast('Não deu para copiar sozinho. Segure o dedo no link.', 'erro');
}

/* ─── ponte com o Apps Script, com prazo ─── */
/* Sem prazo, um 4G que cai deixa o botao em "Salvando..." para sempre.
   Gerar PDF passa o prazo maior: o Drive leva seus segundos. */
function api(fn, args, ok, erro, prazo){
  /* Sem a ponte do Apps Script isto lançava ReferenceError dentro do
     depois() e a tela ficava no esqueleto para sempre, sem mensagem. */
  if (typeof google === 'undefined' || !google.script || !google.script.run){
    if (erro) erro({ message: 'A conexão com a planilha não abriu. Recarregue a página.' });
    return;
  }
  var fim = false;
  var t = setTimeout(function(){
    if (fim) return; fim = true;
    if (erro) erro({ message:'A internet demorou demais para responder.' });
  }, prazo || 25000);
  function pronto(f){ return function(v){ if (fim) return; fim = true; clearTimeout(t); f(v); }; }
  /* Escrita que deu certo derruba a memória de leitura. */
  var okFinal = LEITURAS[fn] ? ok : function(v){ MEM = {}; MEM_GEN++; ok(v); };
  var r = google.script.run
    .withSuccessHandler(pronto(okFinal))
    .withFailureHandler(pronto(erro || function(){}));
  r[fn].apply(r, args || []);
}

/* ─── leitura com memória ───
   Cada ida ao Apps Script custa de meio a dois segundos, e isso não
   se otimiza do lado de cá. O que dá para fazer é não esperar por ela:
   tela já vista aparece na hora com o dado que tinha, e o dado novo
   chega por trás e repinta só se mudou. Qualquer escrita apaga a
   memória inteira: depois de salvar, nada velho aparece. */
var LEITURAS = {
  listarTurmas:1, carregarTurma:1, resumoInicial:1, modulo:1,
  listarAgenda:1, listarAgendaAno:1, datasFixas:1,
  listarMateriais:1, listarCategorias:1, listarLocais:1,
  entrarNaGestao:1, listarTurmasCompleto:1, listarAlunos:1, listarProfessores:1,
  mesesCaixa:1, listarCaixa:1, resumoCaixa:1, mesesComChamada:1, resumoHistorico:1,
  alunosParaCertificado:1, alunosEmRisco:1, contarRisco:1, aniversariantesSemana:1,
  relatorioPeriodo:1, obterUrlApp:1, obterLinkPlanilha:1
};
var MEM = {}, PEND = {}, MEM_GEN = 0;

function buscar(fn, args, k, ok, erro){
  if (PEND[k]){ PEND[k].push([ok, erro]); return; }
  PEND[k] = [[ok, erro]];
  var gen = MEM_GEN;
  api(fn, args, function(v){
    var j = JSON.stringify(v);
    /* Resposta que saiu antes de uma escrita não entra na memória. */
    if (gen === MEM_GEN) MEM[k] = {j:j, t:Date.now()};
    var l = PEND[k] || []; delete PEND[k];
    l.forEach(function(x){ x[0](j); });
  }, function(e){
    var l = PEND[k] || []; delete PEND[k];
    l.forEach(function(x){ if (x[1]) x[1](e); });
  });
}

/* o.fresco (ms): usa a memória só se for mais nova que isso, e responde
   uma vez só. Para quem não aguenta ser repintado — a chamada, que
   apagaria as faltas marcadas, e formulário, que apagaria o digitado. */
function ler(fn, args, ok, erro, o){
  o = o || {};
  var k = fn + JSON.stringify(args || []), m = MEM[k];
  /* Resposta de uma tela que a pessoa já deixou não pinta nada. Sem
     isto, voltar rápido da lista de turmas e entrar na Agenda fazia a
     lista chegar atrasada e ser desenhada por cima da agenda. */
  var tela = atual();
  function viva(){ return atual() === tela; }
  if (m && o.fresco){
    if (Date.now() - m.t < o.fresco){ ok(JSON.parse(m.j)); return; }
    m = null;
  }
  if (m) ok(JSON.parse(m.j));
  buscar(fn, args || [], k, function(j){
    if (viva() && (!m || j !== m.j)) ok(JSON.parse(j));
  }, function(e){ if (viva() && !m && erro) erro(e); });
}

/* Busca antes de a pessoa pedir. Não repete o que chegou há pouco. */
function preler(fn, args){
  var k = fn + JSON.stringify(args || []), m = MEM[k];
  if (m && Date.now() - m.t < 30000) return;
  buscar(fn, args || [], k, function(){}, null);
}

/* O Apps Script embrulha o erro e chega "Error: ...". Ninguem no
   instituto precisa ver isso. */
function textoErro(e){
  var m = (e && e.message) ? String(e.message) : '';
  m = m.replace(/^\s*(Error|Exception|ScriptError|GoogleJsonResponseException)\s*:\s*/i, '').trim();
  return m || 'Não deu certo. Tente de novo.';
}

/* ─── toast ─── */
var toastTimer;
function toast(texto, tipo, acao){
  var t = el('toast');
  el('toastIcone').innerHTML = ico(tipo === 'erro' ? 'alerta' : 'cheque');
  var alvo = el('toastTexto');
  alvo.textContent = texto;
  var velha = t.querySelector('.acao');
  if (velha) velha.remove();
  if (acao){
    var b = document.createElement('button');
    b.className = 'acao'; b.type = 'button'; b.textContent = acao.rotulo;
    b.addEventListener('click', function(){ fecharToast(); acao.fn(); });
    t.appendChild(b);
  }
  t.dataset.tipo = tipo || 'ok';
  t.dataset.aberto = 'true';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(fecharToast, acao ? 6000 : 3600);
}
function fecharToast(){ el('toast').dataset.aberto = 'false'; }

/* ─── bottom sheet reaproveitavel ─── */
var folhaAoFechar = null;
function abrirFolha(titulo, corpoHtml, aoFechar){
  /* Zera os handlers da folha anterior. pedirTexto e pedirFicha armam
     onkeydown; quem não rearma herdava o closure velho e o Enter
     explodia num campo que não existe mais. */
  el('folhaCorpo').onclick = null;
  el('folhaCorpo').onkeydown = null;
  el('folha').hidden = false;
  el('folhaTitulo').textContent = titulo;
  el('folhaCorpo').innerHTML = corpoHtml;
  el('folha').dataset.aberto = 'true';
  el('veu').dataset.aberto = 'true';
  folhaAoFechar = aoFechar || null;
}
function fecharFolha(){
  el('folha').dataset.aberto = 'false';
  el('veu').dataset.aberto = 'false';
  el('folha').style.transform = '';
  /* Fechada só por transform, a folha continuava alcançável por Tab e
     lida pelo leitor de tela — que ficava preso num diálogo que o
     usuário acha que fechou. */
  setTimeout(function(){
    if (el('folha').dataset.aberto !== 'true'){
      el('folhaCorpo').innerHTML = '';
      el('folhaCorpo').onclick = null;
      el('folhaCorpo').onkeydown = null;
      el('folha').hidden = true;
    }
  }, 320);
  var f = folhaAoFechar; folhaAoFechar = null;
  if (f) f();
}
function folhaAberta(){ return el('folha').dataset.aberto === 'true'; }

/* opcoes: [{txt, sub, ini, icone, marcado, perigo, fn}] */
function folhaOpcoes(titulo, opcoes){
  var html = '<ul>';
  opcoes.forEach(function(o, i){
    html += '<li><button type="button" class="opc'+(o.perigo?' perigo':'')+'" data-op="'+i+'"'+
            (o.marcado !== undefined ? ' aria-selected="'+(o.marcado?'true':'false')+'"' : '')+'>';
    if (o.ini) html += '<span class="ini">'+esc(iniciais(o.ini))+'</span>';
    else if (o.icone) html += ico(o.icone);
    html += '<span>'+esc(o.txt)+(o.sub ? '<small>'+esc(o.sub)+'</small>' : '')+'</span>';
    if (o.marcado !== undefined) html += '<span class="cv">'+ico('cheque')+'</span>';
    html += '</button></li>';
  });
  abrirFolha(titulo, html + '</ul>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-op]');
    if (!b) return;
    var o = opcoes[+b.dataset.op];
    fecharFolha();
    if (o && o.fn) setTimeout(o.fn, 60);
  };
}

/* Folha com vários campos. campos = [{id, rotulo, valor, tipo, dica}] */
function pedirFicha(titulo, campos, rotuloBotao, fn){
  var h = '<div style="padding:0 8px">';
  campos.forEach(function(c){
    h += '<div class="campo"><label for="f_' + c.id + '">' + esc(c.rotulo) + '</label>' +
         '<input id="f_' + c.id + '" type="' + (c.tipo || 'text') + '" ' +
         'autocomplete="off" autocapitalize="' + (c.tipo === 'text' || !c.tipo ? 'words' : 'none') + '" ' +
         (c.dica ? 'placeholder="' + esc(c.dica) + '" ' : '') +
         'value="' + esc(c.valor || '') + '"></div>';
  });
  abrirFolha(titulo, h + '</div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var r = {};
    for (var i = 0; i < campos.length; i++){
      var c = campos[i], v = (el('f_' + c.id).value || '').trim();
      if (c.obrigatorio && v.length < 2){
        toast('Preencha ' + c.rotulo.toLowerCase() + '.', 'erro'); return;
      }
      r[c.id] = v;
    }
    fecharFolha(); setTimeout(function(){ fn(r); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('f_' + campos[0].id); if (i){ i.focus(); i.select(); } }, 320);
}

/* pedir um texto sem usar prompt() */
function pedirTexto(titulo, rotulo, valor, rotuloBotao, fn){
  abrirFolha(titulo,
    '<div style="padding:0 8px"><div class="campo"><label for="campoTxt">' + esc(rotulo) + '</label>' +
    '<input id="campoTxt" type="text" autocomplete="off" autocapitalize="words" ' +
    'spellcheck="false" value="' + esc(valor || '') + '"></div></div>' +
    '<div class="acoes"><button type="button" class="cancelar" data-t="0">Cancelar</button>' +
    '<button type="button" class="confirmar" style="background:var(--roxo)" data-t="1">' +
    esc(rotuloBotao) + '</button></div>');
  function enviar(){
    var v = (el('campoTxt').value || '').trim();
    if (v.length < 2){ toast('Escreva pelo menos 2 letras.', 'erro'); return; }
    fecharFolha(); setTimeout(function(){ fn(v); }, 60);
  }
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === '1') enviar(); else fecharFolha();
  };
  el('folhaCorpo').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); enviar(); } };
  setTimeout(function(){ var i = el('campoTxt'); if (i){ i.focus(); i.select(); } }, 320);
}

/* confirmacao de acao destrutiva */
function confirmar(titulo, texto, rotulo, fn){
  abrirFolha(titulo,
    '<p class="sub">'+esc(texto)+'</p>'+
    '<div class="acoes"><button type="button" class="cancelar" data-c="0">Cancelar</button>'+
    '<button type="button" class="confirmar" data-c="1">'+esc(rotulo)+'</button></div>');
  el('folhaCorpo').onclick = function(e){
    var b = e.target.closest('[data-c]');
    if (!b) return;
    var sim = b.dataset.c === '1';
    fecharFolha();
    if (sim) setTimeout(fn, 60);
  };
}

el('veu').addEventListener('click', fecharFolha);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && folhaAberta()) fecharFolha();
});

/* arrastar a folha para baixo para fechar */
(function(){
  var y0 = null, dy = 0, f = el('folha');
  function inicio(e){ if (!folhaAberta()) return; y0 = e.touches[0].clientY; dy = 0; f.classList.add('arrastando'); }
  function move(e){
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0){ f.style.transform = 'translateY('+dy+'px)'; }
  }
  function fim(){
    if (y0 === null) return;
    f.classList.remove('arrastando'); f.style.transform = '';
    if (dy > 90) fecharFolha();
    y0 = null;
  }
  ['puxador','folhaTitulo'].forEach(function(id){
    var n = el(id);
    n.addEventListener('touchstart', inicio, {passive:true});
    n.addEventListener('touchmove', move, {passive:true});
    n.addEventListener('touchend', fim);
    n.addEventListener('touchcancel', fim);
  });
})();

/* ─── roteador ─── */
var TELAS = {};
var ACOES = {};

function atual(){ return S.pilha[S.pilha.length-1]; }
function ir(t, p, raiz){ if (raiz) S.pilha = []; S.pilha.push({t:t, p:p||{}}); desenhar(); }
function trocar(t, p){ S.pilha[S.pilha.length-1] = {t:t, p:p||{}}; desenhar(); }
function voltar(){ if (S.pilha.length > 1){ S.pilha.pop(); desenhar(); } }

/* ─── módulos sob demanda ───
   A página só traz de saída o que a chamada e a tela inicial usam.
   Gestão, caixa, agenda e materiais chegam na primeira vez que alguém
   entra neles. O professor que escaneia o QR não baixa nada disso:
   a chamada, que é o que abre 20 vezes por dia, não paga pelo resto. */
var MODS = {};   /* nome -> true quando pronto, ou fila de espera */
function modPronto(nome){
  var fila = MODS[nome];
  MODS[nome] = true;
  if (fila && fila.forEach) fila.forEach(function(f){ f.ok(); });
}
function modDaTela(t){
  return /^ag/.test(t) ? 'agenda' : /^mt/.test(t) ? 'materiais' : 'gestao';
}
function carregarModulo(nome, ok, erro){
  ok = ok || function(){}; erro = erro || function(){};
  if (MODS[nome] === true){ ok(); return; }
  var jaPediu = !!MODS[nome];
  if (!jaPediu) MODS[nome] = [];
  MODS[nome].push({ok:ok, erro:erro});
  if (jaPediu) return;
  api('modulo', [nome], function(html){
    var fila = MODS[nome];
    /* innerHTML não executa <script>; cada bloco vira um elemento novo. */
    var re = /<(script|style)[^>]*>([\s\S]*?)<\/\1>/gi, m;
    while ((m = re.exec(html))){
      var n = document.createElement(m[1].toLowerCase());
      n.textContent = m[2];
      (m[1].toLowerCase() === 'style' ? document.head : document.body).appendChild(n);
    }
    if (MODS[nome] !== true){
      delete MODS[nome];
      fila.forEach(function(f){ f.erro({message:'Parte do app não carregou. Recarregue a página.'}); });
    }
  }, function(e){
    var fila = MODS[nome];
    delete MODS[nome];
    if (fila && fila.forEach) fila.forEach(function(f){ f.erro(e); });
  }, 40000);
}

/* Escrita pede o código. Se ainda não foi digitado nesta visita, passa
   pela tela do PIN e cai direto onde a pessoa queria ir. */
function comPin(tela, p){
  if (S.pin) ir(tela, p);
  else ir('pin', {para:tela, paraP:p || {}});
}
/* Para ação que acontece na própria tela: pede o código e volta. */
function pedirPin(){ ir('pin', {voltar:true}); }
ACOES.copiarLink = function(b){ copiar(b.getAttribute('data-u')); };

function desenhar(){
  var a = atual();
  if (!TELAS[a.t]){
    el('cabTitulo').textContent = '';
    el('btVoltar').hidden = S.pilha.length < 2;
    el('btVoltar').innerHTML = ico('esq', 24);
    el('btGestao').hidden = true;
    el('cabPlacar').hidden = true;
    document.body.classList.add('semcapa');
    el('palco').innerHTML = '<div class="corpo">' + esqueleto(4) + '</div>';
    el('barra').hidden = true; medirBarra();
    carregarModulo(modDaTela(a.t), function(){
      if (atual() === a) desenhar();
    }, function(e){
      if (atual() !== a) return;
      el('palco').innerHTML = '<div class="corpo">' +
        estado('alerta', 'Não deu para abrir', textoErro(e)) + '</div>';
    });
    return;
  }
  var tela = TELAS[a.t](a.p);

  el('cabTitulo').textContent = tela.titulo || '';
  el('btVoltar').hidden = S.pilha.length < 2 && !tela.voltar;
  el('btVoltar').innerHTML = ico('esq', 24);
  el('btGestao').hidden = !tela.gestao;
  el('btGestao').innerHTML = ico('engrenagem', 22);
  el('cabPlacar').hidden = !tela.placar;

  document.body.classList.toggle('semcapa', !tela.capa);
  el('palco').innerHTML = (tela.capa || '') +
    (tela.solto ? tela.html : '<div class="corpo">' + tela.html + '</div>');

  var b = el('barra');
  if (tela.barra){ el('barraDentro').innerHTML = tela.barra; b.hidden = false; }
  else { b.hidden = true; }
  medirBarra();

  /* O toast vive fora do #palco e sobrevivia 6 s à navegação. "Desfazer"
     e "Tentar de novo" rodavam sobre uma tela que não existe mais. */
  fecharToast();
  window.scrollTo(0, 0);
  document.body.classList.remove('rolou');
  if (tela.depois) tela.depois();
}

function medirBarra(){
  var b = el('barra');
  document.documentElement.style.setProperty('--barra-h',
    b.hidden ? '0px' : b.offsetHeight + 'px');
}

el('btVoltar').addEventListener('click', voltar);
el('btGestao').addEventListener('click', function(){ ir('pin'); });

/* Escuta no documento, não no #palco: a barra de ação (#barra) e o
   cabeçalho ficam FORA do palco, e um listener só no palco deixava
   "Salvar chamada", "Criar turma", "Adicionar aluno" e "Adicionar
   professor" sem resposta nenhuma. */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]');
  if (!b) return;
  var f = ACOES[b.getAttribute('data-acao')];
  if (f) f(b, e);
});

/* li[role=button] não sintetiza clique no Enter/Espaço como <button>.
   Sem isto, marcar falta e abrir aluno são inalcançáveis por teclado. */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var alvo = e.target;
  if (!alvo || !alvo.getAttribute || alvo.getAttribute('role') !== 'button') return;
  if (!alvo.hasAttribute('data-acao')) return;
  e.preventDefault();
  alvo.click();
});

window.addEventListener('scroll', function(){
  document.body.classList.toggle('rolou', window.scrollY > 32);
}, {passive:true});

/* realce de toque: sem isso a lista parece morta no Android */
(function(){
  var no = null, y0 = 0;
  function limpa(){ if (no){ no.classList.remove('tocado'); no = null; } }
  document.addEventListener('touchstart', function(e){
    var n = e.target.closest('.li[data-acao]');
    if (n){ no = n; y0 = e.touches[0].clientY; n.classList.add('tocado'); }
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (no && Math.abs(e.touches[0].clientY - y0) > 10) limpa();
  }, {passive:true});
  document.addEventListener('touchend', limpa);
  document.addEventListener('touchcancel', limpa);
})();

/* ─── esqueleto ─── */
function esqueleto(n){
  var h = '<ul class="lista">';
  for (var i = 0; i < (n || 6); i++){
    h += '<li class="esq"><div class="osso c"></div>' +
         '<div class="osso t" style="max-width:' + (48 + (i*17) % 38) + '%"></div>' +
         '<div class="osso s"></div></li>';
  }
  return h + '</ul>';
}
function estado(icone, titulo, texto, botao){
  return '<div class="estado"><div class="circulo">' + ico(icone, 30) + '</div>' +
         '<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p>' +
         (botao ? '<button type="button" class="botao" data-acao="' + botao.acao + '">' +
                  esc(botao.txt) + '</button>' : '') + '</div>';
}

function saudacao(){

/* Linhas de apoio chegam do servidor. Sem dado, a linha fica vazia —

var BLOCOS = [

TELAS.inicio = function(){

function pintarInicio(r){

  S.destaque = r.destaque || null;
  pintarDestaque(r.destaque);
  preCarregar(r.destaque);
}

/* Tela já pintada: agora sim vale buscar o resto em segundo plano, para
   a próxima tela abrir sem espera — o código das seções e os dados das
   mais usadas. Uma vez por visita. Via QR isto nunca roda. */
function preCarregar(d){
  if (S.preCarregou) return;
  S.preCarregou = true;
  setTimeout(function(){
    if (d && d.tipo === 'aula') preler('carregarTurma', [d.turma]);   // o cartão é o atalho mais tocado
    preler('listarTurmas', []);
    var h = hojeISO();
    preler('listarAgenda', [+h.slice(0,4), +h.slice(5,7)]);
    preler('listarMateriais', [{}]);
    carregarModulo('agenda', function(){
      carregarModulo('materiais', function(){ carregarModulo('gestao'); });
    });
  }, 300);
}

/* O atalho mais usado do sistema: a aula que deve estar começando, ou o
   evento de hoje. Um toque e está na chamada. */
function pintarDestaque(d){
  var box = el('destaque');
  if (!box) return;
  if (!d){ box.remove(); return; }
  var rotulo, titulo, sub, icone;
  if (d.tipo === 'aula'){
    rotulo = d.agora ? 'Aula agora' : 'Próxima aula';
    titulo = d.turma;
    sub = (d.hora ? 'costuma começar às ' + d.hora : 'costuma ter aula hoje') + ' · abrir chamada';
    icone = 'relogio';
  } else {
    rotulo = d.hoje ? 'Hoje na agenda' : 'Próximo na agenda';
    titulo = d.titulo;
    sub = (d.hoje ? '' : dataExtenso(d.data) + ' · ') + d.tipoEvento;

    '<span class="txt"><small>' + esc(rotulo) + '</small><b>' + esc(titulo) + '</b>' +
    '<span>' + esc(sub) + '</span></span>' +
    '<span class="seta">' + ico('dir') + '</span></button>';
}

};
